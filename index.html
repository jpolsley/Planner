<script>
const { useState, useEffect, useMemo, useRef, useCallback, Fragment } = React;
const html = htm.bind(React.createElement);

const PATHS = {
  today: 'M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M12 8a4 4 0 100 8 4 4 0 000-8z',
  cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
  tasks: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2',
  proj: 'M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4',
  notes: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
  gear: 'M12 9a3 3 0 100 6 3 3 0 000-6zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z',
  search: 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
  check: 'M5 12l5 5 9-10', lock: 'M6 11h12v9H6zM8 11V8a4 4 0 118 0v3', plus: 'M12 5v14M5 12h14', undo: 'M9 14L4 9l5-5M4 9h11a5 5 0 010 10h-3',
  spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z', x: 'M6 6l12 12M18 6L6 18', play: 'M7 5l12 7-12 7z', left: 'M15 6l-6 6 6 6', right: 'M9 6l6 6-6 6',
};
const Icon = ({ n, cls }) => html`<svg class=${cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${PATHS[n]} /></svg>`;

function useNow() {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(i); }, []);
  return now;
}

/* ================= App ================= */
function App() {
  const now = useNow();
  const [state, setState] = useState(() => loadState() || { v: 1, onboarded: false, settings: defaultSettings(), projects: [], tasks: [], events: [], notes: [], plan: null });
  const [view, setView] = useState(() => { try { return localStorage.getItem('kin.view') || 'today'; } catch (e) { return 'today'; } });
  const [toast, setToast] = useState(null);
  const [drawer, setDrawer] = useState(null); // {type:'task', id} | {type:'event', id|draft}
  const [search, setSearch] = useState(false);
  const [log, setLog] = useState([]);
  const [draft, setDraft] = useState(null);
  const hist = useRef([]);
  const [saveOk, setSaveOk] = useState(true);

  useEffect(() => { setSaveOk(saveState(state)); }, [state]);
  useEffect(() => { try { localStorage.setItem('kin.view', view); } catch (e) {} }, [view]);

  const commit = useCallback((fn, label) => {
    setState((prev) => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      if (next === prev) return prev;
      hist.current.push(prev); if (hist.current.length > 40) hist.current.shift();
      return next;
    });
    if (label) setToast({ text: label, undo: true, id: uid() });
  }, []);
  const undo = useCallback(() => {
    const prev = hist.current.pop();
    if (prev) { setState(prev); setToast({ text: 'Undone', id: uid() }); }
  }, []);
  useEffect(() => { const k = (e) => { const tag = (e.target.tagName || '').toLowerCase(); if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !['input', 'textarea'].includes(tag)) { e.preventDefault(); undo(); } if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearch(true); } }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, [undo]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), toast.text.length > 90 ? 15000 : 5000); return () => clearTimeout(t); }, [toast]);

  const computed = useMemo(() => runSchedule(state, now), [state.tasks, state.events, state.settings, now]);
  const auto = state.settings.autoApply;
  const plan = useMemo(() => {
    if (auto || !state.plan) return computed;
    const alive = new Set(state.tasks.filter((t) => t.status !== 'done').map((t) => t.id));
    const locked = computed.blocks.filter((b) => b.locked);
    return { ...computed, blocks: [...state.plan.blocks.filter((b) => alive.has(b.taskId) && !b.locked && b.end > now), ...locked].sort((a, b) => a.start - b.start) };
  }, [auto, computed, state.plan]);
  const pendingMoves = useMemo(() => {
    if (auto || !state.plan) return 0;
    const key = (b) => b.taskId + '@' + b.start;
    const a = new Set(plan.blocks.filter((b) => !b.locked).map(key));
    return computed.blocks.filter((b) => !b.locked && !a.has(key(b))).length;
  }, [auto, plan, computed]);
  useEffect(() => { if (!auto && !state.plan && state.onboarded) setState((s) => ({ ...s, plan: { blocks: computed.blocks } })); }, [auto]);
  const applyPlan = () => commit((s) => ({ ...s, plan: { blocks: computed.blocks } }), 'New plan applied');
  const alerts = useMemo(() => attention(state, computed, now), [state, computed, now]);

  /* ---- actions ---- */
  const A = useMemo(() => ({
    addTask: (o) => { const t = { id: uid(), status: 'todo', priority: 'med', duration: 30, deps: [], locked: [], spent: 0, created: Date.now(), ...o }; commit((s) => ({ ...s, tasks: [...s.tasks, t] })); return t; },
    updTask: (id, patch, label) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => (t.id === id ? { ...t, ...(typeof patch === 'function' ? patch(t) : patch) } : t)) }), label),
    delTask: (id) => commit((s) => ({ ...s, tasks: s.tasks.filter((t) => t.id !== id).map((t) => ({ ...t, deps: (t.deps || []).filter((d) => d !== id) })) }), 'Task deleted'),
    toggleDone: (id) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => (t.id === id ? { ...t, status: t.status === 'done' ? 'todo' : 'done', completed: t.status === 'done' ? null : Date.now() } : t)) }), 'Marked complete'),
    addEvent: (o) => { const e = { id: uid(), kind: 'meeting', ...o }; commit((s) => ({ ...s, events: [...s.events, e] })); return e; },
    updEvent: (id, patch, label) => commit((s) => ({ ...s, events: s.events.map((e) => (e.id === id ? { ...e, ...patch } : e)) }), label),
    delEvent: (id) => commit((s) => ({ ...s, events: s.events.filter((e) => e.id !== id) }), 'Event deleted'),
    lockBlock: (taskId, start, end, replaceLockId) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => t.id !== taskId ? t : { ...t, locked: [...(t.locked || []).filter((b) => b.id !== replaceLockId), { id: uid(), start, end }] }) }), 'Block locked at ' + fmtT(start) + ' — the rest reflowed'),
    unlock: (taskId, lockId) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => t.id !== taskId ? t : { ...t, locked: (t.locked || []).filter((b) => b.id !== lockId) }) }), 'Unlocked — Steward will place it'),
    setSettings: (patch) => commit((s) => ({ ...s, settings: { ...s.settings, ...patch } })),
    addProject: (p) => { commit((s) => ({ ...s, projects: [...s.projects, p] })); },
    updProject: (id, patch) => commit((s) => ({ ...s, projects: s.projects.map((p) => (p.id === id ? { ...p, ...patch } : p)) })),
    delProject: (id) => commit((s) => ({ ...s, projects: s.projects.filter((p) => p.id !== id), tasks: s.tasks.map((t) => (t.projectId === id ? { ...t, projectId: null } : t)) }), 'Project deleted (tasks kept)'),
    saveNote: (n) => setState((s) => ({ ...s, notes: s.notes.some((x) => x.id === n.id) ? s.notes.map((x) => (x.id === n.id ? n : x)) : [n, ...s.notes] })),
    delNote: (id) => commit((s) => ({ ...s, notes: s.notes.filter((n) => n.id !== id) }), 'Note deleted'),
  }), [commit]);

  /* ---- assistant ---- */
  const say = (items) => setLog((l) => [...items.map((x) => ({ ...x, id: uid() })), ...l].slice(0, 6));
  const runCommand = (text) => {
    if (!text.trim()) return;
    const p = parseCommand(text, state, Date.now());
    if (p.kind === 'search') { setSearch(p.q || true); return; }
    if (p.kind === 'plan') { setDraft(draftProject(p.goal, state, Date.now())); setView('projects'); say([{ tag: 'prop', text: 'Drafted a plan for “' + p.goal + '” — review it in Projects before anything is created.' }]); return; }
    if (p.kind === 'event') {
      const clash = state.events.find((e) => e.start < p.end && e.end > p.start);
      const e = A.addEvent({ title: p.title, start: p.start, end: p.end });
      say([{ tag: 'done', text: 'Added meeting “' + e.title + '” · ' + relD(e.start, now) + ' ' + fmtT(e.start) + '–' + fmtT(e.end) + '. Flexible work around it was reflowed.' }, ...(clash ? [{ tag: 'sugg', text: 'Overlaps “' + clash.title + '”. Steward didn’t move either — adjust one if needed.' }] : [])]);
      return;
    }
    const t = A.addTask({ title: p.title, duration: p.duration, priority: p.priority, deadline: p.deadline, projectId: p.projectId });
    const sched = runSchedule({ ...state, tasks: [...state.tasks, t] }, Date.now());
    const inf = sched.info[t.id] || {};
    const where = auto ? (inf.first ? 'scheduled ' + relD(inf.first, now) + ' ' + fmtT(inf.first) : 'not placed yet') : 'will be placed when you apply the plan';
    const items = [{ tag: 'done', text: 'Added “' + t.title + '” · ' + fmtDur(t.duration) + (t.deadline ? ' · due ' + relD(t.deadline, now) : '') + ' · ' + where + '.' }];
    if (auto && inf.late) items.push({ tag: 'err', text: 'It can’t finish before its deadline with your current calendar — see Needs attention.' });
    say(items);
  };

  if (!state.onboarded) return html`<${Onboarding} onDone=${(s) => setState(s)} now=${now} />`;

  const ctx = { state, plan, computed, now, A, commit, setDrawer, setView, alerts, runCommand, log, draft, setDraft, pendingMoves, applyPlan, setSearch, setToast };
  const openTasks = state.tasks.filter((t) => t.status !== 'done').length;
  const NAV = [['today', 'Today', 'today'], ['calendar', 'Calendar', 'cal'], ['tasks', 'Tasks', 'tasks', openTasks], ['projects', 'Projects', 'proj', state.projects.filter((p) => p.status !== 'done').length], ['notes', 'Notes', 'notes', state.notes.length], ['assistant', 'Assistant', 'spark']];
  return html`<div class="app">
    <nav class="rail" aria-label="Main">
      <div class="brand"><i>S</i>Steward</div>
      ${NAV.map(([k, l, ic, ct]) => html`<button key=${k} class=${'nav' + (view === k ? ' on' : '')} onClick=${() => setView(k)} aria-current=${view === k ? 'page' : null}><${Icon} n=${ic} /><span class="lbl">${l}</span><span class="mlbl">${l}</span>${ct ? html`<span class="ct">${ct}</span>` : null}</button>`)}
      <button class="nav nomob" onClick=${() => setSearch(true)}><${Icon} n="search" /><span class="lbl">Search</span><span class="mlbl">Search</span><span class="ct">⌘K</span></button>
      <div class="spacer"></div>
      <button class=${'nav' + (view === 'settings' ? ' on' : '')} onClick=${() => setView('settings')}><${Icon} n="gear" /><span class="lbl">Settings</span><span class="mlbl">Settings</span></button>
    </nav>
    <main class="main"><div class="wrap">
      ${!saveOk ? html`<div class="banner warn"><b>Not saving.</b><span class="grow">This browser is blocking storage, so changes will be lost when you close the tab. Use Settings → Backup to copy your data out.</span></div>` : null}
      ${pendingMoves ? html`<div class="banner"><b>Proposed update</b><span class="grow">${pendingMoves} work block${pendingMoves > 1 ? 's' : ''} would move to keep the plan realistic.</span><button class="btn sm" onClick=${() => setView('calendar')}>Review</button><button class="btn sm pri" onClick=${applyPlan}>Apply plan</button></div>` : null}
      ${view === 'today' ? html`<${TodayView} ...${ctx} />` : null}
      ${view === 'calendar' ? html`<${CalendarView} ...${ctx} />` : null}
      ${view === 'tasks' ? html`<${TasksView} ...${ctx} />` : null}
      ${view === 'projects' ? html`<${ProjectsView} ...${ctx} />` : null}
      ${view === 'notes' ? html`<${NotesView} ...${ctx} />` : null}
      ${view === 'assistant' ? html`<${AssistantView} ...${ctx} />` : null}
      ${view === 'settings' ? html`<${SettingsView} ...${ctx} setState=${setState} />` : null}
    </div></main>
    ${drawer && drawer.type === 'task' ? html`<${TaskDrawer} ...${ctx} id=${drawer.id} onClose=${() => setDrawer(null)} />` : null}
    ${drawer && drawer.type === 'event' ? html`<${EventModal} ...${ctx} ev=${drawer.ev} onClose=${() => setDrawer(null)} />` : null}
    ${search ? html`<${SearchModal} ...${ctx} initial=${typeof search === 'string' ? search : ''} onClose=${() => setSearch(false)} />` : null}
    ${toast ? html`<div class="toast" role="status"><span>${toast.text}</span>${toast.undo ? html`<button onClick=${() => { undo(); }}>Undo</button>` : null}</div>` : null}
  </div>`;
}

/* ================= Command bar ================= */
function CommandBar(ctx) {
  const { runCommand, log, state, plan, now, A, setDrawer } = ctx;
  const [v, setV] = useState('');
  const [busy, setBusy] = useState(false);
  const [dump, setDump] = useState(null);     // { items: [{ id, text, on }] } awaiting review
  const [filter, setFilter] = useState(null); // { q, ids }
  const [err, setErr] = useState('');
  const ref = useRef();
  useEffect(() => { const k = (e) => { if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); ref.current && ref.current.focus(); } }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  useEffect(() => { const el = ref.current; if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }, [v]);
  const aiOn = typeof kinAIAvailable === 'function' && kinAIAvailable();
  const submit = async () => {
    const text = v.trim();
    if (!text || busy) return;
    const kind = aiOn ? kinBarIntent(text) : 'command';
    if (kind === 'command') { runCommand(text); setV(''); return; }
    setBusy(true); setErr('');
    try {
      if (kind === 'filter') {
        const ids = await kinFilterTasks(text, state);
        setFilter({ q: text, ids }); setDump(null);
      } else {
        const lines = await kinBrainDump(text, state);
        if (!lines.length) setErr('Steward didn’t find any tasks in that. Try listing a few things you need to do.');
        else { setDump({ items: lines.map((t) => ({ id: uid(), text: t, on: true })) }); setFilter(null); }
      }
      setV('');
    } catch (e) { setErr(e.message || String(e)); }
    finally { setBusy(false); }
  };
  const addDump = () => {
    dump.items.filter((x) => x.on && x.text.trim()).forEach((x) => runCommand(x.text.trim()));
    setDump(null);
  };
  const edit = (id, patch) => setDump((d) => ({ items: d.items.map((x) => (x.id === id ? { ...x, ...patch } : x)) }));
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  const onCount = dump ? dump.items.filter((x) => x.on).length : 0;
  return html`<div>
    <form class="cmd" onSubmit=${(e) => { e.preventDefault(); submit(); }}>
      <${Icon} n="spark" cls="muted" />
      <textarea id="cmd" ref=${ref} rows="1" value=${v} onInput=${(e) => setV(e.target.value)}
        onKeyDown=${(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } }}
        placeholder=${aiOn ? 'Brain dump what’s on your mind, or “show what’s urgent”' : 'Add a task: “call Sam fri 2pm”'}
        aria-label="Tell Steward what to add, plan, or find" autocomplete="off"></textarea>
      <span class="k">/</span>
      <button class="btn pri sm" type="submit" disabled=${busy}>${busy ? 'Thinking…' : 'Go'}</button>
    </form>
    ${err ? html`<div class="log"><div class="logline"><span class="tag err">Error</span><span>${err}</span></div></div>` : null}
    ${dump ? html`<div class="dump" aria-label="Tasks from your brain dump">
      <div class="ph"><h2>${dump.items.length} task${dump.items.length === 1 ? '' : 's'} from your brain dump</h2></div>
      ${dump.items.map((x) => html`<label class="it" key=${x.id}><input type="checkbox" checked=${x.on} onChange=${(e) => edit(x.id, { on: e.target.checked })} aria-label="Include" /><input type="text" value=${x.text} onInput=${(e) => edit(x.id, { text: e.target.value })} aria-label="Task" /></label>`)}
      <div class="acts"><button class="btn pri sm" onClick=${addDump} disabled=${!onCount}>Add ${onCount} to my plan</button><button class="btn sm ghost" onClick=${() => setDump(null)}>Discard</button><span class="muted" style=${{ fontSize: '12px', alignSelf: 'center' }}>Edit any line first. “30m”, “fri”, “high” are understood.</span></div>
    </div>` : null}
    ${filter ? html`<div class="dump" aria-label="Filtered tasks">
      <div class="ph"><h2>${filter.ids.length ? filter.ids.length + ' match' + (filter.ids.length === 1 ? '' : 'es') : 'No matches'} · “${filter.q}”</h2><span class="grow"></span><button class="btn sm ghost" onClick=${() => setFilter(null)}>Clear</button></div>
      <div class="rows">${filter.ids.map((id) => byId[id] ? html`<${TaskRow} key=${id} t=${byId[id]} plan=${plan} now=${now} A=${A} setDrawer=${setDrawer} state=${state} />` : null)}</div>
    </div>` : null}
    ${log.length ? html`<div class="log" aria-live="polite">${log.slice(0, 3).map((l) => html`<div class="logline" key=${l.id}><span class=${'tag ' + l.tag}>${{ done: 'Done', prop: 'Proposed', sugg: 'Suggestion', err: 'Conflict' }[l.tag]}</span><span>${l.text}</span></div>`)}</div>` : null}
  </div>`;
}

/* ================= Timeline column ================= */
function dayRange(settings, events, days) {
  let lo = 8 * 60, hi = 18 * 60;
  Object.values(settings.hours).forEach((h) => { if (h) { lo = Math.min(lo, h[0] - 60); hi = Math.max(hi, h[1] + 60); } });
  events.forEach((e) => { if (days.some((d) => sod(e.start) === d)) { lo = Math.min(lo, minOfDay(e.start)); hi = Math.max(hi, minOfDay(e.end) || 1440); } });
  return [Math.max(0, Math.floor(lo / 60) * 60), Math.min(1440, Math.ceil(hi / 60) * 60)];
}

function Hours({ range, ppm }) {
  const out = [];
  for (let m = range[0]; m < range[1]; m += 60) { const h = m / 60; out.push(html`<span key=${m} style=${{ top: (m - range[0]) * ppm + 'px' }}>${m === range[0] ? '' : (h % 12 || 12) + (h < 12 ? 'a' : 'p')}</span>`); }
  return html`<div class="hours" style=${{ height: (range[1] - range[0]) * ppm + 'px' }}>${out}</div>`;
}

function DayCol({ day, range, ppm, state, plan, now, A, setDrawer, onEmpty }) {
  const H = (range[1] - range[0]) * ppm;
  const [drag, setDrag] = useState(null);
  const y = (t) => (minOfDay(t) - range[0]) * ppm;
  const hrs = state.settings.hours[new Date(day).getDay()];
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  const evs = state.events.filter((e) => e.end > day && e.start < addDays(day, 1));
  const blks = plan.blocks.filter((b) => b.start >= day && b.start < addDays(day, 1) && byId[b.taskId]);
  const done = state.tasks.filter((t) => t.status === 'done' && t.completed && sod(t.completed) === day);

  const startDrag = (e, item) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
    setDrag({ ...item, y0: e.clientY, x0: e.clientX, dy: 0, day, moved: false, targetDay: day });
  };
  const onMove = (e) => {
    if (!drag) return;
    const dy = Math.round((e.clientY - drag.y0) / ppm / 15) * 15 * ppm;
    let targetDay = drag.targetDay;
    const el = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.dataset && x.dataset.day);
    if (el) targetDay = +el.dataset.day;
    setDrag({ ...drag, dy, targetDay, moved: drag.moved || Math.abs(e.clientY - drag.y0) > 4 || Math.abs(e.clientX - drag.x0) > 8 });
  };
  const onUp = () => {
    if (!drag) return;
    const d = drag; setDrag(null);
    if (!d.moved) { if (d.kind === 'ev') setDrawer({ type: 'event', ev: state.events.find((x) => x.id === d.id) }); else setDrawer({ type: 'task', id: d.taskId }); return; }
    const dm = Math.round(d.dy / ppm);
    const ns = atMin(d.targetDay, minOfDay(d.start) + dm), ne = ns + (d.end - d.start);
    if (d.kind === 'ev') A.updEvent(d.id, { start: ns, end: ne }, 'Moved “' + d.title + '” to ' + fmtT(ns));
    else A.lockBlock(d.taskId, ns, ne, d.lockId);
  };
  const off = [];
  if (!hrs) off.push([range[0], range[1]]); else { if (hrs[0] > range[0]) off.push([range[0], hrs[0]]); if (hrs[1] < range[1]) off.push([hrs[1], range[1]]); }
  const grid = [];
  for (let m = range[0]; m < range[1]; m += 30) grid.push(html`<div key=${m} class=${'gl' + (m % 60 ? ' half' : '')} style=${{ top: (m - range[0]) * ppm + 'px' }}></div>`);
  const render = (it) => {
    const isDrag = drag && drag.id === it.id;
    const top = y(it.start) + (isDrag ? drag.dy : 0);
    const h = Math.max(18, (it.end - it.start) / MIN * ppm - 2);
    const shiftX = isDrag && drag.targetDay !== day ? { transform: 'translateX(' + ((drag.targetDay - day) / DAY * 100) + '%)' } : null;
    if (it.kind === 'ev') return html`<div key=${it.id} class=${'blk ev' + (isDrag ? ' drag' : '')} style=${{ top: top + 'px', height: h + 'px', ...shiftX }} onPointerDown=${(e) => startDrag(e, it)} title=${it.title}><b>${it.title}</b>${h > 40 ? html`<small>${fmtT(it.start)}–${fmtT(it.end)}</small>` : null}</div>`;
    const t = byId[it.taskId];
    const inf = plan.info[t.id] || {};
    return html`<div key=${it.id} class=${'blk tk' + (it.locked ? ' lock' : '') + (inf.late ? ' late' : '') + (isDrag ? ' drag' : '')} style=${{ top: top + 'px', height: h + 'px', ...shiftX }} onPointerDown=${(e) => startDrag(e, it)} title=${t.title + (it.locked ? ' (locked)' : ' (auto-scheduled — drag to lock a time)')}>
      ${it.locked ? html`<${Icon} n="lock" cls="lk" />` : null}<b>${t.title}</b>${h > 40 ? html`<small>${fmtT(it.start)}–${fmtT(it.end)}</small>` : null}</div>`;
  };
  return html`<div class="col" data-day=${day} style=${{ height: H + 'px' }} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${() => setDrag(null)}
      onDoubleClick=${(e) => { if (e.target !== e.currentTarget && !e.target.classList.contains('gl') && !e.target.classList.contains('off')) return; const r = e.currentTarget.getBoundingClientRect(); const m = Math.floor(((e.clientY - r.top) / ppm + range[0]) / 15) * 15; onEmpty && onEmpty(atMin(day, m)); }}>
    ${grid}
    ${off.map(([a, b], i) => html`<div key=${'o' + i} class="off" style=${{ top: (a - range[0]) * ppm + 'px', height: (b - a) * ppm + 'px' }}></div>`)}
    ${hrs ? state.settings.breaks.map((b, i) => html`<div key=${'b' + i} class="brk" style=${{ top: (b.s - range[0]) * ppm + 'px', height: (b.e - b.s) * ppm + 'px' }} title=${b.label}></div>`) : null}
    ${evs.map((e) => render({ ...e, kind: 'ev' }))}
    ${blks.map((b) => render({ ...b, kind: 'tk' }))}
    ${sod(now) === day && minOfDay(now) >= range[0] && minOfDay(now) <= range[1] ? html`<div class="nowline" style=${{ top: y(now) + 'px' }}></div>` : null}
  </div>`;
}

/* ================= Today ================= */
function TodayView(ctx) {
  const { state, plan, now, A, setDrawer, alerts, runCommand, log, setView } = ctx;
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  const d0 = sod(now);
  const range = dayRange(state.settings, state.events, [d0]);
  const ppm = 1.1;
  const curEv = state.events.find((e) => e.start <= now && e.end > now);
  const curBlk = plan.blocks.find((b) => b.start <= now + 60000 && b.end > now && byId[b.taskId]);
  const upcoming = [
    ...state.events.filter((e) => e.start > now && e.start < addDays(d0, 2)).map((e) => ({ kind: 'ev', start: e.start, end: e.end, title: e.title, e })),
    ...plan.blocks.filter((b) => b.start > now + 60000 && b.start < addDays(d0, 2) && byId[b.taskId]).map((b) => ({ kind: 'tk', start: b.start, end: b.end, title: byId[b.taskId].title, t: byId[b.taskId], locked: b.locked })),
  ].sort((a, b) => a.start - b.start).slice(0, 5);
  const topTasks = state.tasks.filter((t) => t.status !== 'done').sort((a, b) => ((plan.info[a.id] || {}).first || 9e15) - ((plan.info[b.id] || {}).first || 9e15)).slice(0, 6);
  const doneToday = state.tasks.filter((t) => t.status === 'done' && t.completed && sod(t.completed) === d0).length;
  const plannedMin = plan.blocks.filter((b) => sod(b.start) === d0).reduce((a, b) => a + (b.end - b.start) / MIN, 0);
  const greeting = new Date(now).getHours() < 12 ? 'Good morning' : new Date(now).getHours() < 17 ? 'Good afternoon' : 'Good evening';
  const hrs = state.settings.hours[new Date(now).getDay()];

  let nowCard;
  if (curEv) nowCard = html`<div class="now"><div class="eyebrow">In a meeting · until ${fmtT(curEv.end)}</div><h3>${curEv.title}</h3><div class="meta"><span>${fmtT(curEv.start)}–${fmtT(curEv.end)}</span></div></div>`;
  else if (curBlk) {
    const t = byId[curBlk.taskId];
    const pct = Math.min(100, Math.max(0, (now - curBlk.start) / (curBlk.end - curBlk.start) * 100));
    nowCard = html`<div class="now"><div class="eyebrow">Do this now · until ${fmtT(curBlk.end)}</div><h3>${t.title}</h3>
      <div class="meta"><span class=${'prio p-' + t.priority}>${PRI_LABEL[t.priority]}</span>${t.deadline ? html`<span>Due ${relD(t.deadline, now)} ${fmtT(t.deadline)}</span>` : null}<span>${fmtDur(remainingMin(t))} left</span></div>
      <div class="acts"><button class="btn pri sm" onClick=${() => A.toggleDone(t.id)}><${Icon} n="check" />Done</button>
      <button class="btn sm" onClick=${() => A.updTask(t.id, (x) => ({ duration: (x.duration || 30) + 30 }), 'Added 30m — schedule reflowed')}>Needs 30m more</button>
      <button class="btn sm ghost" onClick=${() => A.updTask(t.id, (x) => ({ startDate: addDays(sod(now), 1) }), 'Pushed to tomorrow')}>Not today</button>
      <button class="btn sm ghost" onClick=${() => setDrawer({ type: 'task', id: t.id })}>Details</button></div>
      <div class="bar"><i style=${{ width: pct + '%' }}></i></div></div>`;
  } else {
    const nx = upcoming[0];
    nowCard = html`<div class="now"><div class="eyebrow">${hrs && minOfDay(now) < hrs[1] ? 'Open time' : 'Off the clock'}</div><h3>${nx ? 'Next up at ' + fmtT(nx.start) + ': ' + nx.title : 'Nothing scheduled right now'}</h3><div class="meta">${nx ? relD(nx.start, now) : 'Add a task above and Steward will find it a slot.'}</div>
      ${nx && nx.kind === 'tk' ? html`<div class="acts"><button class="btn sm pri" onClick=${() => A.lockBlock(nx.t.id, Math.ceil(now / SLOT) * SLOT, Math.ceil(now / SLOT) * SLOT + (nx.end - nx.start))}><${Icon} n="play" />Start it now</button></div>` : null}</div>`;
  }

  return html`<div>
    <header class="hdr"><div><div class="sub">${fmtD(now)} · ${fmtDur(Math.round(plannedMin))} of focus planned · ${doneToday} done</div><h1>${greeting}, JP.</h1></div></header>
    <${CommandBar} ...${ctx} />
    ${state.hasSample ? html`<p class="muted" style=${{ fontSize: '12.5px', margin: '10px 2px 0' }}>Showing example tasks and meetings so you can see how it works. Clear them any time in Settings.</p>` : null}
    <div class="today">
      <section class="panel" aria-label="Today's timeline">
        <div class="ph"><h2>Today</h2><span class="grow"></span><div class="legend"><span><i style=${{ background: 'var(--meet)' }}></i>Meeting</span><span><i style=${{ background: 'var(--task-soft)', border: '1.5px dashed var(--task)' }}></i>Work block</span><span><i style=${{ background: 'var(--task-soft)', border: '1.5px solid var(--task)' }}></i>Locked</span></div></div>
        <div style=${{ padding: '14px 12px 14px 0' }}><div class="tl"><${Hours} range=${range} ppm=${ppm} /><${DayCol} day=${d0} range=${range} ppm=${ppm} ...${ctx} onEmpty=${(t) => setDrawer({ type: 'event', ev: { start: t, end: t + 30 * MIN, title: '' } })} /></div></div>
      </section>
      <div class="stack">
        ${nowCard}
        <section class="panel" aria-label="Needs attention">
          <div class="ph"><h2>Needs attention</h2><span class="grow"></span>${alerts.length ? html`<span class="pill bad">${alerts.length}</span>` : html`<span class="pill ok">All clear</span>`}</div>
          ${alerts.length ? alerts.slice(0, 4).map((a, i) => html`<${AlertRow} key=${i} a=${a} ...${ctx} />`) : html`<div class="empty">Everything fits before its deadline.</div>`}
        </section>
        <section class="panel" aria-label="Coming up">
          <div class="ph"><h2>Coming up</h2></div>
          <div class="rows">${upcoming.length ? upcoming.map((u, i) => html`<div key=${i} class="row click" onClick=${() => u.kind === 'ev' ? setDrawer({ type: 'event', ev: u.e }) : setDrawer({ type: 'task', id: u.t.id })}>
            <span class="time">${fmtT(u.start)}</span><div class="t"><b>${u.title}</b><small>${u.kind === 'ev' ? 'Meeting' : 'Work block' + (u.locked ? ' · locked' : '')} · ${fmtDur(Math.round((u.end - u.start) / MIN))}${sod(u.start) !== d0 ? ' · ' + relD(u.start, now) : ''}</small></div><span></span></div>`) : html`<div class="empty">Nothing else on the books.</div>`}</div>
        </section>
        <section class="panel" aria-label="Priorities">
          <div class="ph"><h2>Up next in your queue</h2><span class="grow"></span><button class="btn sm ghost" onClick=${() => setView('tasks')}>All tasks</button></div>
          <div class="rows">${topTasks.map((t) => html`<${TaskRow} key=${t.id} t=${t} ...${ctx} />`)}</div>
        </section>
      </div>
    </div>
  </div>`;
}

function AlertRow({ a, A, now, setDrawer, setView }) {
  const t = a.task;
  return html`<div class=${'alert ' + a.sev}><span class="sev"></span><div><b>${a.title}</b><p>${a.text}</p><div class="acts">
    ${a.kind === 'late' ? html`<button class="btn sm" onClick=${() => A.updTask(t.id, { deadline: Math.ceil(a.projected / (30 * MIN)) * 30 * MIN }, 'Deadline moved to ' + fmtD(a.projected))}>Move deadline to ${relD(a.projected, now)}</button>
      <button class="btn sm" onClick=${() => A.updTask(t.id, { priority: 'asap' }, 'Made ASAP — schedule reflowed')}>Make ASAP</button>
      ${a.bump ? html`<button class="btn sm ghost" onClick=${() => A.updTask(a.bump.id, { startDate: addDays(sod(t.deadline), 1) }, 'Pushed “' + a.bump.title + '” after this deadline')}>Push “${a.bump.title}” later</button>` : null}` : null}
    ${a.kind === 'nofit' ? html`<button class="btn sm" onClick=${() => A.updTask(t.id, (x) => ({ duration: Math.max(15, x.duration - Math.ceil(a.task.duration / 2 / 15) * 15) }), 'Estimate halved')}>Cut estimate in half</button>` : null}
    ${a.kind === 'overdue' ? html`<button class="btn sm" onClick=${() => A.updTask(t.id, { deadline: addDays(sod(now), 1) + 1020 * MIN }, 'Deadline moved to tomorrow')}>Move to tomorrow</button><button class="btn sm" onClick=${() => A.toggleDone(t.id)}>It’s done</button>` : null}
    ${t ? html`<button class="btn sm ghost" onClick=${() => setDrawer({ type: 'task', id: t.id })}>Open</button>` : html`<button class="btn sm ghost" onClick=${() => setView('projects')}>View project</button>`}
  </div></div></div>`;
}

function TaskRow({ t, plan, now, A, setDrawer, state }) {
  const inf = plan.info[t.id] || {};
  const p = state.projects.find((p) => p.id === t.projectId);
  const when = t.status === 'done' ? 'Done' : inf.first ? relD(inf.first, now) + ' ' + fmtT(inf.first) : inf.unscheduled ? 'No room' : '—';
  return html`<div class="row click" onClick=${() => setDrawer({ type: 'task', id: t.id })}>
    <button class=${'chk' + (t.status === 'done' ? ' on' : '')} aria-label=${t.status === 'done' ? 'Mark not done' : 'Mark done'} onClick=${(e) => { e.stopPropagation(); A.toggleDone(t.id); }}>${t.status === 'done' ? html`<${Icon} n="check" />` : null}</button>
    <div class="t"><b style=${t.status === 'done' ? { textDecoration: 'line-through', color: 'var(--ink-3)' } : null}>${t.title}</b><small><span class=${'prio p-' + t.priority}>${PRI_LABEL[t.priority]}</span> · ${fmtDur(t.duration)}${t.deadline ? ' · due ' + relD(t.deadline, now) : ''}${p ? ' · ' + p.name : ''}${t.status === 'blocked' ? ' · blocked' : ''}</small></div>
    <span class="time" style=${inf.late || inf.unscheduled ? { color: 'var(--bad)' } : null}>${when}</span>
  </div>`;
}
</script>
<script>
/* ================= Calendar (week) ================= */
function CalendarView(ctx) {
  const { state, plan, now, setDrawer } = ctx;
  const [offset, setOffset] = useState(0);
  const ws = (() => { const d = new Date(sod(now)); const k = (d.getDay() + 6) % 7; return addDays(sod(now), -k + offset * 7); })();
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const range = dayRange(state.settings, state.events, days);
  const ppm = 0.9;
  const load = (d) => { const h = state.settings.hours[new Date(d).getDay()]; if (!h) return null; const cap = h[1] - h[0] - state.settings.breaks.reduce((a, b) => a + (b.e - b.s), 0); const used = plan.blocks.filter((b) => sod(b.start) === d).reduce((a, b) => a + (b.end - b.start) / MIN, 0) + state.events.filter((e) => sod(e.start) === d).reduce((a, e) => a + (e.end - e.start) / MIN, 0); return Math.round(used / cap * 100); };
  return html`<div>
    <header class="hdr"><div><div class="sub">Week of ${fmtD(ws)}</div><h1>Calendar</h1></div><span class="grow"></span>
      <div class="legend"><span><i style=${{ background: 'var(--meet)' }}></i>Meeting (fixed)</span><span><i style=${{ background: 'var(--task-soft)', border: '1.5px dashed var(--task)' }}></i>Auto-scheduled work</span><span><i style=${{ background: 'var(--task-soft)', border: '1.5px solid var(--task)' }}></i>Locked work</span></div>
      <div style=${{ display: 'flex', gap: '6px' }}><button class="btn sm" onClick=${() => setOffset(offset - 1)} aria-label="Previous week"><${Icon} n="left" /></button><button class="btn sm" onClick=${() => setOffset(0)}>This week</button><button class="btn sm" onClick=${() => setOffset(offset + 1)} aria-label="Next week"><${Icon} n="right" /></button>
      <button class="btn sm pri" onClick=${() => setDrawer({ type: 'event', ev: { start: Math.ceil(now / (60 * MIN)) * 60 * MIN, end: Math.ceil(now / (60 * MIN)) * 60 * MIN + 30 * MIN, title: '' } })}><${Icon} n="plus" />Meeting</button></div>
    </header>
    <p class="muted" style=${{ margin: '-6px 0 14px', fontSize: '13px' }}>Drag a work block to lock it at a new time; everything flexible reflows around it. Drag meetings to reschedule them. Double-click empty space to add a meeting.</p>
    <div class="weekwrap"><div class="week">
      <div class="wkhead"></div>
      ${days.map((d) => { const l = load(d); return html`<div key=${d} class=${'wkhead' + (d === sod(now) ? ' tdy' : '')}><small>${WD[new Date(d).getDay()]}</small><b>${new Date(d).getDate()}</b>${l != null ? html`<div class="load" style=${l > 100 ? { color: 'var(--bad)' } : null}>${l}% booked</div>` : html`<div class="load">Off</div>`}</div>`; })}
      <${Hours} range=${range} ppm=${ppm} />
      ${days.map((d) => html`<${DayCol} key=${d} day=${d} range=${range} ppm=${ppm} ...${ctx} onEmpty=${(t) => setDrawer({ type: 'event', ev: { start: t, end: t + 30 * MIN, title: '' } })} />`)}
    </div></div>
  </div>`;
}

/* ================= Tasks ================= */
function TasksView(ctx) {
  const { state, A, runCommand, log, plan } = ctx;
  const [filter, setFilter] = useState('open');
  const [group, setGroup] = useState('when');
  const list = state.tasks.filter((t) => filter === 'all' || (filter === 'open' ? t.status !== 'done' : filter === 'done' ? t.status === 'done' : t.status === filter));
  let groups;
  if (group === 'project') { groups = [...state.projects.map((p) => [p.name, list.filter((t) => t.projectId === p.id)]), ['No project', list.filter((t) => !t.projectId || !state.projects.some((p) => p.id === t.projectId))]]; }
  else if (group === 'priority') groups = ['asap', 'high', 'med', 'low'].map((k) => [PRI_LABEL[k], list.filter((t) => t.priority === k)]);
  else { const f = (t) => (plan.info[t.id] || {}).first; groups = [['Scheduled', list.filter((t) => f(t)).sort((a, b) => f(a) - f(b))], ['Not placed', list.filter((t) => !f(t) && t.status !== 'done')], ['Done', list.filter((t) => t.status === 'done')]]; }
  return html`<div>
    <header class="hdr"><div><div class="sub">${state.tasks.filter((t) => t.status !== 'done').length} open</div><h1>Tasks</h1></div></header>
    <${CommandBar} ...${ctx} />
    <div style=${{ display: 'flex', gap: '16px', flexWrap: 'wrap', margin: '18px 0 4px', alignItems: 'center' }}>
      <div class="chips">${[['open', 'Open'], ['blocked', 'Blocked'], ['done', 'Done'], ['all', 'All']].map(([k, l]) => html`<button key=${k} class=${'chip' + (filter === k ? ' on' : '')} onClick=${() => setFilter(k)}>${l}</button>`)}</div>
      <span class="muted" style=${{ fontSize: '12px' }}>Group by</span>
      <div class="chips">${[['when', 'Schedule'], ['project', 'Project'], ['priority', 'Priority']].map(([k, l]) => html`<button key=${k} class=${'chip' + (group === k ? ' on' : '')} onClick=${() => setGroup(k)}>${l}</button>`)}</div>
      <span style=${{ flex: 1 }}></span>
      <button class="btn sm pri" onClick=${() => { const t = A.addTask({ title: 'New task' }); ctx.setDrawer({ type: 'task', id: t.id }); }}><${Icon} n="plus" />New task</button>
    </div>
    ${groups.filter(([, ts]) => ts.length).map(([g, ts]) => html`<div key=${g}><div class="grp">${g} · ${ts.length}</div><div class="panel rows">${ts.map((t) => html`<${TaskRow} key=${t.id} t=${t} ...${ctx} />`)}</div></div>`)}
    ${!list.length ? html`<div class="panel empty" style=${{ marginTop: '16px' }}>No tasks here.</div>` : null}
  </div>`;
}

function TaskDrawer(ctx) {
  const { state, plan, now, A, id, onClose } = ctx;
  const t = state.tasks.find((x) => x.id === id);
  useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  if (!t) return null;
  const inf = plan.info[t.id] || {};
  const blocks = plan.blocks.filter((b) => b.taskId === t.id);
  const up = (patch) => A.updTask(t.id, patch);
  const others = state.tasks.filter((x) => x.id !== t.id && x.status !== 'done');
  const src = t.sourceNote && state.notes.find((n) => n.id === t.sourceNote);
  return html`<div class="scrim" onClick=${(e) => e.target === e.currentTarget && onClose()}><aside class="drawer" role="dialog" aria-label="Task details">
    <div style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}>
      <button class=${'chk' + (t.status === 'done' ? ' on' : '')} onClick=${() => A.toggleDone(t.id)} aria-label="Toggle done">${t.status === 'done' ? html`<${Icon} n="check" />` : null}</button>
      <span class="muted mono" style=${{ fontSize: '11px', textTransform: 'uppercase', letterSpacing: '.08em' }}>Task${t.sample ? ' · example' : ''}</span><span style=${{ flex: 1 }}></span>
      <button class="btn sm ghost danger" onClick=${() => { A.delTask(t.id); onClose(); }}>Delete</button>
      <button class="btn sm ghost" onClick=${onClose} aria-label="Close"><${Icon} n="x" /></button>
    </div>
    <input id="t-title" class="title-in" value=${t.title} onInput=${(e) => up({ title: e.target.value })} aria-label="Task name" />
    <div class="why">
      ${t.status === 'done' ? html`<b>Completed</b> ${t.completed ? relD(t.completed, now) : ''}` :
        inf.unscheduled ? html`<b>Not placed.</b> ${inf.reason || fmtDur(Math.round(inf.short || 0)) + ' doesn’t fit in your working hours over the next ' + state.settings.horizon + ' days.'}` :
        inf.first ? html`<b>Working on it ${relD(inf.first, now)} at ${fmtT(inf.first)}</b>${blocks.length > 1 ? ' across ' + blocks.length + ' blocks' : ''}, finishing ${relD(inf.end, now)} ${fmtT(inf.end)}. ${t.deadline ? (inf.late ? html`<span style=${{ color: 'var(--bad)' }}>That’s after the deadline.</span>` : 'That’s before the ' + relD(t.deadline, now) + ' deadline.') : ''} Chosen as the earliest open time ${inf.why && inf.why.length ? inf.why.join(' and ') : ''} given its ${t.deadline ? 'deadline' : 'priority'}.` : 'Scheduling…'}
    </div>
    <div class="grid3">

      <div class="fld"><label for="t-sd">Don’t start before</label><input id="t-sd" type="date" class="in" value=${toLocalInput(t.startDate)} onChange=${(e) => up({ startDate: fromDateInput(e.target.value) })} /></div>
    </div>
    <div class="grid2">
      <div class="fld"><label for="t-proj">Project</label><select id="t-proj" class="in" value=${t.projectId || ''} onChange=${(e) => up({ projectId: e.target.value || null })}><option value="">None</option>${state.projects.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
      <div class="fld"><label for="t-chunk">Smallest work block</label><select id="t-chunk" class="in" value=${t.minChunk || ''} onChange=${(e) => up({ minChunk: +e.target.value || null })}><option value="">Default (${state.settings.minChunk}m)</option>${[15, 30, 60, 90, 120].map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}<option value=${9999}>Don’t split</option></select></div>
    </div>
    <div class="fld"><label for="t-deps">Waits on</label>
      <select id="t-deps" class="in" value="" onChange=${(e) => e.target.value && up({ deps: [...(t.deps || []), e.target.value] })}><option value="">Add a task this depends on…</option>${others.filter((o) => !(t.deps || []).includes(o.id)).map((o) => html`<option key=${o.id} value=${o.id}>${o.title}</option>`)}</select>
      ${(t.deps || []).length ? html`<div class="chips" style=${{ marginTop: '6px' }}>${t.deps.map((d) => { const o = state.tasks.find((x) => x.id === d); return o ? html`<button key=${d} class="chip" onClick=${() => up({ deps: t.deps.filter((x) => x !== d) })} title="Remove">${o.title}${o.status === 'done' ? ' ✓' : ''} ×</button>` : null; })}</div>` : null}
    </div>
    <div class="fld"><label for="t-desc">Notes</label><textarea id="t-desc" class="in" value=${t.desc || ''} onInput=${(e) => up({ desc: e.target.value })} placeholder="Details, links, context…"></textarea></div>
    ${src ? html`<div class="why">From note <b>${src.title}</b>${t.sourceLine != null ? ', line ' + (t.sourceLine + 1) : ''}: “${(src.body.split('\n')[t.sourceLine] || '').trim()}”</div>` : null}
    <div class="fld"><label>Work blocks</label>
      ${blocks.length ? html`<div class="panel rows">${blocks.map((b) => html`<div key=${b.id} class="row"><span class="time">${relD(b.start, now)}</span><div class="t"><b class="mono" style=${{ fontWeight: 500 }}>${fmtT(b.start)}–${fmtT(b.end)}</b><small>${b.locked ? 'Locked by you' : 'Auto-scheduled'}</small></div>
        ${b.locked ? html`<button class="btn sm" onClick=${() => A.unlock(t.id, b.lockId)}>Unlock</button>` : html`<button class="btn sm" onClick=${() => A.lockBlock(t.id, b.start, b.end)}><${Icon} n="lock" />Lock</button>`}</div>`)}</div>` : html`<div class="muted" style=${{ fontSize: '13px' }}>None yet.</div>`}
    </div>
  </aside></div>`;
}

function EventModal({ ev, A, onClose, now }) {
  const isNew = !ev.id;
  const [f, setF] = useState({ title: ev.title || '', start: ev.start, end: ev.end, kind: ev.kind || 'meeting' });
  const dur = Math.round((f.end - f.start) / MIN);
  const save = (e) => { e.preventDefault(); const t = f.title.trim() || 'Meeting'; if (isNew) A.addEvent({ ...f, title: t }); else A.updEvent(ev.id, { ...f, title: t }, 'Saved'); onClose(); };
  return html`<div class="scrim" style=${{ justifyContent: 'center' }} onClick=${(e) => e.target === e.currentTarget && onClose()}><form class="modal" onSubmit=${save} style=${{ maxWidth: '440px' }}>
    <div class="muted mono" style=${{ fontSize: '11px', textTransform: 'uppercase', letterSpacing: '.08em' }}>${isNew ? 'New meeting' : 'Meeting'} · fixed — Steward plans around it</div>
    <input id="ev-title" class="title-in" autofocus value=${f.title} onInput=${(e) => setF({ ...f, title: e.target.value })} placeholder="What’s the meeting?" />
    <div class="grid2">
      <div class="fld"><label for="ev-s">Starts</label><input id="ev-s" class="in" type="datetime-local" value=${toLocalDT(f.start)} onChange=${(e) => { const s = new Date(e.target.value).getTime(); setF({ ...f, start: s, end: s + dur * MIN }); }} /></div>
      <div class="fld"><label for="ev-d">Length</label><select id="ev-d" class="in" value=${dur} onChange=${(e) => setF({ ...f, end: f.start + +e.target.value * MIN })}>${[15, 30, 45, 60, 90, 120, 180, 240].concat([dur]).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b).map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}</select></div>
    </div>
    <div style=${{ display: 'flex', gap: '8px' }}>${!isNew ? html`<button type="button" class="btn danger ghost" onClick=${() => { A.delEvent(ev.id); onClose(); }}>Delete</button>` : null}<span style=${{ flex: 1 }}></span><button type="button" class="btn ghost" onClick=${onClose}>Cancel</button><button class="btn pri" type="submit">${isNew ? 'Add meeting' : 'Save'}</button></div>
  </form></div>`;
}

const P_COLORS = { gray: '#8a8a8a', blue: '#6f9ce8', purple: '#a58be6', green: '#72c08a', amber: '#e0a24a', red: '#ec7b70' };
const P_STATUS = { planning: 'Planning', active: 'In progress', hold: 'On hold', done: 'Done' };
/* Stages in order: the project's saved list, then any stage names found only on tasks. */
function projectStages(p, ts) {
  const names = [...(p.stages || [])];
  ts.forEach((t) => { if (t.stage && !names.includes(t.stage)) names.push(t.stage); });
  if (ts.some((t) => !t.stage) || !names.length) names.push('');
  return names;
}

function ProjectDetail(ctx) {
  const { p, back, state, A, now, plan, setDrawer, commit } = ctx;
  const [adding, setAdding] = useState(null); // stage name receiving a new task
  const [nt, setNt] = useState('');
  const [newStage, setNewStage] = useState(null);
  if (!p) { back(); return null; }
  const ts = state.tasks.filter((t) => t.projectId === p.id);
  const notes = state.notes.filter((n) => n.projectId === p.id);
  const stages = projectStages(p, ts);
  const info = (t) => plan.info[t.id] || {};
  const open = ts.filter((t) => t.status !== 'done');
  const finish = Math.max(0, ...open.map((t) => info(t).end || 0));
  const late = open.some((t) => info(t).late) || (p.deadline && finish > p.deadline);
  const done = ts.length - open.length;
  const up = (patch) => A.updProject(p.id, patch);
  const stageRange = (name) => {
    const st = ts.filter((t) => (t.stage || '') === name);
    const starts = st.map((t) => t.status === 'done' ? t.completed : info(t).first).filter(Boolean);
    const ends = st.map((t) => t.status === 'done' ? t.completed : info(t).end || t.deadline).filter(Boolean);
    return { start: starts.length ? Math.min(...starts) : null, end: ends.length ? Math.max(...ends) : null, total: st.length, done: st.filter((t) => t.status === 'done').length };
  };
  const current = stages.find((s) => { const r = stageRange(s); return r.total && r.done < r.total; });
  const start = p.start || Math.min(p.created || now, ...ts.map((t) => info(t).first || t.created || now));
  const addTask = (stage) => {
    if (!nt.trim()) return;
    const q = parseCommand(nt, state, Date.now());
    A.addTask({ title: q.title || nt, duration: q.duration || 30, priority: q.priority || 'med', deadline: q.deadline || null, projectId: p.id, stage: stage || null });
    setNt('');
  };
  const addStage = () => {
    const name = (newStage || '').trim();
    if (name && !stages.includes(name)) up({ stages: [...stages.filter(Boolean), name] });
    setNewStage(null);
  };
  const newDoc = () => {
    const n = { id: uid(), title: p.name + ' notes', body: '', projectId: p.id, updated: Date.now() };
    A.saveNote(n); ctx.setView('notes');
  };
  // stage timeline: one dot per stage at its end date, plus today
  const pts = stages.map((s) => ({ s, r: stageRange(s) })).filter((x) => x.r.total);
  const t0 = Math.min(start, now), t1 = Math.max(now + DAY, p.deadline || 0, ...pts.map((x) => x.r.end || 0));
  const pos = (t) => Math.max(0, Math.min(100, ((t - t0) / (t1 - t0)) * 100));
  const color = P_COLORS[p.color || 'gray'];

  return html`<div>
    <button class="btn sm ghost" onClick=${back} style=${{ marginBottom: '10px' }}><${Icon} n="left" />Projects</button>
    <div class="pd">
      <section class="pd-main">
        <input id="p-name" class="title-in" style=${{ fontSize: '28px' }} value=${p.name} onInput=${(e) => up({ name: e.target.value })} aria-label="Project name" />
        <textarea class="pd-desc" value=${p.desc || p.goal || ''} onInput=${(e) => up({ desc: e.target.value })} placeholder="What is this project, and what does done look like?" aria-label="Project description"></textarea>
        <div class="grp" style=${{ display: 'flex', alignItems: 'center' }}>Docs · ${notes.length}<span style=${{ flex: 1 }}></span><button class="btn sm ghost" onClick=${newDoc}><${Icon} n="plus" />Create doc</button></div>
        <div class="panel rows">${notes.length ? notes.map((n) => html`<div key=${n.id} class="row click" onClick=${() => ctx.setView('notes')}><span></span><div class="t"><b>${n.title}</b><small>Updated ${relD(n.updated, now)}</small></div><span></span></div>`) : html`<div class="empty">No docs yet. Create one, or link a note to this project from Notes.</div>`}</div>
        <button class="btn sm danger ghost" style=${{ marginTop: '18px' }} onClick=${() => { A.delProject(p.id); back(); }}>Delete project</button>
      </section>

      <section class="pd-props">
        <div class=${'pd-health' + (late ? ' bad' : '')}>${ts.length ? (late ? 'Project is at risk' : p.status === 'done' ? 'Project is done' : 'Project is on track') : 'No tasks yet'}<small>${done}/${ts.length} done${finish ? ' · finishes ' + relD(finish, now) : ''}</small></div>
        <dl class="props">
          <dt>Status</dt><dd><select class="in" value=${p.status || 'active'} onChange=${(e) => up({ status: e.target.value })}>${Object.entries(P_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></dd>
          <dt>Stage</dt><dd>${current !== undefined ? html`<span class="spill" style=${{ '--c': color }}>${current || 'Tasks'}</span>` : html`<span class="muted">${ts.length ? 'All stages done' : '—'}</span>`}</dd>
          <dt>Start date</dt><dd><input type="date" class="in" value=${toLocalInput(start)} onChange=${(e) => up({ start: fromDateInput(e.target.value) })} /></dd>
          <dt>Deadline</dt><dd><input type="date" class="in" value=${toLocalInput(p.deadline)} onChange=${(e) => up({ deadline: fromDateInput(e.target.value, true) })} /></dd>
          <dt>Priority</dt><dd><select class="in" value=${p.priority || 'med'} onChange=${(e) => up({ priority: e.target.value })}>${Object.keys(PRI).map((k) => html`<option key=${k} value=${k}>${PRI_LABEL[k]}</option>`)}</select></dd>
          <dt>Color</dt><dd class="swatches">${Object.entries(P_COLORS).map(([k, c]) => html`<button key=${k} class=${'sw' + ((p.color || 'gray') === k ? ' on' : '')} style=${{ background: c }} onClick=${() => up({ color: k })} aria-label=${k}></button>`)}</dd>
          <dt>Labels</dt><dd><input class="in" value=${(p.labels || []).join(', ')} onInput=${(e) => up({ labels: e.target.value.split(',').map((x) => x.trim()).filter(Boolean) })} placeholder="e.g. youth, fall" /></dd>
        </dl>
      </section>

      <section class="pd-tasks">
        <div class="grp" style=${{ marginTop: 0 }}>Tasks · ${ts.length}</div>
        ${pts.length ? html`<div class="stl" aria-label="Stage timeline">
          <div class="stl-line"></div>
          <div class="stl-today" style=${{ left: pos(now) + '%' }}><span>Today</span></div>
          ${pts.map((x) => html`<div key=${x.s} class=${'stl-dot' + (x.r.done === x.r.total ? ' done' : '')} style=${{ left: pos(x.r.end || now) + '%', '--c': color }} title=${(x.s || 'Tasks') + (x.r.end ? ' · ends ' + fmtD(x.r.end) : '')}></div>`)}
          <div class="stl-dates"><span>${fmtD(t0).slice(4)}</span><span>${fmtD(t1).slice(4)}</span></div>
        </div>` : null}
        ${stages.map((s) => { const r = stageRange(s); const st = ts.filter((t) => (t.stage || '') === s).sort((a, b) => (a.status === 'done') - (b.status === 'done') || (info(a).first || 9e15) - (info(b).first || 9e15)); return html`<div key=${s} class="stg">
          <div class="stg-h"><span class="spill" style=${{ '--c': color }}>${s || 'Tasks'}</span><span class="muted mono">${r.start ? fmtD(r.start).slice(0, 10) : ''}${r.end ? ' – ' + fmtD(r.end).slice(0, 10) : ''}</span></div>
          ${st.map((t) => { const f = info(t).first; return html`<div key=${t.id} class=${'stg-t' + (t.status === 'done' ? ' dn' : '')}>
            <button class="ck" onClick=${() => A.toggleDone(t.id)} aria-label=${t.status === 'done' ? 'Mark not done' : 'Mark done'}>${t.status === 'done' ? html`<${Icon} n="check" />` : null}</button>
            <button class="tt" onClick=${() => setDrawer({ type: 'task', id: t.id })}>${t.title}</button>
            <span class="muted mono">${fmtDur(t.duration || 30)}${t.status !== 'done' && f ? ' · ' + fmtD(f).slice(0, 10) : ''}</span>
          </div>`; })}
          ${adding === s
            ? html`<form class="stg-add" onSubmit=${(e) => { e.preventDefault(); addTask(s); }}><input autoFocus class="in" value=${nt} onInput=${(e) => setNt(e.target.value)} onBlur=${() => { if (!nt.trim()) setAdding(null); }} placeholder="New task — “call venue fri 30m”" aria-label="New task" /><button class="btn sm pri">Add</button></form>`
            : html`<button class="btn sm ghost stg-plus" onClick=${() => { setAdding(s); setNt(''); }}><${Icon} n="plus" />Add task</button>`}
        </div>`; })}
        ${newStage !== null
          ? html`<form class="stg-add" onSubmit=${(e) => { e.preventDefault(); addStage(); }}><input autoFocus class="in" value=${newStage} onInput=${(e) => setNewStage(e.target.value)} placeholder="Stage name, e.g. Execution" aria-label="New stage" /><button class="btn sm pri">Add stage</button><button type="button" class="btn sm ghost" onClick=${() => setNewStage(null)}>Cancel</button></form>`
          : html`<button class="btn sm ghost stg-plus" onClick=${() => setNewStage('')}><${Icon} n="plus" />Add stage</button>`}
      </section>
    </div>
  </div>`;
}

function DraftReview(ctx) {
  const { draft, setDraft, state, A, now, commit, setView } = ctx;
  const [d, setD] = useState(draft);
  const upT = (si, ti, patch) => setD({ ...d, stages: d.stages.map((s, i) => i !== si ? s : { ...s, tasks: s.tasks.map((t, j) => j !== ti ? t : { ...t, ...patch }) }) });
  const accept = () => {
    const pid = uid(); const created = Date.now();
    const idByKey = {}; const stageLast = {};
    const newTasks = [];
    d.stages.forEach((s) => s.tasks.filter((t) => t.include).forEach((t) => { idByKey[t.key] = uid(); }));
    d.stages.forEach((s) => {
      const ids = s.tasks.filter((t) => t.include).map((t) => idByKey[t.key]);
      s.tasks.filter((t) => t.include).forEach((t, i) => {
        const deps = t.depStage && stageLast[t.depStage] ? stageLast[t.depStage] : [];
        newTasks.push({ id: idByKey[t.key], title: t.title, duration: t.duration, deadline: t.deadline, priority: 'med', status: 'todo', deps, locked: [], spent: 0, projectId: pid, created: created + newTasks.length, stage: s.name, desc: 'Stage: ' + s.name + ' · from AI draft — estimate unconfirmed' });
      });
      stageLast[s.name] = ids;
    });
    commit((st) => ({ ...st, projects: [...st.projects, { id: pid, name: d.name, deadline: d.target, status: 'active', created, goal: d.goal, stages: d.stages.map((s) => s.name) }], tasks: [...st.tasks, ...newTasks] }), 'Created “' + d.name + '” with ' + newTasks.length + ' tasks — scheduled');
    setDraft(null);
  };
  const total = d.stages.reduce((a, s) => a + s.tasks.filter((t) => t.include).reduce((b, t) => b + t.duration, 0), 0);
  return html`<div>
    <header class="hdr"><div><div class="sub"><span class="tag prop">Proposed</span> ${d.kind} plan · ${fmtDur(total)} of work · nothing saved yet</div>
      <input id="d-name" class="title-in" style=${{ fontSize: '30px', marginTop: '6px' }} value=${d.name} onInput=${(e) => setD({ ...d, name: e.target.value })} aria-label="Project name" /></div></header>
    <div class="assume"><b>Check these assumptions</b><ul>${d.assume.map((a, i) => html`<li key=${i}>${a}</li>`)}</ul>
      <p style=${{ margin: '8px 0 0' }}><b>One question:</b> ${d.ask}</p></div>
    <div class="fld" style=${{ maxWidth: '240px', marginTop: '16px' }}><label for="d-target">Target date</label><input id="d-target" class="in" type="date" value=${toLocalInput(d.target)} onChange=${(e) => { const nt = fromDateInput(e.target.value, true); if (!nt) return; const r = (nt - now) / Math.max(1, d.target - now); setD({ ...d, target: nt, stages: d.stages.map((s) => ({ ...s, tasks: s.tasks.map((t) => ({ ...t, deadline: sod(now + (t.deadline - now) * r) + 1020 * MIN })) })) }); }} /></div>
    <div class="panel" style=${{ marginTop: '16px', padding: '4px 16px' }}>
      ${d.stages.map((s, si) => html`<div key=${si} class="stage" style=${si === 0 ? { borderTop: 0 } : null}><h4>${s.name}${s.tasks[0] && s.tasks[0].depStage ? html` <span class="muted" style=${{ fontWeight: 400, fontSize: '12px' }}>· starts after ${s.tasks[0].depStage}</span>` : null}</h4>
        ${s.tasks.map((t, ti) => html`<div key=${t.key} style=${{ display: 'grid', gridTemplateColumns: 'auto 1fr 90px 150px', gap: '8px', alignItems: 'center', padding: '4px 0', opacity: t.include ? 1 : .45 }}>
          <input type="checkbox" id=${'dt' + t.key} checked=${t.include} onChange=${(e) => upT(si, ti, { include: e.target.checked })} aria-label="Include task" />
          <input class="in" value=${t.title} onInput=${(e) => upT(si, ti, { title: e.target.value })} aria-label="Task title" />
          <select class="in" value=${t.duration} onChange=${(e) => upT(si, ti, { duration: +e.target.value })} aria-label="Estimate">${[15, 30, 45, 60, 90, 120, 180, 240].concat([t.duration]).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b).map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}</select>
          <input class="in" type="date" value=${toLocalInput(t.deadline)} onChange=${(e) => upT(si, ti, { deadline: fromDateInput(e.target.value, true) })} aria-label="Deadline" />
        </div>`)}
      </div>`)}
    </div>
    <div style=${{ display: 'flex', gap: '8px', marginTop: '16px', flexWrap: 'wrap' }}><button class="btn pri" onClick=${accept}>Create project and schedule it</button><button class="btn ghost" onClick=${() => setDraft(null)}>Discard draft</button></div>
  </div>`;
}

/* ================= Notes ================= */
function NotesView(ctx) {
  const { state, A, now, commit, setToast } = ctx;
  const [sel, setSel] = useState(state.notes[0] ? state.notes[0].id : null);
  const [review, setReview] = useState(null);
  const n = state.notes.find((x) => x.id === sel);
  const newNote = () => { const x = { id: uid(), title: 'Untitled note', body: '', updated: Date.now(), projectId: null }; A.saveNote(x); setSel(x.id); setReview(null); };
  const upd = (patch) => A.saveNote({ ...n, ...patch, updated: Date.now() });
  const accept = () => {
    const tasks = review.actions.filter((a) => a.include).map((a) => ({ id: uid(), title: a.title, duration: a.duration || 30, priority: a.priority || 'med', deadline: a.deadline || null, status: 'todo', deps: [], locked: [], spent: 0, projectId: n.projectId || a.projectId || null, created: Date.now(), sourceNote: n.id, sourceLine: a.line }));
    const events = review.events.filter((a) => a.include).map((a) => ({ id: uid(), title: a.title, start: a.start, end: a.end, kind: 'meeting', sourceNote: n.id }));
    if (!tasks.length && !events.length) { setReview(null); return; }
    commit((s) => ({ ...s, tasks: [...s.tasks, ...tasks], events: [...s.events, ...events] }), 'Added ' + tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + (events.length ? ' and ' + events.length + ' event' + (events.length === 1 ? '' : 's') : '') + ' from this note');
    setReview(null);
  };
  const lines = n ? n.body.split('\n') : [];
  return html`<div>
    <header class="hdr"><div><div class="sub">${state.notes.length} notes</div><h1>Notes</h1></div><span class="grow"></span><button class="btn sm pri" onClick=${newNote}><${Icon} n="plus" />New note</button></header>
    <div class="notes">
      <div class="panel rows nlist">${state.notes.length ? state.notes.slice().sort((a, b) => b.updated - a.updated).map((x) => html`<div key=${x.id} class="row click" style=${x.id === sel ? { background: 'var(--accent-soft)' } : null} onClick=${() => { setSel(x.id); setReview(null); }}><span></span><div class="t"><b>${x.title}</b><small>${relD(x.updated, now)}${x.projectId ? ' · ' + ((state.projects.find((p) => p.id === x.projectId) || {}).name || '') : ''}</small></div><span></span></div>`) : html`<div class="empty">No notes yet.</div>`}</div>
      ${n ? html`<div class="stack">
        <div class="panel editor" style=${{ padding: '18px 20px' }}>
          <div style=${{ display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center', marginBottom: '10px' }}>
            <input id="n-title" class="title-in" style=${{ flex: '1 1 200px' }} value=${n.title} onInput=${(e) => upd({ title: e.target.value })} aria-label="Note title" />
            <select id="n-proj" class="in" style=${{ width: 'auto' }} value=${n.projectId || ''} onChange=${(e) => upd({ projectId: e.target.value || null })} aria-label="Linked project"><option value="">No project</option>${state.projects.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select>
            <button class="btn sm" onClick=${() => setReview(extractFromNote(n, state, Date.now()))}><${Icon} n="spark" />Pull out actions</button>
            <button class="btn sm ghost danger" onClick=${() => { A.delNote(n.id); setSel(null); }}>Delete</button>
          </div>
          <textarea id="n-body" value=${n.body} onInput=${(e) => upd({ body: e.target.value })} placeholder=${'Paste meeting notes or a transcript.\n\nKin picks up lines like:\n- [ ] Call venue tomorrow 30m\nAction: draft budget by friday\nDecision: keep it under $5k\nSam will send the list'}></textarea>
        </div>
        ${review ? html`<div class="panel">
          <div class="ph"><h2>Review before adding</h2><span class="grow"></span><span class="tag prop">Proposed</span></div>
          <div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
            <div class="why"><b>Summary.</b> ${review.summary}</div>
            ${review.decisions.length ? html`<div><div class="grp" style=${{ paddingTop: 0 }}>Decisions</div>${review.decisions.map((x, i) => html`<div key=${i} style=${{ fontSize: '13.5px', padding: '3px 0' }}>• ${x.text} <span class="muted mono" style=${{ fontSize: '11px' }}>line ${x.line + 1}</span></div>`)}</div>` : null}
            <div><div class="grp" style=${{ paddingTop: 0 }}>Actions → tasks</div>
              ${review.actions.length ? review.actions.map((a, i) => html`<label key=${i} style=${{ display: 'grid', gridTemplateColumns: 'auto 1fr', gap: '10px', padding: '6px 0', fontSize: '13.5px', alignItems: 'start' }}>
                <input type="checkbox" id=${'ra' + i} checked=${a.include} onChange=${(e) => setReview({ ...review, actions: review.actions.map((x, j) => j === i ? { ...x, include: e.target.checked } : x) })} />
                <span><b style=${{ fontWeight: 500 }}>${a.title}</b> <span class="muted">· ${fmtDur(a.duration || 30)}${a.deadline ? ' · due ' + relD(a.deadline, now) : ''} · line ${a.line + 1}</span>${a.note ? html`<br/><small class="muted">${a.note}</small>` : null}</span></label>`) : html`<div class="muted" style=${{ fontSize: '13px' }}>None found. Mark lines with “- [ ]”, “Action:” or “TODO”.</div>`}
            </div>
            ${review.events.length ? html`<div><div class="grp" style=${{ paddingTop: 0 }}>Meetings → calendar</div>${review.events.map((a, i) => html`<label key=${i} style=${{ display: 'flex', gap: '10px', padding: '6px 0', fontSize: '13.5px' }}><input type="checkbox" id=${'re' + i} checked=${a.include} onChange=${(e) => setReview({ ...review, events: review.events.map((x, j) => j === i ? { ...x, include: e.target.checked } : x) })} /><span><b style=${{ fontWeight: 500 }}>${a.title}</b> <span class="muted">· ${relD(a.start, now)} ${fmtT(a.start)} · line ${a.line + 1}</span></span></label>`)}</div>` : null}
            <div style=${{ display: 'flex', gap: '8px' }}><button class="btn pri sm" onClick=${accept}>Add selected</button><button class="btn sm ghost" onClick=${() => setReview(null)}>Dismiss</button></div>
          </div></div>` : null}
      </div>` : html`<div class="panel empty">Select or create a note.</div>`}
    </div>
  </div>`;
}

/* ================= Search ================= */
function SearchModal({ state, now, initial, onClose, setDrawer, setView }) {
  const [q, setQ] = useState(initial || '');
  const ql = q.trim().toLowerCase();
  const hl = (s) => { if (!ql) return s; const i = s.toLowerCase().indexOf(ql); if (i < 0) return s; return html`${s.slice(0, i)}<mark>${s.slice(i, i + ql.length)}</mark>${s.slice(i + ql.length)}`; };
  const res = !ql ? [] : [
    ...state.tasks.filter((t) => (t.title + ' ' + (t.desc || '')).toLowerCase().includes(ql)).map((t) => ({ k: 'Task', title: t.title, sub: (t.deadline ? 'Due ' + fmtD(t.deadline) : 'No deadline') + (t.status === 'done' ? ' · done' : ''), go: () => setDrawer({ type: 'task', id: t.id }) })),
    ...state.projects.filter((p) => p.name.toLowerCase().includes(ql)).map((p) => ({ k: 'Project', title: p.name, sub: p.deadline ? 'Target ' + fmtD(p.deadline) : '', go: () => setView('projects') })),
    ...state.events.filter((e) => e.title.toLowerCase().includes(ql)).map((e) => ({ k: 'Meeting', title: e.title, sub: fmtD(e.start) + ' ' + fmtT(e.start), go: () => setDrawer({ type: 'event', ev: e }) })),
    ...state.notes.flatMap((n) => { const hits = n.body.split('\n').filter((l) => l.toLowerCase().includes(ql)).slice(0, 2); return (n.title.toLowerCase().includes(ql) || hits.length) ? [{ k: 'Note', title: n.title, sub: hits.length ? hits.map((h) => h.trim()).join(' … ') : 'Title match', go: () => setView('notes') }] : []; }),
  ].slice(0, 30);
  useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  return html`<div class="scrim" style=${{ justifyContent: 'center', alignItems: 'flex-start' }} onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <div class="modal srch" style=${{ marginTop: '10vh', padding: '14px' }}>
      <div class="cmd" style=${{ boxShadow: 'none' }}><${Icon} n="search" cls="muted" /><input id="search" autofocus value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="Search tasks, projects, meetings and notes" /></div>
      <div class="rows">${res.map((r, i) => html`<div key=${i} class="row click" onClick=${() => { onClose(); r.go(); }}><span class="pill">${r.k}</span><div class="t"><b>${hl(r.title)}</b><small>${hl(r.sub)}</small></div><span></span></div>`)}
        ${ql && !res.length ? html`<div class="empty">Nothing matches “${q}”.</div>` : null}</div>
    </div></div>`;
}

/* ================= Settings ================= */
function SettingsView({ state, A, setState, commit, setToast }) {
  const s = state.settings;
  const [imp, setImp] = useState('');
  const [confirm, setConfirm] = useState(false);
  const toT = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const fromT = (v) => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  const setDay = (d, v) => A.setSettings({ hours: { ...s.hours, [d]: v } });
  const exportData = () => { const txt = JSON.stringify(state); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => setToast({ text: 'Backup copied — paste it into a note or file', id: uid() }), () => { setImp(txt); setToast({ text: 'Copy the backup from the box below', id: uid() }); }); };
  return html`<div style=${{ maxWidth: '720px' }}>
    <header class="hdr"><div><div class="sub">Everything stays on this device</div><h1>Settings</h1></div></header>
    <div class="panel"><div class="ph"><h2>Working hours</h2></div><div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
      ${[1, 2, 3, 4, 5, 6, 0].map((d) => { const h = s.hours[d]; return html`<div key=${d} class="hrs"><label style=${{ display: 'flex', gap: '6px', alignItems: 'center' }}><input type="checkbox" id=${'wd' + d} checked=${!!h} onChange=${(e) => setDay(d, e.target.checked ? [540, 1020] : null)} />${WD[d]}</label>
        ${h ? html`<input class="in" type="time" value=${toT(h[0])} onChange=${(e) => setDay(d, [fromT(e.target.value), h[1]])} aria-label=${WD[d] + ' start'} /><span class="muted">to</span><input class="in" type="time" value=${toT(h[1])} onChange=${(e) => setDay(d, [h[0], fromT(e.target.value)])} aria-label=${WD[d] + ' end'} />` : html`<span class="muted" style=${{ gridColumn: 'span 3' }}>Off</span>`}</div>`; })}
    </div></div>
    <div class="panel" style=${{ marginTop: '16px' }}><div class="ph"><h2>Breaks</h2><span class="grow"></span><button class="btn sm" onClick=${() => A.setSettings({ breaks: [...s.breaks, { s: 900, e: 915, label: 'Break' }] })}>Add break</button></div><div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
      ${s.breaks.map((b, i) => html`<div key=${i} class="hrs" style=${{ gridTemplateColumns: '1fr 110px auto 110px auto' }}><input class="in" value=${b.label} onInput=${(e) => A.setSettings({ breaks: s.breaks.map((x, j) => j === i ? { ...x, label: e.target.value } : x) })} aria-label="Break name" /><input class="in" type="time" value=${toT(b.s)} onChange=${(e) => A.setSettings({ breaks: s.breaks.map((x, j) => j === i ? { ...x, s: fromT(e.target.value) } : x) })} /><span class="muted">to</span><input class="in" type="time" value=${toT(b.e)} onChange=${(e) => A.setSettings({ breaks: s.breaks.map((x, j) => j === i ? { ...x, e: fromT(e.target.value) } : x) })} /><button class="btn sm ghost" onClick=${() => A.setSettings({ breaks: s.breaks.filter((_, j) => j !== i) })} aria-label="Remove break"><${Icon} n="x" /></button></div>`)}
      ${!s.breaks.length ? html`<span class="muted">No breaks.</span>` : null}
    </div></div>
    <div class="panel" style=${{ marginTop: '16px' }}><div class="ph"><h2>Scheduling</h2></div><div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '14px' }}>
      <label style=${{ display: 'flex', gap: '10px', alignItems: 'start' }}><input type="checkbox" id="auto" checked=${s.autoApply} onChange=${(e) => commit((st) => ({ ...st, settings: { ...st.settings, autoApply: e.target.checked }, plan: e.target.checked ? null : { blocks: runSchedule(st, Date.now()).blocks } }))} /><span><b>Reschedule automatically</b><br/><span class="muted" style=${{ fontSize: '13px' }}>When off, Steward shows proposed changes and waits for you to apply them.</span></span></label>
      <div class="grid3">
        <div class="fld"><label for="mc">Default smallest block</label><select id="mc" class="in" value=${s.minChunk} onChange=${(e) => A.setSettings({ minChunk: +e.target.value })}>${[15, 30, 45, 60, 90].map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}</select></div>
        <div class="fld"><label for="bf">Buffer around meetings</label><select id="bf" class="in" value=${s.buffer || 0} onChange=${(e) => A.setSettings({ buffer: +e.target.value })}>${[0, 5, 10, 15, 30].map((m) => html`<option key=${m} value=${m}>${m ? m + 'm' : 'None'}</option>`)}</select></div>
        <div class="fld"><label for="hz">Plan ahead</label><select id="hz" class="in" value=${s.horizon} onChange=${(e) => A.setSettings({ horizon: +e.target.value })}>${[14, 28, 42, 60].map((m) => html`<option key=${m} value=${m}>${m} days</option>`)}</select></div>
      </div>
    </div></div>
    <div class="panel" style=${{ marginTop: '16px' }}><div class="ph"><h2>About the assistant</h2></div><div style=${{ padding: '14px 16px', fontSize: '13.5px', color: 'var(--ink-2)', display: 'flex', flexDirection: 'column', gap: '8px' }}>
      <p style=${{ margin: 0 }}>Everything runs on this device with no account and no API key. Quick capture, project drafts and pulling actions out of notes use Steward’s built-in language rules, so they're fast and predictable. The calendar engine is real scheduling code, not AI.</p>
      <p style=${{ margin: 0 }}>Not connected: Google/Outlook calendar sync, booking links, meeting recording. The planner works without them.</p>
    </div></div>
    <div class="panel" style=${{ marginTop: '16px' }}><div class="ph"><h2>Your data</h2></div><div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
      <div style=${{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
        <button class="btn sm" onClick=${exportData}>Copy backup</button>
        ${state.hasSample ? html`<button class="btn sm" onClick=${() => commit((st) => ({ ...st, hasSample: false, tasks: st.tasks.filter((t) => !t.sample), projects: st.projects.filter((p) => !p.sample), events: st.events.filter((e) => !e.sample), notes: st.notes.filter((n) => !n.sample) }), 'Example data cleared')}>Clear example data</button>` : null}
        ${confirm ? html`<button class="btn sm danger" onClick=${() => { setState({ v: 1, onboarded: false, settings: defaultSettings(), projects: [], tasks: [], events: [], notes: [], plan: null }); }}>Yes, erase everything</button><button class="btn sm ghost" onClick=${() => setConfirm(false)}>Cancel</button>` : html`<button class="btn sm ghost danger" onClick=${() => setConfirm(true)}>Erase all data…</button>`}
      </div>
      <textarea id="imp" class="in" value=${imp} onInput=${(e) => setImp(e.target.value)} placeholder="Paste a backup here to restore it"></textarea>
      <div><button class="btn sm" disabled=${!imp.trim()} onClick=${() => { try { const d = JSON.parse(imp); if (!d.tasks || !d.settings) throw 0; commit(d, 'Backup restored'); setImp(''); } catch (e) { setToast({ text: 'That isn’t a Steward backup — paste the whole copied text', id: uid() }); } }}>Restore backup</button></div>
    </div></div>
  </div>`;
}

/* ================= Onboarding ================= */
function Onboarding({ onDone, now }) {
  const [s, setS] = useState(700 * 0 + 540), [e, setE] = useState(1020);
  const [days, setDays] = useState([1, 2, 3, 4, 5]);
  const [lunch, setLunch] = useState(true);
  const [first, setFirst] = useState('');
  const toT = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const fromT = (v) => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  const settings = () => ({ ...defaultSettings(), hours: Object.fromEntries([0, 1, 2, 3, 4, 5, 6].map((d) => [d, days.includes(d) ? [s, e] : null])), breaks: lunch ? [{ s: 720, e: 750, label: 'Lunch' }] : [] });
  const start = (sample) => {
    const st = sample ? { ...sampleState(Date.now()), settings: settings() } : { v: 1, onboarded: true, settings: settings(), projects: [], tasks: [], events: [], notes: [], plan: null };
    first.split('\n').map((x) => x.trim()).filter(Boolean).forEach((line) => { const p = parseCommand(line, st, Date.now()); if (p.kind === 'task') st.tasks.push({ id: uid(), title: p.title, duration: p.duration, priority: p.priority, deadline: p.deadline, status: 'todo', deps: [], locked: [], spent: 0, created: Date.now() }); });
    onDone(st);
  };
  return html`<div style=${{ paddingInline: '16px', minHeight: '100%', background: 'var(--ground)' }}><div class="panel onb">
    <div class="brand" style=${{ padding: '0 0 18px' }}><i>S</i>Steward</div>
    <h1>Tell Steward when you work.</h1>
    <p class="muted" style=${{ margin: '0 0 20px' }}>Steward fits your tasks into those hours, works around your meetings, and warns you when something won’t fit before its deadline.</p>
    <div class="fld"><label>Work days</label><div class="chips">${[1, 2, 3, 4, 5, 6, 0].map((d) => html`<button key=${d} class=${'chip' + (days.includes(d) ? ' on' : '')} onClick=${() => setDays(days.includes(d) ? days.filter((x) => x !== d) : [...days, d])}>${WD[d]}</button>`)}</div></div>
    <div class="grid2" style=${{ marginTop: '14px' }}><div class="fld"><label for="ob-s">Start</label><input id="ob-s" class="in" type="time" value=${toT(s)} onChange=${(ev) => setS(fromT(ev.target.value))} /></div><div class="fld"><label for="ob-e">End</label><input id="ob-e" class="in" type="time" value=${toT(e)} onChange=${(ev) => setE(fromT(ev.target.value))} /></div></div>
    <label style=${{ display: 'flex', gap: '8px', margin: '14px 0', alignItems: 'center' }}><input type="checkbox" id="ob-l" checked=${lunch} onChange=${(ev) => setLunch(ev.target.checked)} />Protect a lunch break (12:00–12:30)</label>
    <div class="fld"><label for="ob-t">A few things on your plate (one per line, optional)</label><textarea id="ob-t" class="in" value=${first} onInput=${(ev) => setFirst(ev.target.value)} placeholder=${'Finish retreat budget by friday 2h\nCall Pastor Mike tomorrow 15m\nPrep Sunday lesson 90m'}></textarea></div>
    <div style=${{ display: 'flex', gap: '8px', marginTop: '18px', flexWrap: 'wrap' }}><button class="btn pri" onClick=${() => start(false)}>Start planning</button><button class="btn" onClick=${() => start(true)}>Start with example data</button></div>
  </div></div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
