    ${t.repeat ? html`<div class="muted small" style=${{ marginTop: '-4px' }}>When you finish this, Steward adds the next one${t.deadline ? ', due ' + fmtD(nextOccurrence(t, now).deadline) : ''}.</div>` : null}
    <${Checklist} t=${t} up=${up} state=${state} setToast=${ctx.setToast} />
    <div class="grid2">
      <div class="fld"><label for="t-proj">Project</label><select id="t-proj" class="in" value=${t.projectId || ''} onChange=${(e) => up({ projectId: e.target.value || null })}><option value="">None</option>${state.projects.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
      <div class="fld"><label for="t-chunk">Smallest work block</label><select id="t-chunk" class="in" value=${t.minChunk || ''} onChange=${(e) => up({ minChunk: +e.target.value || null })}><option value="">Default (${state.settings.minChunk}m)</option>${[15, 30, 60, 90, 120].map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}<option value=${9999}>Don’t split</option></select></div>
    </div>
    <div class="fld"><label for="t-lab">Labels</label><input id="t-lab" class="in" value=${(t.labels || []).join(', ')} onInput=${(e) => up({ labels: e.target.value.split(',').map((x) => x.trim()).filter(Boolean) })} placeholder="e.g. errands, youth, admin" /></div>
    <div class="fld"><label for="t-deps">Waits on</label>
      <select id="t-deps" class="in" value="" onChange=${(e) => e.target.value && up({ deps: [...(t.deps || []), e.target.value] })}><option value="">Add a task this depends on…</option>${others.filter((o) => !(t.deps || []).includes(o.id)).map((o) => html`<option key=${o.id} value=${o.id}>${o.title}</option>`)}</select>
      ${(t.deps || []).length ? html`<div class="chips" style=${{ marginTop: '6px' }}>${t.deps.map((d) => { const o = state.tasks.find((x) => x.id === d); return o ? html`<button key=${d} class="chip" onClick=${() => up({ deps: t.deps.filter((x) => x !== d) })} title="Remove">${o.title}${o.status === 'done' ? ' ✓' : ''} ×</button>` : null; })}</div>` : null}
    </div>
    <div class="fld"><label for="t-desc">Notes</label><textarea id="t-desc" class="in" value=${t.desc || ''} onInput=${(e) => up({ desc: e.target.value })} placeholder="Details, links, context…"></textarea></div>
    ${src ? html`<div class="why">From note <b>${src.title}</b>${t.sourceLine != null ? ', line ' + (t.sourceLine + 1) : ''}: “${(src.body.split('\n')[t.sourceLine] || '').trim()}”</div>` : null}
    <div class="fld"><label>Work blocks</label>
      ${blocks.length ? html`<div class="panel rows">${blocks.map((b) => html`<div key=${b.id} class="row"><span class="time">${relD(b.start, now)}</span><div class="t"><b class="mono" style=${{ fontWeight: 500 }}>${fmtT(b.start)}–${fmtT(b.end)}</b><small>${b.locked ? 'Locked by you' : 'Auto-scheduled'}</small></div>
        ${b.locked ? html`<button class="btn sm" onClick=${() => A.unlock(t.id, b.lockId)}>Unlock</button>` : html`<button class="btn sm" onClick=${() => A.lockBlock(t.id, b.start, b.end)}><${Icon} n="lock" />Lock</button>`}</div>`)}</div>` : html`<div class="muted" style=${{ fontSize: '13px' }}>None yet.</div>`}
    </div>
  </aside></div>`;
}

function EventModal({ ev, A, onClose, now }) {
  const isNew = !ev.id;
  const [f, setF] = useState({ title: ev.title || '', start: ev.start, end: ev.end, kind: ev.kind || 'meeting' });
  if (ev.src) return html`<div class="scrim" style=${{ justifyContent: 'center' }} onClick=${(e) => e.target === e.currentTarget && onClose()}><div class="modal" style=${{ maxWidth: '440px' }} role="dialog" aria-label="Meeting">
    <div class="muted mono" style=${{ fontSize: '11px', textTransform: 'uppercase', letterSpacing: '.08em' }}>From your calendar · Steward plans around it</div>
    <h2 style=${{ margin: '6px 0' }}>${ev.title}</h2>
    <div class="muted">${relD(ev.start, now)} · ${fmtT(ev.start)}–${fmtT(ev.end)}${ev.location ? ' · ' + ev.location : ''}</div>
    <p class="muted small">To change it, edit it in your calendar app. Steward picks up changes within 30 minutes.</p>
    <div style=${{ display: 'flex' }}><span style=${{ flex: 1 }}></span><button class="btn" onClick=${onClose}>Close</button></div>
  </div></div>`;
  const dur = Math.round((f.end - f.start) / MIN);
  const save = (e) => { e.preventDefault(); const t = f.title.trim() || 'Meeting'; if (isNew) A.addEvent({ ...f, title: t }); else A.updEvent(ev.id, { ...f, title: t }, 'Saved'); onClose(); };
  return html`<div class="scrim" style=${{ justifyContent: 'center' }} onClick=${(e) => e.target === e.currentTarget && onClose()}><form class="modal" onSubmit=${save} style=${{ maxWidth: '440px' }}>
    <div class="muted mono" style=${{ fontSize: '11px', textTransform: 'uppercase', letterSpacing: '.08em' }}>${isNew ? 'New meeting' : 'Meeting'} · fixed — Steward plans around it</div>
    <input id="ev-title" class="title-in" autofocus value=${f.title} onInput=${(e) => setF({ ...f, title: e.target.value })} placeholder="What’s the meeting?" />
    <div class="grid2">
      <div class="fld"><label for="ev-s">Starts</label><input id="ev-s" class="in" type="datetime-local" value=${toLocalDT(f.start)} onChange=${(e) => { const s = new Date(e.target.value).getTime(); setF({ ...f, start: s, end: s + dur * MIN }); }} /></div>
      <div class="fld"><label for="ev-d">Length</label><select id="ev-d" class="in" value=${dur} onChange=${(e) => setF({ ...f, end: f.start + +e.target.value * MIN })}>${[15, 30, 45, 60, 90, 120, 180, 240].concat([dur]).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b).map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}</select></div>
    </div>
    <div style=${{ display: 'flex', gap: '8px' }}>${!isNew ? html`<button type="button" class="btn danger ghost" onClick=${() => { A.delEvent(ev.id); onClose(); }}>Delete</button>` : null}<span style=${{ flex: 1 }}></span><button type="button" class="btn ghost" onClick=${onClose}>Cancel</button><button class="btn pri" type="submit">${isNew ? 'Add meeting' : 'Save'}</button></div>
  </form></div>`;
}

/* ================= Projects ================= */
/* ================= Kanban board ================= */
const T_STATUS = [['todo', 'To do'], ['doing', 'In progress'], ['blocked', 'Blocked'], ['done', 'Done']];
/* Columns for a set of tasks grouped one way. Each column's `patch` is what dropping a card there changes. */
function boardColumns(by, ts, state, p) {
  if (by === 'status') return T_STATUS.map(([k, l]) => ({ key: k, label: l, patch: { status: k }, tasks: ts.filter((t) => (t.status || 'todo') === k) }));
  if (by === 'priority') return ['asap', 'high', 'med', 'low'].map((k) => ({ key: k, label: PRI_LABEL[k], patch: { priority: k }, tasks: ts.filter((t) => t.priority === k) }));
  if (by === 'stage') return projectStages(p, ts).map((s) => ({ key: s || '_', label: s || 'Tasks', patch: { stage: s || null }, tasks: ts.filter((t) => (t.stage || '') === s) }));
  const known = new Set(state.projects.map((x) => x.id));
  return [...state.projects.filter((x) => x.status !== 'done' || ts.some((t) => t.projectId === x.id)).map((x) => ({ key: x.id, label: x.name, color: pColor(x.color), patch: { projectId: x.id, stage: null }, tasks: ts.filter((t) => t.projectId === x.id) })),
    { key: '_', label: 'No project', patch: { projectId: null, stage: null }, tasks: ts.filter((t) => !t.projectId || !known.has(t.projectId)) }];
}

function Kanban({ by, ts, state, plan, now, A, setDrawer, p, color, onAddColumn }) {
  const cols = boardColumns(by, ts, state, p);
  const [drag, setDrag] = useState(null); // { id, from, x, y, dx, dy, w, over }
  const [adding, setAdding] = useState(null);
  const [nt, setNt] = useState('');
  const [allDone, setAllDone] = useState(false);
  const boardRef = useRef();
  const clickBlock = useRef(false);
  const info = (t) => plan.info[t.id] || {};
  const order = (a, b) => (a.status === 'done') - (b.status === 'done') || (a.status === 'done' ? (b.completed || 0) - (a.completed || 0) : (info(a).first || 9e15) - (info(b).first || 9e15)) || PRI[a.priority] - PRI[b.priority];
  const colAt = (x, y) => { const el = document.elementFromPoint(x, y); const c = el && el.closest('[data-col]'); return c ? c.getAttribute('data-col') : null; };
  const drop = (id, key) => { const c = cols.find((c) => c.key === key); if (c) A.moveTask(id, c.patch, 'Moved to ' + c.label); };

  /* Mouse: drag after a small move. Touch: hold for a moment, then drag (a quick swipe still scrolls). */
  const down = (e, t, from) => {
    if (e.button > 0) return;
    const sx = e.clientX, sy = e.clientY, touch = e.pointerType !== 'mouse';
    const el = e.currentTarget;
    let active = false, timer = null, last = { x: sx, y: sy };
    const begin = () => {
      active = true;
      const r = el.getBoundingClientRect();
      setDrag({ id: t.id, from, x: last.x, y: last.y, dx: sx - r.left, dy: sy - r.top, w: r.width, over: from });
      if (touch && navigator.vibrate) navigator.vibrate(12);
    };
    const blockScroll = (ev) => { if (active) ev.preventDefault(); };
    const move = (ev) => {
      last = { x: ev.clientX, y: ev.clientY };
      if (!active) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) { if (touch) end(); else begin(); }
        return;
      }
      const b = boardRef.current;
      if (b) { const r = b.getBoundingClientRect(); if (ev.clientX > r.right - 40) b.scrollLeft += 14; else if (ev.clientX < r.left + 40) b.scrollLeft -= 14; }
      setDrag((d) => d && { ...d, x: ev.clientX, y: ev.clientY, over: colAt(ev.clientX, ev.clientY) });
    };
    const end = () => {
      clearTimeout(timer);
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', cancel);
      removeEventListener('touchmove', blockScroll);
    };
    const cancel = () => { end(); setDrag(null); };
    const up = (ev) => {
      const was = active;
      end();
      if (!was) return;
      clickBlock.current = true; setTimeout(() => { clickBlock.current = false; }, 50);
      const key = colAt(ev.clientX, ev.clientY);
      setDrag(null);
      if (key != null && key !== from) drop(t.id, key);
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', cancel);
    addEventListener('touchmove', blockScroll, { passive: false });
    if (touch) timer = setTimeout(begin, 280);
  };
  useEffect(() => { const k = (e) => e.key === 'Escape' && setDrag(null); addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);

  const add = (c) => {
    if (!nt.trim()) return;
    const q = parseCommand(nt, state, Date.now());
    const base = p ? { projectId: p.id } : {};
    A.addTask({ title: q.title || nt, duration: q.duration || 30, priority: q.priority || 'med', deadline: q.deadline || null, hard: !!(q.hard && q.deadline), repeat: q.repeat || null, ...base, ...(q.projectId ? { projectId: q.projectId } : {}), ...c.patch, ...(c.patch.status === 'done' ? { completed: Date.now() } : {}) });
    setNt('');
  };
  const card = (t, c) => {
    const f = info(t).first, pr = by !== 'project' && !p && state.projects.find((x) => x.id === t.projectId);
    const cl = t.checklist || [], cd = cl.filter((x) => x.done).length;
    const due = t.deadline && t.status !== 'done' ? t.deadline : null;
    return html`<div key=${t.id} role="button" tabindex="0" class=${'bcard' + (t.status === 'done' ? ' dn' : '') + (drag && drag.id === t.id ? ' lifted' : '')}
      onPointerDown=${(e) => down(e, t, c.key)}
      onClick=${() => { if (!clickBlock.current) setDrawer({ type: 'task', id: t.id }); }}
      onKeyDown=${(e) => e.key === 'Enter' && setDrawer({ type: 'task', id: t.id })}>
      <div class="bc-top">
        <button class="ck" onPointerDown=${(e) => e.stopPropagation()} onClick=${(e) => { e.stopPropagation(); A.toggleDone(t.id); }} aria-label=${t.status === 'done' ? 'Mark not done' : 'Mark done'}>${t.status === 'done' ? html`<${Icon} n="check" />` : null}</button>
        <b>${t.title}</b>
      </div>
      <span class="bc-meta">
        ${pr ? html`<span class="pdot" style=${{ background: pColor(pr.color) }}></span><span>${pr.name}</span>` : null}
        <span>${fmtDur(t.duration || 30)}</span>
        ${t.status !== 'done' && f ? html`<span>${relD(f, now)}</span>` : t.status !== 'done' && info(t).unscheduled ? html`<span class="bad">No room</span>` : null}
        ${due ? html`<span class=${info(t).late || due < now ? 'bad' : ''}>due ${relD(due, now)}</span>` : null}
        ${cl.length ? html`<span class=${cd === cl.length ? 'okc' : ''}><${Icon} n="tasks" />${cd}/${cl.length}</span>` : null}
        ${t.repeat ? html`<span title=${'Repeats ' + REPEAT[t.repeat]}><${Icon} n="repeat" /></span>` : null}
        ${t.timer ? html`<span class="bad">● timing</span>` : t.spent >= 1 ? html`<span>${fmtDur(Math.round(t.spent))} tracked</span>` : null}
      </span>
      ${(by !== 'priority' && (t.priority === 'asap' || t.priority === 'high')) || (by !== 'status' && (t.status === 'blocked' || t.status === 'doing')) || t.hard || (t.labels || []).length ? html`<span class="bcard-tags">
        ${by !== 'priority' && (t.priority === 'asap' || t.priority === 'high') ? html`<span class=${'prio p-' + t.priority}>${PRI_LABEL[t.priority]}</span>` : null}
        ${by !== 'status' && t.status === 'blocked' ? html`<span class="lbl-pill">blocked</span>` : null}
        ${by !== 'status' && t.status === 'doing' ? html`<span class="lbl-pill">in progress</span>` : null}
        ${t.hard ? html`<span class="lbl-pill">hard</span>` : null}
        ${(t.labels || []).map((l) => html`<span key=${l} class="lbl-pill">${l}</span>`)}
      </span>` : null}
    </div>`;
  };
  const dragged = drag && ts.find((t) => t.id === drag.id);
  return html`<div class=${'board kb' + (drag ? ' dragging' : '')} ref=${boardRef}>
    ${cols.map((c) => {
      const list = [...c.tasks].sort(order);
      const doneCol = by === 'status' && c.key === 'done';
      const shown = doneCol && !allDone ? list.slice(0, 8) : list;
      const mins = list.filter((t) => t.status !== 'done').reduce((a, t) => a + remainingMin(t), 0);
      return html`<section key=${c.key} data-col=${c.key} class=${'bcol' + (drag && drag.over === c.key && drag.from !== c.key ? ' over' : '')} aria-label=${c.label}>
        <div class="bcol-h">
          <span class="spill" style=${{ '--c': c.color || color || 'var(--ink-3)' }}>${c.label}</span>
          <span class="muted mono">${list.length}${mins ? ' · ' + fmtDur(mins) : ''}</span>
        </div>
        <div class="bcol-body">
          ${shown.map((t) => card(t, c))}
          ${doneCol && list.length > 8 ? html`<button class="btn sm ghost" onClick=${() => setAllDone(!allDone)}>${allDone ? 'Show fewer' : 'Show all ' + list.length}</button>` : null}
          ${!list.length ? html`<div class="bcol-empty">${drag ? 'Drop here' : 'Nothing here'}</div>` : null}
        </div>
        ${adding === c.key
          ? html`<form class="stg-add" onSubmit=${(e) => { e.preventDefault(); add(c); }}><input autoFocus class="in" value=${nt} onInput=${(e) => setNt(e.target.value)} onBlur=${() => { if (!nt.trim()) setAdding(null); }} onKeyDown=${(e) => e.key === 'Escape' && setAdding(null)} placeholder="Task, e.g. “call venue fri 30m”" aria-label=${'New task in ' + c.label} /></form>`
          : html`<button class="btn sm ghost stg-plus" onClick=${() => { setAdding(c.key); setNt(''); }}><${Icon} n="plus" />Add</button>`}
      </section>`;
    })}
    ${onAddColumn ? onAddColumn() : null}
    ${dragged ? html`<div class="bghost" style=${{ left: drag.x - drag.dx + 'px', top: drag.y - drag.dy + 'px', width: drag.w + 'px' }}><b>${dragged.title}</b></div>` : null}
  </div>`;
}

function BoardBy({ by, set, opts }) {
  return html`<div class="chips">${opts.map(([k, l]) => html`<button key=${k} class=${'chip' + (by === k ? ' on' : '')} onClick=${() => set(k)}>${l}</button>`)}</div>`;
}

function ProjectsView(ctx) {
  const { state, plan, now, A, draft, setDraft, runCommand, log } = ctx;
  const [open, setOpen] = useState(null);
  const [goal, setGoal] = useState('');
  const [planning, setPlanning] = useState(false);
  const [newOpen, setNewOpen] = useState(false);
  if (draft) return html`<${DraftReview} ...${ctx} />`;
  if (open) return html`<${ProjectDetail} ...${ctx} p=${state.projects.find((p) => p.id === open)} back=${() => setOpen(null)} />`;
  return html`<div>
    <header class="hdr"><div><div class="sub">${state.projects.length} projects</div><h1>Projects</h1></div></header>
    <form class="cmd" onSubmit=${async (e) => { e.preventDefault(); if (!goal.trim() || planning) return; setPlanning(true); try { setDraft(await planProject(goal, state, ctx.setToast)); setGoal(''); } finally { setPlanning(false); } }}>
      <${Icon} n="spark" cls="muted" /><input id="goal" value=${goal} onInput=${(e) => setGoal(e.target.value)} placeholder="Describe an outcome: “youth leader retreat by nov 14”, “launch the winter curriculum”" aria-label="Describe a project" /><button class="btn pri sm" type="submit" disabled=${planning}>${planning ? 'Planning…' : 'Draft plan'}</button>
    </form>
    <div class="pgrid" style=${{ marginTop: '20px' }}>
      ${state.projects.map((p) => { const ts = state.tasks.filter((t) => t.projectId === p.id); const dn = ts.filter((t) => t.status === 'done').length; const end = Math.max(0, ...ts.filter((t) => t.status !== 'done').map((t) => (plan.info[t.id] || {}).end || 0)); const risk = p.deadline && end > p.deadline; const blocked = ts.filter((t) => t.status === 'blocked').length;
        return html`<button key=${p.id} class="panel pcard" style=${{ borderLeft: '3px solid ' + pColor(p.color) }} onClick=${() => setOpen(p.id)}>
          <div class="muted mono" style=${{ fontSize: '11px' }}>${p.deadline ? 'Target ' + fmtD(p.deadline) : 'No target date'}${p.sample ? ' · example' : ''}</div>
          <h3>${p.name}</h3>
          <div class="bar" style=${{ marginTop: 0 }}><i style=${{ width: (ts.length ? dn / ts.length * 100 : 0) + '%' }}></i></div>
          <div class="stat"><span class="pill">${dn}/${ts.length} done</span>${risk ? html`<span class="pill bad">At risk</span>` : ts.length ? html`<span class="pill ok">On track</span>` : null}${blocked ? html`<span class="pill warn">${blocked} blocked</span>` : null}${end ? html`<span class="pill">Finishes ${relD(end, now)}</span>` : null}</div>
        </button>`; })}
      <button class="panel pcard" style=${{ borderStyle: 'dashed', justifyContent: 'center', alignItems: 'center', color: 'var(--ink-3)', minHeight: '120px' }} onClick=${() => setNewOpen(true)}><${Icon} n="plus" cls="" /> New project</button>
    </div>
    ${newOpen ? html`<${NewProjectModal} state=${state} A=${A} setDraft=${setDraft} setToast=${ctx.setToast} onClose=${() => setNewOpen(false)} onCreated=${(id) => { setNewOpen(false); setOpen(id); }} />` : null}
  </div>`;
}

const pColor = (c) => P_COLORS[c] || P_COLORS.gray;
const P_COLORS = { gray: '#8a8a8a', blue: '#6f9ce8', purple: '#a58be6', green: '#72c08a', amber: '#e0a24a', red: '#ec7b70' };
const P_STATUS = { planning: 'Planning', active: 'In progress', hold: 'On hold', done: 'Done' };
/* Stages in order: the project's saved list, then any stage names found only on tasks. */
function projectStages(p, ts) {
  const names = [...(p.stages || [])];
  ts.forEach((t) => { if (t.stage && !names.includes(t.stage)) names.push(t.stage); });
  if (ts.some((t) => !t.stage) || !names.length) names.push('');
  return names;
}

/* Compact label/value rows shared by the new-project window and the project page's Details. */
function ProjectFields({ v, set, stageText }) {
  return html`<div class="kv">
    <label>Status</label><select class="ghostin" value=${v.status || 'active'} onChange=${(e) => set({ status: e.target.value })}>${Object.entries(P_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select>
    ${stageText !== undefined ? html`<label>Stage</label><span class="kv-v">${stageText}</span>` : null}
    <label>Start date</label><input type="date" class="ghostin" value=${toLocalInput(v.start)} onChange=${(e) => set({ start: fromDateInput(e.target.value) })} />
    <label>Deadline</label><input type="date" class="ghostin" value=${toLocalInput(v.deadline)} onChange=${(e) => set({ deadline: fromDateInput(e.target.value, true) })} />
    <label>Priority</label><select class="ghostin" value=${v.priority || 'med'} onChange=${(e) => set({ priority: e.target.value })}>${Object.keys(PRI).map((k) => html`<option key=${k} value=${k}>${PRI_LABEL[k]}</option>`)}</select>
    <label>Color</label><span class="swatches">${Object.entries(P_COLORS).map(([k, c]) => html`<button type="button" key=${k} class=${'sw' + ((P_COLORS[v.color] ? v.color : 'gray') === k ? ' on' : '')} style=${{ background: c }} onClick=${() => set({ color: k })} aria-label=${k}></button>`)}</span>
    <label>Labels</label><input class="ghostin" value=${(v.labels || []).join(', ')} onInput=${(e) => set({ labels: e.target.value.split(',').map((x) => x.trim()).filter(Boolean) })} placeholder="None" />
  </div>`;
}

function NewProjectModal({ state, A, setDraft, setToast, onClose, onCreated }) {
  const [v, setV] = useState({ name: '', desc: '', status: 'planning', start: sod(Date.now()), deadline: null, priority: 'med', color: 'gray', labels: [] });
  const [busy, setBusy] = useState(false);
  const set = (patch) => setV((x) => ({ ...x, ...patch }));
  const create = (e) => {
    e && e.preventDefault();
    if (!v.name.trim()) return;
    const p = { id: uid(), created: Date.now(), ...v, name: v.name.trim() };
    A.addProject(p); onCreated(p.id);
  };
  const aiPlan = async () => {
    const goal = [v.name, v.desc].filter((x) => x.trim()).join('. ') + (v.deadline ? ' by ' + fmtD(v.deadline) : '');
    if (!goal.trim()) return;
    setBusy(true);
    try {
      const d = await planProject(goal, state, setToast);
      setDraft({ ...d, name: v.name.trim() || d.name, target: v.deadline || d.target, extra: { desc: v.desc, status: v.status, start: v.start, priority: v.priority, color: v.color, labels: v.labels } });
      onClose();
    } finally { setBusy(false); }
  };
  return html`<div class="scrim" style=${{ justifyContent: 'center' }} onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <form class="modal npm" onSubmit=${create} role="dialog" aria-label="New project">
      <div class="npm-main">
        <div class="npm-top"><span class="muted"><${Icon} n="proj" /> New project</span><span style=${{ flex: 1 }}></span><button type="button" class="btn sm ghost" onClick=${onClose} aria-label="Close"><${Icon} n="x" /></button></div>
        <input class="title-in" autoFocus value=${v.name} onInput=${(e) => set({ name: e.target.value })} placeholder="Project name" aria-label="Project name" />
        <textarea class="npm-desc" value=${v.desc} onInput=${(e) => set({ desc: e.target.value })} placeholder="Goals, what done looks like, anything Steward should know…" aria-label="Description"></textarea>
      </div>
      <aside class="npm-side">
        <${ProjectFields} v=${v} set=${set} />
        <span style=${{ flex: 1 }}></span>
        <button type="submit" class="btn pri" disabled=${!v.name.trim() || busy}>Create project</button>
        <button type="button" class="btn" disabled=${!v.name.trim() || busy} onClick=${aiPlan}><${Icon} n="spark" />${busy ? 'Planning…' : 'Create with AI plan'}</button>
      </aside>
    </form>
  </div>`;
}

function ProjectDetail(ctx) {
  const { p, back, state, A, now, plan, setDrawer, commit } = ctx;
  const [adding, setAdding] = useState(null); // stage name receiving a new task
  const [nt, setNt] = useState('');
  const [newStage, setNewStage] = useState(null);
  const [showProps, setShowProps] = useState(false);
  const [view, setView2] = useState(() => { try { return localStorage.getItem('steward.pview') || 'list'; } catch (e) { return 'list'; } });
  const [sugg, setSugg] = useState(null);
  const [sugBusy, setSugBusy] = useState(false);
  const pickView = (v) => { setView2(v); try { localStorage.setItem('steward.pview', v); } catch (e) {} };
  const [pby, setPby] = useState(() => { try { return localStorage.getItem('steward.pby') || 'stage'; } catch (e) { return 'stage'; } });
  const pickPby = (v) => { setPby(v); try { localStorage.setItem('steward.pby', v); } catch (e) {} };
  if (!p) { back(); return null; }
  const ts = state.tasks.filter((t) => t.projectId === p.id);
  const notes = state.notes.filter((n) => n.projectId === p.id);
  const stages = projectStages(p, ts);
  const info = (t) => plan.info[t.id] || {};
  const open = ts.filter((t) => t.status !== 'done');
  const finish = Math.max(0, ...open.map((t) => info(t).end || 0));
  const late = open.some((t) => info(t).late) || (p.deadline && finish > p.deadline);
  const done = ts.length - open.length;
  const up = (patch) => A.updProject(p.id, patch);
  const stageRange = (name) => {
    const st = ts.filter((t) => (t.stage || '') === name);
    const starts = st.map((t) => t.status === 'done' ? t.completed : info(t).first).filter(Boolean);
    const ends = st.map((t) => t.status === 'done' ? t.completed : info(t).end || t.deadline).filter(Boolean);
    return { start: starts.length ? Math.min(...starts) : null, end: ends.length ? Math.max(...ends) : null, total: st.length, done: st.filter((t) => t.status === 'done').length };
  };
  const current = stages.find((s) => { const r = stageRange(s); return r.total && r.done < r.total; });
  const start = p.start || Math.min(p.created || now, ...ts.map((t) => info(t).first || t.created || now));
  const addTask = (stage) => {
    if (!nt.trim()) return;
    const q = parseCommand(nt, state, Date.now());
    A.addTask({ title: q.title || nt, duration: q.duration || 30, priority: q.priority || 'med', deadline: q.deadline || null, projectId: p.id, stage: stage || null });
    setNt('');
  };
  const addStage = () => {
    const name = (newStage || '').trim();
    if (name && !stages.includes(name)) up({ stages: [...stages.filter(Boolean), name] });
    setNewStage(null);
  };
  const newDoc = () => {
    const n = { id: uid(), title: p.name + ' notes', body: '', projectId: p.id, updated: Date.now() };
    A.saveNote(n); ctx.setView('notes');
  };
  // stage timeline: one dot per stage at its end date, plus today
  const pts = stages.map((s) => ({ s, r: stageRange(s) })).filter((x) => x.r.total);
  const t0 = Math.min(start, now), t1 = Math.max(now + DAY, p.deadline || 0, ...pts.map((x) => x.r.end || 0));
  const pos = (t) => Math.max(0, Math.min(100, ((t - t0) / (t1 - t0)) * 100));
  const color = pColor(p.color);
  const pct = ts.length ? Math.round(done / ts.length * 100) : 0;
  const hoursLeft = open.reduce((a, t) => a + remainingMin(t), 0) / 60;
  const daysLeft = p.deadline ? Math.ceil((sod(p.deadline) - sod(now)) / DAY) : null;
  const nextT = open.slice().sort((a, b) => (a.status === 'doing' ? -1 : 0) - (b.status === 'doing' ? -1 : 0) || (info(a).first || 9e15) - (info(b).first || 9e15))[0];
  const aiOn = typeof kinAIAvailable === 'function' && kinAIAvailable();
  const suggest = async () => {
    setSugBusy(true);
    try {
      const ask = 'Suggest the next 3-6 concrete tasks for the project "' + p.name + '"' + (p.desc ? ' (' + p.desc + ')' : '') + (current ? ', currently in the "' + current + '" stage' : '') + (p.deadline ? ', due ' + fmtD(p.deadline) : '') + '. Existing tasks: ' + (ts.map((t) => t.title).join('; ') || 'none') + '.';
      const lines = await kinBrainDump(ask, state);
      setSugg(lines.length ? lines.map((t) => ({ id: uid(), text: t, on: true })) : []);
    } catch (e) { ctx.setToast({ text: 'Couldn’t get suggestions (' + (e.message || e) + ')', id: uid() }); }
    finally { setSugBusy(false); }
  };
  const addSugg = () => {
    sugg.filter((x) => x.on && x.text.trim()).forEach((x) => { const q = parseCommand(x.text, state, Date.now()); A.addTask({ title: q.title || x.text, duration: q.duration || 30, priority: q.priority || 'med', deadline: q.deadline || null, hard: !!(q.hard && q.deadline), projectId: p.id, stage: current || null }); });
    setSugg(null);
  };
  const tl = open.concat(ts.filter((t) => t.status === 'done')).map((t) => ({ t, a: t.status === 'done' ? t.completed : info(t).first, b: t.status === 'done' ? t.completed : info(t).end })).filter((x) => x.a && x.b);
  const g0 = Math.min(now, ...tl.map((x) => x.a)), g1 = Math.max(now + DAY, p.deadline || 0, ...tl.map((x) => x.b));
  const gp = (t) => ((t - g0) / (g1 - g0)) * 100;

  return html`<div>
    <button class="btn sm ghost" onClick=${back} style=${{ marginBottom: '10px' }}><${Icon} n="left" />Projects</button>
    <header class="phero" style=${{ '--c': color }}>
      <div class="ring" style=${{ '--p': pct }} aria-label=${pct + '% done'}><span>${pct}<small>%</small></span></div>
      <div class="phero-main">
        <input id="p-name" class="title-in" value=${p.name} onInput=${(e) => up({ name: e.target.value })} aria-label="Project name" />
        <div class="stats">
          <div><b>${open.length}</b><span>tasks left</span></div>
          <div><b>${hoursLeft >= 10 ? Math.round(hoursLeft) : Math.round(hoursLeft * 10) / 10}h</b><span>of work left</span></div>
          <div class=${daysLeft != null && daysLeft < 0 ? 'bad' : late ? 'warn' : ''}><b>${daysLeft == null ? '—' : daysLeft < 0 ? Math.abs(daysLeft) + 'd' : daysLeft + 'd'}</b><span>${daysLeft == null ? 'no deadline' : daysLeft < 0 ? 'overdue' : 'to deadline'}</span></div>
          <div><b>${finish ? relD(finish, now) : '—'}</b><span>projected finish</span></div>
        </div>
      </div>
      ${nextT ? html`<div class="upnext">
        <span class="eyebrow">${nextT.status === 'doing' ? 'In progress' : 'Up next'}</span>
        <button class="tt" onClick=${() => setDrawer({ type: 'task', id: nextT.id })}>${nextT.title}</button>
        <span class="muted small">${fmtDur(remainingMin(nextT))}${info(nextT).first ? ' · ' + relD(info(nextT).first, now) + ' ' + fmtT(info(nextT).first) : ''}</span>
        <div class="acts">${nextT.status !== 'doing' ? html`<button class="btn sm pri" onClick=${() => A.startNow(nextT.id)}><${Icon} n="play" />Start now</button>` : null}<button class="btn sm" onClick=${() => A.toggleDone(nextT.id)}><${Icon} n="check" />Done</button></div>
      </div>` : null}
    </header>
    <div class=${'pd' + (view !== 'list' ? ' wide' : '')}>
      <section class="pd-main">
        <textarea class="pd-desc" value=${p.desc || p.goal || ''} onInput=${(e) => up({ desc: e.target.value })} placeholder="What is this project, and what does done look like?" aria-label="Project description"></textarea>
      </section>
      <section class="pd-docs">
        <div class="grp" style=${{ display: 'flex', alignItems: 'center', marginTop: 0 }}>Docs · ${notes.length}<span style=${{ flex: 1 }}></span><button class="btn sm ghost" onClick=${newDoc}><${Icon} n="plus" />Create doc</button></div>
        <div class="panel rows">${notes.length ? notes.map((n) => html`<div key=${n.id} class="row click" onClick=${() => ctx.setView('notes')}><span></span><div class="t"><b>${n.title}</b><small>Updated ${relD(n.updated, now)}</small></div><span></span></div>`) : html`<div class="empty">No docs yet. Create one, or link a note to this project from Notes.</div>`}</div>
        <button class="btn sm danger ghost" style=${{ marginTop: '18px' }} onClick=${() => { A.delProject(p.id); back(); }}>Delete project</button>
      </section>

      <section class="pd-props">
        <button class="pd-sum" onClick=${() => setShowProps(!showProps)} aria-expanded=${showProps}>
          <span class=${'dot ' + (late ? 'bad' : 'ok')}></span>
          <b>${ts.length ? (late ? 'At risk' : p.status === 'done' ? 'Done' : 'On track') : 'No tasks yet'}</b>
          <span class="muted">${[P_STATUS[p.status || 'active'], PRI_LABEL[p.priority || 'med'], p.deadline ? 'Due ' + fmtD(p.deadline).slice(4) : null, ts.length ? done + '/' + ts.length + ' done' : null].filter(Boolean).join(' · ')}</span>
          <span style=${{ flex: 1 }}></span><span class="muted small">${showProps ? 'Hide' : 'Details'}</span><${Icon} n=${showProps ? 'left' : 'right'} />
        </button>
        ${showProps ? html`<${ProjectFields} v=${{ ...p, start }} set=${up} stageText=${current !== undefined ? (current || 'Tasks') : (ts.length ? 'All stages done' : '—')} />` : null}
      </section>

      <section class="pd-tasks">
        <div class="vtabs">
          ${[['list', 'List'], ['board', 'Board'], ['timeline', 'Timeline']].map(([k, l]) => html`<button key=${k} class=${view === k ? 'on' : ''} onClick=${() => pickView(k)}>${l}</button>`)}
          <span style=${{ flex: 1 }}></span>
          ${aiOn ? html`<button class="btn sm ghost" disabled=${sugBusy} onClick=${suggest}><${Icon} n="spark" />${sugBusy ? 'Thinking…' : 'Suggest tasks'}</button>` : null}
        </div>
        ${sugg ? html`<div class="dump" style=${{ margin: '0 0 12px' }}>
          <div class="ph"><h2>${sugg.length ? 'Suggested next tasks' : 'No suggestions'}</h2></div>
          ${sugg.map((x) => html`<label class="it" key=${x.id}><input type="checkbox" checked=${x.on} onChange=${(e) => setSugg(sugg.map((y) => y.id === x.id ? { ...y, on: e.target.checked } : y))} /><input type="text" value=${x.text} onInput=${(e) => setSugg(sugg.map((y) => y.id === x.id ? { ...y, text: e.target.value } : y))} aria-label="Suggested task" /></label>`)}
          <div class="acts">${sugg.length ? html`<button class="btn pri sm" onClick=${addSugg} disabled=${!sugg.some((x) => x.on)}>Add ${sugg.filter((x) => x.on).length} to ${current ? '“' + current + '”' : 'this project'}</button>` : null}<button class="btn sm ghost" onClick=${() => setSugg(null)}>Dismiss</button></div>
        </div>` : null}
        ${view === 'board' ? html`<div class="kb-bar"><span class="muted" style=${{ fontSize: '12px' }}>Columns</span><${BoardBy} by=${pby} set=${pickPby} opts=${[['stage', 'Stage'], ['status', 'Status'], ['priority', 'Priority']]} /></div>
        <${Kanban} ...${ctx} by=${pby} ts=${ts} p=${p} color=${color} onAddColumn=${pby === 'stage' ? () => html`<div class="bcol bcol-new">${newStage !== null
          ? html`<form class="stg-add" onSubmit=${(e) => { e.preventDefault(); addStage(); }}><input autoFocus class="in" value=${newStage} onInput=${(e) => setNewStage(e.target.value)} onBlur=${() => { if (!newStage.trim()) setNewStage(null); }} placeholder="Stage name" aria-label="New stage" /></form>`
          : html`<button class="btn sm ghost stg-plus" onClick=${() => setNewStage('')}><${Icon} n="plus" />Add stage</button>`}</div>` : null} />`
        : view === 'timeline' ? html`<div class="gantt" style=${{ '--c': color }}>
          <div class="g-axis"><span>${fmtD(g0).slice(4)}</span><span>${fmtD(g1).slice(4)}</span></div>
          <div class="g-today" style=${{ left: (38 + gp(now) * 0.62) + '%' }}></div>
          ${p.deadline ? html`<div class="g-dl" style=${{ left: (38 + gp(p.deadline) * 0.62) + '%' }} title="Deadline"></div>` : null}
          ${tl.sort((x, y) => x.a - y.a).map((x) => html`<div key=${x.t.id} class="g-row" onClick=${() => setDrawer({ type: 'task', id: x.t.id })}>
            <span class="g-name">${x.t.title}</span>
            <span class="g-track"><i class=${x.t.status === 'done' ? 'dn' : info(x.t).late ? 'late' : ''} style=${{ left: gp(x.a) + '%', width: Math.max(1.5, gp(x.b) - gp(x.a)) + '%'}}></i></span>
          </div>`)}
          ${!tl.length ? html`<div class="empty">Nothing scheduled yet.</div>` : null}
        </div>`
        : html`
        ${pts.length ? html`<div class="stl" aria-label="Stage timeline">
          <div class="stl-line"></div>
          <div class="stl-today" style=${{ left: pos(now) + '%' }}><span>Today</span></div>
          ${pts.map((x) => html`<div key=${x.s} class=${'stl-dot' + (x.r.done === x.r.total ? ' done' : '')} style=${{ left: pos(x.r.end || now) + '%', '--c': color }} title=${(x.s || 'Tasks') + (x.r.end ? ' · ends ' + fmtD(x.r.end) : '')}></div>`)}
          <div class="stl-dates"><span>${fmtD(t0).slice(4)}</span><span>${fmtD(t1).slice(4)}</span></div>
        </div>` : null}
        ${stages.map((s) => { const r = stageRange(s); const st = ts.filter((t) => (t.stage || '') === s).sort((a, b) => (a.status === 'done') - (b.status === 'done') || (info(a).first || 9e15) - (info(b).first || 9e15)); return html`<div key=${s} class="stg">
          <div class="stg-h"><span class="spill" style=${{ '--c': color }}>${s || 'Tasks'}</span><span class="muted mono">${r.start ? fmtD(r.start).slice(0, 10) : ''}${r.end ? ' – ' + fmtD(r.end).slice(0, 10) : ''}</span></div>
          ${st.map((t) => { const f = info(t).first; return html`<div key=${t.id} class=${'stg-t' + (t.status === 'done' ? ' dn' : '')}>
            <button class="ck" onClick=${() => A.toggleDone(t.id)} aria-label=${t.status === 'done' ? 'Mark not done' : 'Mark done'}>${t.status === 'done' ? html`<${Icon} n="check" />` : null}</button>
            <button class="tt" onClick=${() => setDrawer({ type: 'task', id: t.id })}>${t.title}</button>
            <span class="muted mono">${fmtDur(t.duration || 30)}${t.status !== 'done' && f ? ' · ' + fmtD(f).slice(0, 10) : ''}</span>
          </div>`; })}
          ${adding === s
            ? html`<form class="stg-add" onSubmit=${(e) => { e.preventDefault(); addTask(s); }}><input autoFocus class="in" value=${nt} onInput=${(e) => setNt(e.target.value)} onBlur=${() => { if (!nt.trim()) setAdding(null); }} placeholder="New task — “call venue fri 30m”" aria-label="New task" /><button class="btn sm pri">Add</button></form>`
            : html`<button class="btn sm ghost stg-plus" onClick=${() => { setAdding(s); setNt(''); }}><${Icon} n="plus" />Add task</button>`}
        </div>`; })}
        ${newStage !== null
          ? html`<form class="stg-add" onSubmit=${(e) => { e.preventDefault(); addStage(); }}><input autoFocus class="in" value=${newStage} onInput=${(e) => setNewStage(e.target.value)} placeholder="Stage name, e.g. Execution" aria-label="New stage" /><button class="btn sm pri">Add stage</button><button type="button" class="btn sm ghost" onClick=${() => setNewStage(null)}>Cancel</button></form>`
          : html`<button class="btn sm ghost stg-plus" onClick=${() => setNewStage('')}><${Icon} n="plus" />Add stage</button>`}
        `}
      </section>
    </div>
  </div>`;
}

function DraftReview(ctx) {
  const { draft, setDraft, state, A, now, commit, setView } = ctx;
  const [d, setD] = useState(draft);
  const upT = (si, ti, patch) => setD({ ...d, stages: d.stages.map((s, i) => i !== si ? s : { ...s, tasks: s.tasks.map((t, j) => j !== ti ? t : { ...t, ...patch }) }) });
  const accept = () => {
    const pid = uid(); const created = Date.now();
    const idByKey = {}; const stageLast = {};
    const newTasks = [];
    d.stages.forEach((s) => s.tasks.filter((t) => t.include).forEach((t) => { idByKey[t.key] = uid(); }));
    d.stages.forEach((s) => {
      const ids = s.tasks.filter((t) => t.include).map((t) => idByKey[t.key]);
      s.tasks.filter((t) => t.include).forEach((t, i) => {
        const deps = t.depStage && stageLast[t.depStage] ? stageLast[t.depStage] : [];
        newTasks.push({ id: idByKey[t.key], title: t.title, duration: t.duration, deadline: t.deadline, priority: 'med', status: 'todo', deps, locked: [], spent: 0, projectId: pid, created: created + newTasks.length, stage: s.name, desc: 'Stage: ' + s.name + ' · from AI draft — estimate unconfirmed' });
      });
      stageLast[s.name] = ids;
    });
    commit((st) => ({ ...st, projects: [...st.projects, { status: 'active', ...(d.extra || {}), id: pid, name: d.name, deadline: d.target, created, goal: d.goal, stages: d.stages.map((s) => s.name) }], tasks: [...st.tasks, ...newTasks] }), 'Created “' + d.name + '” with ' + newTasks.length + ' tasks — scheduled');
    setDraft(null);
  };
  const total = d.stages.reduce((a, s) => a + s.tasks.filter((t) => t.include).reduce((b, t) => b + t.duration, 0), 0);
  return html`<div>
    <header class="hdr"><div><div class="sub"><span class="tag prop">Proposed</span> ${d.kind} plan · ${fmtDur(total)} of work · nothing saved yet</div>
      <input id="d-name" class="title-in" style=${{ fontSize: '30px', marginTop: '6px' }} value=${d.name} onInput=${(e) => setD({ ...d, name: e.target.value })} aria-label="Project name" /></div></header>
    <div class="assume"><b>Check these assumptions</b><ul>${d.assume.map((a, i) => html`<li key=${i}>${a}</li>`)}</ul>
      <p style=${{ margin: '8px 0 0' }}><b>One question:</b> ${d.ask}</p></div>
    <div class="fld" style=${{ maxWidth: '240px', marginTop: '16px' }}><label for="d-target">Target date</label><input id="d-target" class="in" type="date" value=${toLocalInput(d.target)} onChange=${(e) => { const nt = fromDateInput(e.target.value, true); if (!nt) return; const r = (nt - now) / Math.max(1, d.target - now); setD({ ...d, target: nt, stages: d.stages.map((s) => ({ ...s, tasks: s.tasks.map((t) => ({ ...t, deadline: sod(now + (t.deadline - now) * r) + 1020 * MIN })) })) }); }} /></div>
    <div class="panel" style=${{ marginTop: '16px', padding: '4px 16px' }}>
      ${d.stages.map((s, si) => html`<div key=${si} class="stage" style=${si === 0 ? { borderTop: 0 } : null}><h4>${s.name}${s.tasks[0] && s.tasks[0].depStage ? html` <span class="muted" style=${{ fontWeight: 400, fontSize: '12px' }}>· starts after ${s.tasks[0].depStage}</span>` : null}</h4>
        ${s.tasks.map((t, ti) => html`<div key=${t.key} style=${{ display: 'grid', gridTemplateColumns: 'auto 1fr 90px 150px', gap: '8px', alignItems: 'center', padding: '4px 0', opacity: t.include ? 1 : .45 }}>
          <input type="checkbox" id=${'dt' + t.key} checked=${t.include} onChange=${(e) => upT(si, ti, { include: e.target.checked })} aria-label="Include task" />
          <input class="in" value=${t.title} onInput=${(e) => upT(si, ti, { title: e.target.value })} aria-label="Task title" />
          <select class="in" value=${t.duration} onChange=${(e) => upT(si, ti, { duration: +e.target.value })} aria-label="Estimate">${[15, 30, 45, 60, 90, 120, 180, 240].concat([t.duration]).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b).map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}</select>
          <input class="in" type="date" value=${toLocalInput(t.deadline)} onChange=${(e) => upT(si, ti, { deadline: fromDateInput(e.target.value, true) })} aria-label="Deadline" />
        </div>`)}
      </div>`)}
    </div>
    <div style=${{ display: 'flex', gap: '8px', marginTop: '16px', flexWrap: 'wrap' }}><button class="btn pri" onClick=${accept}>Create project and schedule it</button><button class="btn ghost" onClick=${() => setDraft(null)}>Discard draft</button></div>
  </div>`;
}

/* ================= Notes ================= */
function NotesView(ctx) {
  const { state, A, now, commit, setToast } = ctx;
  const [sel, setSel] = useState(state.notes[0] ? state.notes[0].id : null);
  const [review, setReview] = useState(null);
  const [reading, setReading] = useState(false);
  const n = state.notes.find((x) => x.id === sel);
  const newNote = () => { const x = { id: uid(), title: 'Untitled note', body: '', updated: Date.now(), projectId: null }; A.saveNote(x); setSel(x.id); setReview(null); };
  const upd = (patch) => A.saveNote({ ...n, ...patch, updated: Date.now() });
  const accept = () => {
    const tasks = review.actions.filter((a) => a.include).map((a) => ({ id: uid(), title: a.title, duration: a.duration || 30, priority: a.priority || 'med', deadline: a.deadline || null, status: 'todo', deps: [], locked: [], spent: 0, projectId: n.projectId || a.projectId || null, created: Date.now(), sourceNote: n.id, sourceLine: a.line }));
    const events = review.events.filter((a) => a.include).map((a) => ({ id: uid(), title: a.title, start: a.start, end: a.end, kind: 'meeting', sourceNote: n.id }));
    if (!tasks.length && !events.length) { setReview(null); return; }
    commit((s) => ({ ...s, tasks: [...s.tasks, ...tasks], events: [...s.events, ...events] }), 'Added ' + tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + (events.length ? ' and ' + events.length + ' event' + (events.length === 1 ? '' : 's') : '') + ' from this note');
    setReview(null);
  };
  const lines = n ? n.body.split('\n') : [];
  return html`<div>
    <header class="hdr"><div><div class="sub">${state.notes.length} notes</div><h1>Notes</h1></div><span class="grow"></span><button class="btn sm pri" onClick=${newNote}><${Icon} n="plus" />New note</button></header>
    <div class="notes">
      <div class="panel rows nlist">${state.notes.length ? state.notes.slice().sort((a, b) => b.updated - a.updated).map((x) => html`<div key=${x.id} class="row click" style=${x.id === sel ? { background: 'var(--accent-soft)' } : null} onClick=${() => { setSel(x.id); setReview(null); }}><span></span><div class="t"><b>${x.title}</b><small>${relD(x.updated, now)}${x.projectId ? ' · ' + ((state.projects.find((p) => p.id === x.projectId) || {}).name || '') : ''}</small></div><span></span></div>`) : html`<div class="empty">No notes yet.</div>`}</div>
      ${n ? html`<div class="stack">
        <div class="panel editor" style=${{ padding: '18px 20px' }}>
          <div style=${{ display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center', marginBottom: '10px' }}>
            <input id="n-title" class="title-in" style=${{ flex: '1 1 200px' }} value=${n.title} onInput=${(e) => upd({ title: e.target.value })} aria-label="Note title" />
            <select id="n-proj" class="in" style=${{ width: 'auto' }} value=${n.projectId || ''} onChange=${(e) => upd({ projectId: e.target.value || null })} aria-label="Linked project"><option value="">No project</option>${state.projects.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select>
            <button class="btn sm" disabled=${reading} onClick=${async () => { setReading(true); try { setReview(await extractNote(n, state, setToast)); } finally { setReading(false); } }}><${Icon} n="spark" />${reading ? 'Reading…' : 'Pull out actions'}</button>
            <button class="btn sm ghost danger" onClick=${() => { A.delNote(n.id); setSel(null); }}>Delete</button>
          </div>
          <textarea id="n-body" value=${n.body} onInput=${(e) => upd({ body: e.target.value })} placeholder=${'Paste meeting notes or a transcript.\n\nKin picks up lines like:\n- [ ] Call venue tomorrow 30m\nAction: draft budget by friday\nDecision: keep it under $5k\nSam will send the list'}></textarea>
        </div>
        ${review ? html`<div class="panel">
          <div class="ph"><h2>Review before adding</h2><span class="grow"></span><span class="tag prop">Proposed</span></div>
          <div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
            <div class="why"><b>Summary.</b> ${review.summary}</div>
            ${review.decisions.length ? html`<div><div class="grp" style=${{ paddingTop: 0 }}>Decisions</div>${review.decisions.map((x, i) => html`<div key=${i} style=${{ fontSize: '13.5px', padding: '3px 0' }}>• ${x.text} <span class="muted mono" style=${{ fontSize: '11px' }}>${x.line != null ? 'line ' + (x.line + 1) : 'AI'}</span></div>`)}</div>` : null}
            <div><div class="grp" style=${{ paddingTop: 0 }}>Actions → tasks</div>
              ${review.actions.length ? review.actions.map((a, i) => html`<label key=${i} style=${{ display: 'grid', gridTemplateColumns: 'auto 1fr', gap: '10px', padding: '6px 0', fontSize: '13.5px', alignItems: 'start' }}>
                <input type="checkbox" id=${'ra' + i} checked=${a.include} onChange=${(e) => setReview({ ...review, actions: review.actions.map((x, j) => j === i ? { ...x, include: e.target.checked } : x) })} />
                <span><b style=${{ fontWeight: 500 }}>${a.title}</b> <span class="muted">· ${fmtDur(a.duration || 30)}${a.deadline ? ' · due ' + relD(a.deadline, now) : ''}${a.line != null ? ' · line ' + (a.line + 1) : ''}</span>${a.note ? html`<br/><small class="muted">${a.note}</small>` : null}</span></label>`) : html`<div class="muted" style=${{ fontSize: '13px' }}>None found. Mark lines with “- [ ]”, “Action:” or “TODO”.</div>`}
            </div>
            ${review.events.length ? html`<div><div class="grp" style=${{ paddingTop: 0 }}>Meetings → calendar</div>${review.events.map((a, i) => html`<label key=${i} style=${{ display: 'flex', gap: '10px', padding: '6px 0', fontSize: '13.5px' }}><input type="checkbox" id=${'re' + i} checked=${a.include} onChange=${(e) => setReview({ ...review, events: review.events.map((x, j) => j === i ? { ...x, include: e.target.checked } : x) })} /><span><b style=${{ fontWeight: 500 }}>${a.title}</b> <span class="muted">· ${relD(a.start, now)} ${fmtT(a.start)}${a.line != null ? ' · line ' + (a.line + 1) : ''}</span></span></label>`)}</div>` : null}
            <div style=${{ display: 'flex', gap: '8px' }}><button class="btn pri sm" onClick=${accept}>Add selected</button><button class="btn sm ghost" onClick=${() => setReview(null)}>Dismiss</button></div>
          </div></div>` : null}
      </div>` : html`<div class="panel empty">Select or create a note.</div>`}
    </div>
  </div>`;
}

/* ================= Search ================= */
function SearchModal({ state, now, initial, onClose, setDrawer, setView }) {
  const [q, setQ] = useState(initial || '');
  const ql = q.trim().toLowerCase();
  const hl = (s) => { if (!ql) return s; const i = s.toLowerCase().indexOf(ql); if (i < 0) return s; return html`${s.slice(0, i)}<mark>${s.slice(i, i + ql.length)}</mark>${s.slice(i + ql.length)}`; };
  const res = !ql ? [] : [
    ...state.tasks.filter((t) => (t.title + ' ' + (t.desc || '')).toLowerCase().includes(ql)).map((t) => ({ k: 'Task', title: t.title, sub: (t.deadline ? 'Due ' + fmtD(t.deadline) : 'No deadline') + (t.status === 'done' ? ' · done' : ''), go: () => setDrawer({ type: 'task', id: t.id }) })),
    ...state.projects.filter((p) => p.name.toLowerCase().includes(ql)).map((p) => ({ k: 'Project', title: p.name, sub: p.deadline ? 'Target ' + fmtD(p.deadline) : '', go: () => setView('projects') })),
    ...state.events.filter((e) => e.title.toLowerCase().includes(ql)).map((e) => ({ k: 'Meeting', title: e.title, sub: fmtD(e.start) + ' ' + fmtT(e.start), go: () => setDrawer({ type: 'event', ev: e }) })),
    ...state.notes.flatMap((n) => { const hits = n.body.split('\n').filter((l) => l.toLowerCase().includes(ql)).slice(0, 2); return (n.title.toLowerCase().includes(ql) || hits.length) ? [{ k: 'Note', title: n.title, sub: hits.length ? hits.map((h) => h.trim()).join(' … ') : 'Title match', go: () => setView('notes') }] : []; }),
  ].slice(0, 30);
  useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  return html`<div class="scrim" style=${{ justifyContent: 'center', alignItems: 'flex-start' }} onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <div class="modal srch" style=${{ marginTop: '10vh', padding: '14px' }}>
      <div class="cmd" style=${{ boxShadow: 'none' }}><${Icon} n="search" cls="muted" /><input id="search" autofocus value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="Search tasks, projects, meetings and notes" /></div>
      <div class="rows">${res.map((r, i) => html`<div key=${i} class="row click" onClick=${() => { onClose(); r.go(); }}><span class="pill">${r.k}</span><div class="t"><b>${hl(r.title)}</b><small>${hl(r.sub)}</small></div><span></span></div>`)}
        ${ql && !res.length ? html`<div class="empty">Nothing matches “${q}”.</div>` : null}</div>
    </div></div>`;
}

/* ================= Settings ================= */
function SyncPanel({ doSync, setView }) {
  const sp = kinSpace();
  const m = stewardSync.meta, on = stewardSync.on();
  const toggle = (v) => { kinSave(KIN_SPACE_KEY, { ...sp, sync: v }); stewardSync.set({}); if (v) doSync(); };
  const line = !sp || !sp.url ? 'Connect your Space (Assistant → Your Space) to keep this planner in sync on your phone and computer.'
    : !on ? 'Sync is off on this device.'
    : stewardSync.status === 'syncing' ? 'Syncing…'
    : stewardSync.status === 'error' ? stewardSync.error
    : m.last ? 'Synced ' + relD(m.last, Date.now()).toLowerCase() + ' at ' + fmtT(m.last) + '.' : 'Waiting for the first sync…';
  return html`<div class="panel" style=${{ marginTop: '16px' }}><div class="ph"><h2>Sync across devices</h2><span class="grow"></span>
    ${sp && sp.url ? html`<label class="small" style=${{ display: 'flex', gap: '6px', alignItems: 'center' }}><input type="checkbox" checked=${on} onChange=${(e) => toggle(e.target.checked)} />On</label>` : html`<button class="btn sm" onClick=${() => setView('assistant')}>Connect</button>`}</div>
    <div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '13.5px' }}>

      ${sp && sp.url ? html`<p class="muted" style=${{ margin: 0 }}>Your tasks, projects, notes, settings and what Steward has learned are saved by your Space to a private Hugging Face dataset (<b>steward-data</b>). Connect the same Space on each device. ${stewardSync.status === 'error' && /save|open|403|401|permission|write/i.test(stewardSync.error) ? 'For saving, your Space’s HF_TOKEN needs write access. Edit the token on Hugging Face to allow write access to your repos, or add a second secret named HF_WRITE_TOKEN with a write token, then restart the Space.' : ''}</p>` : null}

}

        <div class="fld"><label for="mc">Default smallest block</label><select id="mc" class="in" value=${s.minChunk} onChange=${(e) => A.setSettings({ minChunk: +e.target.value })}>${[15, 30, 45, 60, 90].map((m) => html`<option key=${m} value=${m}>${fmtDur(m)}</option>`)}</select></div>
        <div class="fld"><label for="bf">Buffer around meetings</label><select id="bf" class="in" value=${s.buffer || 0} onChange=${(e) => A.setSettings({ buffer: +e.target.value })}>${[0, 5, 10, 15, 30].map((m) => html`<option key=${m} value=${m}>${m ? m + 'm' : 'None'}</option>`)}</select></div>
        <div class="fld"><label for="hz">Plan ahead</label><select id="hz" class="in" value=${s.horizon} onChange=${(e) => A.setSettings({ horizon: +e.target.value })}>${[14, 28, 42, 60].map((m) => html`<option key=${m} value=${m}>${m} days</option>`)}</select></div>
      </div>
    </div></div>
    <div class="panel" style=${{ marginTop: '16px' }}><div class="ph"><h2>About the assistant</h2></div><div style=${{ padding: '14px 16px', fontSize: '13.5px', color: 'var(--ink-2)', display: 'flex', flexDirection: 'column', gap: '8px' }}>
      <p style=${{ margin: 0 }}>Everything runs on this device with no account and no API key. Quick capture, project drafts and pulling actions out of notes use Steward’s built-in language rules, so they're fast and predictable. The calendar engine is real scheduling code, not AI.</p>
      <p style=${{ margin: 0 }}>Calendars come in through your Space as read-only links. Not included: booking links and meeting recording.</p>
    </div></div>
    <div class="panel" style=${{ marginTop: '16px' }}><div class="ph"><h2>Your data</h2></div><div style=${{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
      <div style=${{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
        <button class="btn sm" onClick=${exportData}>Copy backup</button>
        ${state.hasSample ? html`<button class="btn sm" onClick=${() => commit((st) => ({ ...st, hasSample: false, tasks: st.tasks.filter((t) => !t.sample), projects: st.projects.filter((p) => !p.sample), events: st.events.filter((e) => !e.sample), notes: st.notes.filter((n) => !n.sample) }), 'Example data cleared')}>Clear example data</button>` : null}
        ${confirm ? html`<button class="btn sm danger" onClick=${() => { setState((cur) => syncStamp(cur, { v: 1, onboarded: false, settings: defaultSettings(), projects: [], tasks: [], events: [], notes: [], plan: null, gone: cur.gone })); }}>${stewardSync.on() ? 'Yes, erase it on every synced device' : 'Yes, erase everything'}</button><button class="btn sm ghost" onClick=${() => setConfirm(false)}>Cancel</button>` : html`<button class="btn sm ghost danger" onClick=${() => setConfirm(true)}>Erase all data…</button>`}
      </div>
      <textarea id="imp" class="in" value=${imp} onInput=${(e) => setImp(e.target.value)} placeholder="Paste a backup here to restore it"></textarea>
      <div><button class="btn sm" disabled=${!imp.trim()} onClick=${() => { try { const d = JSON.parse(imp); if (!d.tasks || !d.settings) throw 0; commit(d, 'Backup restored'); setImp(''); } catch (e) { setToast({ text: 'That isn’t a Steward backup — paste the whole copied text', id: uid() }); } }}>Restore backup</button></div>
    </div></div>
  </div>`;
}

/* ================= Onboarding ================= */
function Onboarding({ onDone, now }) {
  const [s, setS] = useState(700 * 0 + 540), [e, setE] = useState(1020);
  const [days, setDays] = useState([1, 2, 3, 4, 5]);
  const [lunch, setLunch] = useState(true);
  const [first, setFirst] = useState('');
  const toT = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const fromT = (v) => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  const settings = () => ({ ...defaultSettings(), hours: Object.fromEntries([0, 1, 2, 3, 4, 5, 6].map((d) => [d, days.includes(d) ? [s, e] : null])), breaks: lunch ? [{ s: 720, e: 750, label: 'Lunch' }] : [] });
  const start = (sample) => {
    const st = sample ? { ...sampleState(Date.now()), settings: settings() } : { v: 1, onboarded: true, settings: settings(), projects: [], tasks: [], events: [], notes: [], plan: null };
    first.split('\n').map((x) => x.trim()).filter(Boolean).forEach((line) => { const p = parseCommand(line, st, Date.now()); if (p.kind === 'task') st.tasks.push({ id: uid(), title: p.title, duration: p.duration, priority: p.priority, deadline: p.deadline, status: 'todo', deps: [], locked: [], spent: 0, created: Date.now() }); });
    onDone(st);
  };
  return html`<div style=${{ paddingInline: '16px', minHeight: '100%', background: 'var(--ground)' }}><div class="panel onb">
    <div class="brand" style=${{ padding: '0 0 18px' }}><i>S</i>Steward</div>
    <h1>Tell Steward when you work.</h1>
    <p class="muted" style=${{ margin: '0 0 20px' }}>Steward fits your tasks into those hours, works around your meetings, and warns you when something won’t fit before its deadline.</p>
    <div class="fld"><label>Work days</label><div class="chips">${[1, 2, 3, 4, 5, 6, 0].map((d) => html`<button key=${d} class=${'chip' + (days.includes(d) ? ' on' : '')} onClick=${() => setDays(days.includes(d) ? days.filter((x) => x !== d) : [...days, d])}>${WD[d]}</button>`)}</div></div>
    <div class="grid2" style=${{ marginTop: '14px' }}><div class="fld"><label for="ob-s">Start</label><input id="ob-s" class="in" type="time" value=${toT(s)} onChange=${(ev) => setS(fromT(ev.target.value))} /></div><div class="fld"><label for="ob-e">End</label><input id="ob-e" class="in" type="time" value=${toT(e)} onChange=${(ev) => setE(fromT(ev.target.value))} /></div></div>
    <label style=${{ display: 'flex', gap: '8px', margin: '14px 0', alignItems: 'center' }}><input type="checkbox" id="ob-l" checked=${lunch} onChange=${(ev) => setLunch(ev.target.checked)} />Protect a lunch break (12:00–12:30)</label>
    <div class="fld"><label for="ob-t">A few things on your plate (one per line, optional)</label><textarea id="ob-t" class="in" value=${first} onInput=${(ev) => setFirst(ev.target.value)} placeholder=${'Finish retreat budget by friday 2h\nCall Pastor Mike tomorrow 15m\nPrep Sunday lesson 90m'}></textarea></div>
    <div style=${{ display: 'flex', gap: '8px', marginTop: '18px', flexWrap: 'wrap' }}><button class="btn pri" onClick=${() => start(false)}>Start planning</button><button class="btn" onClick=${() => start(true)}>Start with example data</button></div>
  </div></div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
