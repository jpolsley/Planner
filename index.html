<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Steward</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Monochrome: black base, grey and white text; color only on tags (meetings, priorities, alerts). */
:root{
  color-scheme:dark;
  --ground:#000000; --surface:#0c0c0c; --sunk:#161616; --line:#242424; --line-2:#363636;
  --ink:#f2f2f2; --ink-2:#a6a6a6; --ink-3:#6e6e6e;
  --accent:#f2f2f2; --accent-2:#ffffff; --accent-soft:#1f1f1f; --on-accent:#000000;
  --meet:#8e96d8; --meet-soft:#1a1c2c; --meet-ink:#c9cdf2;
  --task:#bdbdbd; --task-soft:#1a1a1a;
  --warn:#e0a24a; --warn-soft:#2e2412; --bad:#ec7b70; --bad-soft:#331a18; --good:#7cc68a;
  --shadow:none;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a.btn{text-decoration:none;color:inherit}
input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
svg{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#root{height:100%}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font:700 19px/1 var(--f-display);letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font:500 13px var(--f-mono);font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:none;text-align:left;color:var(--ink-2);font-weight:500}
@media (hover:hover){.nav:hover{background:var(--sunk);color:var(--ink)}}
.nav.on{background:var(--accent-soft);color:var(--accent-2)}
.nav svg{width:18px;height:18px;flex:none}
.nav .ct{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-3)}
.rail .spacer{flex:1}
.main{overflow:auto;min-width:0}
.wrap{padding-block:22px 60px;padding-inline:28px;max-width:1280px}
.hdr{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hdr h1{font:700 30px/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.hdr .sub{color:var(--ink-3);font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.hdr .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn svg{width:15px;height:15px}
/* command bar */
.cmd{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.cmd:focus-within{border-color:var(--accent)}
.cmd input{flex:1;border:0;background:none;outline:none;padding:8px 0;font-size:15px;min-width:0}
.cmd .k{font:500 11px var(--f-mono);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.log{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.logline{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:var(--ink-2)}
.tag{font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px;flex:none}
.tag.done{background:var(--accent-soft);color:var(--accent-2)}
.tag.prop{background:var(--meet-soft);color:var(--meet-ink)}
.tag.sugg{background:var(--sunk);color:var(--ink-2)}
.tag.err{background:var(--bad-soft);color:var(--bad)}
/* today layout */
.today{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:24px;margin-top:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ph{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.ph .grow{flex:1}
.stack{display:flex;flex-direction:column;gap:18px}
.now{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.now .eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.now h3{font:700 22px/1.15 var(--f-display);margin:6px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.now .meta{color:var(--ink-3);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.now .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.bar{height:4px;background:var(--sunk);border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--ink-3);font-size:12px}
.row .time{font:500 12px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.row.click{cursor:pointer}.row.click:hover{background:var(--sunk)}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);background:none;padding:0;display:grid;place-items:center}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk svg{width:11px;height:11px}
.prio{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.p-asap{color:var(--bad)}.p-high{color:var(--warn)}.p-med{color:var(--ink-3)}.p-low{color:var(--ink-3);opacity:.7}
.alert{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .sev{border-radius:3px}
.alert.bad .sev{background:var(--bad)}.alert.warn .sev{background:var(--warn)}.alert.info .sev{background:var(--meet)}
.alert b{font-weight:600}
.alert p{margin:2px 0 8px;color:var(--ink-2);font-size:13px}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:18px 16px;color:var(--ink-3);font-size:13px}
/* timeline */
.tl{position:relative;display:grid;grid-template-columns:52px 1fr}
.hours{position:relative}
.hours span{position:absolute;right:8px;transform:translateY(-50%);font:500 11px var(--f-mono);color:var(--ink-3)}
.col{position:relative;border-left:1px solid var(--line)}
.col .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.col .gl.half{border-top-style:dashed;opacity:.5}
.col .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 7px)}
.col .brk{position:absolute;left:0;right:0;background:var(--sunk);opacity:.7}
.nowline{position:absolute;left:-5px;right:0;border-top:2px solid var(--bad);z-index:5;pointer-events:none}
.nowline:before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 8px;font-size:12.5px;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;user-select:none;z-index:2}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{font:500 10.5px var(--f-mono);opacity:.8}
.blk.ev{background:var(--meet);color:#0b0d1f;border:1px solid var(--meet)}
.blk.tk{background:var(--task-soft);color:var(--ink);border:1.5px dashed var(--task)}
.blk.tk.lock{border-style:solid}
.blk.tk.late{border-color:var(--bad);background:var(--bad-soft)}
.blk.tk.done{opacity:.45;text-decoration:line-through}
.blk.drag{opacity:.85;box-shadow:var(--shadow);z-index:10;cursor:grabbing}
.blk .lk{position:absolute;right:6px;top:5px;width:11px;height:11px;opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* week */
.week{display:grid;grid-template-columns:52px repeat(7,minmax(90px,1fr));min-width:760px}
.weekwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ad{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--sunk);border:1px solid var(--line-2);color:var(--ink-2);margin-top:3px}.wkhead .ad{display:block}.adrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.wkhead{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}
.wkhead small{display:block;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.wkhead b{font:700 20px var(--f-display)}
.wkhead.tdy b{color:var(--accent)}
.wkhead .load{font:500 10.5px var(--f-mono);color:var(--ink-3)}
/* lists */
.tbl{width:100%;border-collapse:collapse}
.grp{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:18px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pill{font:500 10.5px var(--f-mono);padding:3px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--accent-soft);color:var(--accent-2)}
/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding-block:20px 40px;padding-inline:22px;display:flex;flex-direction:column;gap:14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.modal{margin:auto;width:min(620px,calc(100% - 32px));max-height:88%;overflow:auto;background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.in{border:1px solid var(--line-2);background:var(--ground);border-radius:9px;padding:8px 10px;width:100%;outline:none}
.in:focus{border-color:var(--accent)}
.title-in{font:700 22px/1.2 var(--f-display);border:0;background:none;outline:none;width:100%;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
textarea.in{resize:vertical;min-height:80px;line-height:1.5}
.why{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.why b{color:var(--ink)}
/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--line-2)}
.pcard h3{margin:0;font:700 18px/1.2 var(--f-display)}
.pcard .stat{display:flex;gap:8px;flex-wrap:wrap}
.stage{border-top:1px solid var(--line);padding:12px 0}
.stage h4{margin:0 0 8px;font:600 13px var(--f-body)}
.assume{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:13px}
.assume ul{margin:6px 0 0;padding-left:18px}
/* notes */
.notes{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.nlist .row b{white-space:nowrap}
.editor textarea{border:0;background:none;outline:none;width:100%;min-height:340px;font:14.5px/1.65 var(--f-body);resize:vertical}
.hl{background:var(--warn-soft);border-radius:3px}
/* toast */
.focus{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden}
.focus .fdot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;animation:fpulse 1.6s ease-in-out infinite}
@keyframes fpulse{50%{opacity:.35}}
.focus .ftitle{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;color:var(--ink)}
.focus .ftitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.focus .ftitle small{color:var(--ink-3);font-size:11.5px}
.focus .fclock{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.focus .fbar{position:absolute;left:0;bottom:0;height:2px;background:var(--ink-2)}
.rit{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.rit-h{display:flex;flex-direction:column;gap:2px}.rit .eyebrow,.wr .eyebrow{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.rit .acts{display:flex;gap:6px;flex-wrap:wrap}
.rit-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rit-t{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);flex-wrap:wrap}
.rit-t>span:nth-child(2){flex:1;min-width:0}.rit-t .tt{flex:1;min-width:160px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.rit-acts{display:flex;gap:4px}
.rit-ai{padding:12px 14px;border-radius:10px;background:var(--sunk);border:1px solid var(--line)}
.aibody p{margin:0 0 8px}.aibody p:last-child{margin:0}.aibody h4{margin:10px 0 4px;font-size:13px}.aibody .li{padding-left:14px;position:relative;margin:2px 0}.aibody .li:before{content:'•';position:absolute;left:2px;color:var(--ink-3)}
.rit-links{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.wr{max-width:640px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.wr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wr-stats>div{display:flex;flex-direction:column;padding:10px 12px;border:1px solid var(--line);border-radius:10px}.wr-stats b{font-size:20px}.wr-stats span{font-size:11.5px;color:var(--ink-3)}.wr-stats .bad b{color:var(--bad)}
@media (max-width:860px){.wr-stats{grid-template-columns:1fr 1fr}}
.actcard{margin-top:8px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tmr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:860px){.focus{padding:8px 12px;gap:8px}.focus .fclock{font-size:15px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:600}
.banner{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--meet-soft);color:var(--meet-ink);margin-bottom:16px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner .grow{flex:1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.srch mark{background:var(--warn-soft);color:inherit}
.onb{max-width:560px;margin:8vh auto;padding:28px}
.onb h1{font:700 34px/1.05 var(--f-display);letter-spacing:-.02em;margin:0 0 8px}
.hrs{display:grid;grid-template-columns:60px 1fr auto 1fr;gap:8px;align-items:center}
.mob{display:none}
.lbl-pill{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);font-size:11px;line-height:16px}
/* project page: description · properties · stages */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:'main props' 'docs tasks';gap:14px 26px;align-items:start}
.pd.wide{grid-template-areas:'main props' 'tasks tasks' 'docs docs'}.pd-main{grid-area:main}.pd-props{grid-area:props}.pd-tasks{grid-area:tasks}.pd-docs{grid-area:docs}
.pd-desc{width:100%;min-height:110px;margin-top:10px;background:none;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;line-height:1.55;color:var(--ink);resize:vertical}
.pd-props{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pd-health{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;flex-direction:column;gap:2px;color:var(--good)}
.pd-health.bad{color:var(--bad)}.pd-health small{color:var(--ink-3);font-weight:400}
.phero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:18px 20px;margin-bottom:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface) 55%)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:flex;align-items:baseline;justify-content:center;padding-top:22px;font:700 20px var(--f-display)}
.ring small{font-size:11px;color:var(--ink-3);margin-left:1px}
.phero-main{flex:1;min-width:240px}.phero-main .title-in{font-size:28px;margin:0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
.stats div{display:flex;flex-direction:column}.stats b{font:700 18px var(--f-display)}.stats span{font-size:11.5px;color:var(--ink-3)}
.stats .warn b{color:var(--warn)}.stats .bad b{color:var(--bad)}
.upnext{min-width:220px;max-width:320px;padding:12px 14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.upnext .eyebrow{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--c)}
.upnext .tt{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:15px}

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="kin-engine.js"></script>
<script src="assistant.js"></script>
<script src="sync.js"></script>
<script>
/* ================= Steward — engine ================= */
const MIN = 60000, SLOT = 15 * MIN, DAY = 86400000;
const uid = () => Math.random().toString(36).slice(2, 10);
const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const atMin = (day, m) => { const d = new Date(day); d.setHours(0, m, 0, 0); return d.getTime(); };
const minOfDay = (t) => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtT = (t) => { const d = new Date(t); let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12; return h + (m ? ':' + String(m).padStart(2, '0') : '') + ap; };
const fmtD = (t) => { const d = new Date(t); return WD[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate(); };
const relD = (t, now) => { const diff = Math.round((sod(t) - sod(now)) / DAY); if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday'; if (diff > 1 && diff < 7) return WD[new Date(t).getDay()]; return fmtD(t); };
const fmtDur = (m) => { m = Math.round(m || 0); return m >= 60 ? (Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '')) : m + 'm'; };
const PRI = { asap: 0, high: 1, med: 2, low: 3 };
const PRI_LABEL = { asap: 'ASAP', high: 'High', med: 'Medium', low: 'Low' };
const toLocalInput = (t) => { if (!t) return ''; const d = new Date(t); const p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
const toLocalDT = (t) => { if (!t) return ''; const d = new Date(t); const p = (n) => String(n).padStart(2, '0'); return toLocalInput(t) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const fromDateInput = (s, endOfDay) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d, endOfDay ? 17 : 0, 0, 0, 0); return t.getTime(); };

/* ---------- storage ---------- */
const KEY = 'kin.planner.v1';
function loadState() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); return true; } catch (e) { return false; } }

function defaultSettings() {
  return {
    hours: { 0: null, 1: [540, 1020], 2: [540, 1020], 3: [540, 1020], 4: [540, 1020], 5: [540, 1020], 6: null },
    breaks: [{ s: 720, e: 750, label: 'Lunch' }],
    autoApply: true, minChunk: 30, buffer: 0, horizon: 28,
  };
}

/* ---------- interval math ---------- */
function subtract(free, busy) {
  let out = free.slice();
  for (const [bs, be] of busy) {
    const next = [];
    for (const [fs, fe] of out) {
      if (be <= fs || bs >= fe) { next.push([fs, fe]); continue; }
      if (bs > fs) next.push([fs, bs]);
      if (be < fe) next.push([be, fe]);
    }
    out = next;
  }
  return out.sort((a, b) => a[0] - b[0]);
}

/* ---------- the scheduler ----------
   Real, deterministic placement: builds open time from working hours minus
   breaks, meetings and locked blocks, then places tasks earliest-deadline-first
   (ASAP first, undated tasks get a soft deadline by priority), honoring
   dependencies, start dates and minimum chunk size. */
function freeTime(state, from, to) {
  const { settings } = state;
  let free = [];
  for (let d = sod(from); d < to; d = addDays(d, 1)) {
    const h = settings.hours[new Date(d).getDay()];
    if (!h) continue;
    let segs = [[atMin(d, h[0]), atMin(d, h[1])]];
    segs = subtract(segs, settings.breaks.map((b) => [atMin(d, b.s), atMin(d, b.e)]));
    free.push(...segs);
  }
  const buf = (settings.buffer || 0) * MIN;
  const busy = state.events.map((e) => [e.start - buf, e.end + buf]);
  state.tasks.forEach((t) => (t.locked || []).forEach((b) => busy.push([b.start, b.end])));
  free = subtract(free, busy);
  return free.map(([s, e]) => [Math.max(s, from), e]).filter(([s, e]) => e - s >= SLOT);
}

function softDeadline(t, now) {
  if (t.deadline) return t.deadline;
  return now + ({ asap: 1, high: 3, med: 7, low: 14 }[t.priority] || 7) * DAY + 30 * DAY; // undated sorts after dated
}

function runSchedule(state, now) {
  const start = Math.ceil(now / SLOT) * SLOT;
  const horizonEnd = addDays(sod(now), state.settings.horizon || 28);
  let free = freeTime(state, start, horizonEnd);
  const blocks = [], info = {};
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  const open = state.tasks.filter((t) => t.status !== 'done');
  // locked blocks are part of the plan
  open.forEach((t) => (t.locked || []).forEach((b) => blocks.push({ id: 'L' + b.id, taskId: t.id, start: b.start, end: b.end, locked: true, lockId: b.id })));
  const lastEnd = {};
  const remaining = {};
  open.forEach((t) => {
    const lockedMin = (t.locked || []).filter((b) => b.end > now).reduce((a, b) => a + (b.end - Math.max(b.start, now)) / MIN, 0);
    remaining[t.id] = Math.max(0, (t.duration || 30) - (t.spent || 0) - lockedMin);
    lastEnd[t.id] = Math.max(0, ...(t.locked || []).map((b) => b.end));
  });
  const placed = new Set();
  const pending = new Set(open.map((t) => t.id));
  const depsOf = (t) => (t.deps || []).filter((d) => byId[d] && byId[d].status !== 'done');
  let guard = 0;
  while (pending.size && guard++ < 2000) {
    const ready = [...pending].map((id) => byId[id]).filter((t) => depsOf(t).every((d) => placed.has(d)));
    if (!ready.length) { // cycle
      [...pending].forEach((id) => { info[id] = { unscheduled: true, reason: 'Dependency loop — check this task’s “waits on” list.' }; });
      break;
    }
    ready.sort((a, b) => ((a.priority === 'asap' ? 0 : 1) - (b.priority === 'asap' ? 0 : 1)) || ((a.hard && a.deadline ? 0 : 1) - (b.hard && b.deadline ? 0 : 1)) || (softDeadline(a, now) - softDeadline(b, now)) || (PRI[a.priority] - PRI[b.priority]) || (a.created - b.created));
    const t = ready[0];
    pending.delete(t.id); placed.add(t.id);
    let need = remaining[t.id];
    const depEnd = Math.max(0, ...depsOf(t).map((d) => lastEnd[d] || 0));
    const earliest = Math.max(start, depEnd, t.startDate || 0);
    const chunk = Math.max(15, t.minChunk || state.settings.minChunk || 30);
    const why = [];
    if (depEnd > start) why.push('after ' + depsOf(t).map((d) => '“' + byId[d].title + '”').join(', ') + ' finishes');
    if ((t.startDate || 0) > start) why.push('not before its start date ' + fmtD(t.startDate));
    let first = null;
    for (let i = 0; i < free.length && need > 0; i++) {
      let [fs, fe] = free[i];
      if (fe <= earliest) continue;
      fs = Math.max(fs, earliest);
      const len = (fe - fs) / MIN;
      if (len < Math.min(chunk, need)) continue;
      const take = Math.min(len, need);
      const bs = fs, be = fs + take * MIN;
      blocks.push({ id: t.id + ':' + bs, taskId: t.id, start: bs, end: be });
      first = first || bs;
      lastEnd[t.id] = Math.max(lastEnd[t.id], be);
      need -= take;
      const rest = [];
      if (fs > free[i][0]) rest.push([free[i][0], fs]);
      if (be < fe) rest.push([be, fe]);
      free.splice(i, 1, ...rest);
      i += rest.length - 1;
    }
    const inf = { first, end: lastEnd[t.id], why };
    if (need > 0) { inf.unscheduled = true; inf.short = need; }
    if (t.deadline && lastEnd[t.id] > t.deadline) inf.late = true;
    info[t.id] = inf;
  }
  blocks.sort((a, b) => a.start - b.start);
  return { blocks, info, computedAt: now };
}

/* conflicts + attention items */
function attention(state, plan, now) {
  const out = [];
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  state.tasks.filter((t) => t.status !== 'done').forEach((t) => {
    const inf = plan.info[t.id] || {};
    if (t.deadline && t.deadline < now) out.push({ sev: 'bad', kind: 'overdue', task: t, title: 'Overdue: ' + t.title, text: 'Deadline was ' + relD(t.deadline, now) + ' ' + fmtT(t.deadline) + '. ' + fmtDur(remainingMin(t)) + ' of work left.' });
    else if (inf.unscheduled && inf.short) out.push({ sev: 'bad', kind: 'nofit', task: t, title: 'Won’t fit: ' + t.title, text: fmtDur(Math.round(inf.short)) + ' can’t be placed in the next ' + state.settings.horizon + ' days of working time.' });
    else if (inf.late) {
      const over = Math.round((inf.end - t.deadline) / MIN);

const PATHS = {

function useNow() {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(i); }, []);
  return now;
}

/* ================= App ================= */
function App() {
  const now = useNow();
  const [state, setState] = useState(() => loadState() || { v: 1, onboarded: false, settings: defaultSettings(), projects: [], tasks: [], events: [], notes: [], plan: null });
  const [view, setView] = useState(() => { try { return localStorage.getItem('kin.view') || 'today'; } catch (e) { return 'today'; } });
  const [toast, setToast] = useState(null);
  const [drawer, setDrawer] = useState(null); // {type:'task', id} | {type:'event', id|draft}
  const [search, setSearch] = useState(false);
  const [log, setLog] = useState([]);
  const [draft, setDraft] = useState(null);
  const hist = useRef([]);
  const [saveOk, setSaveOk] = useState(true);

  useEffect(() => { setSaveOk(saveState(state)); }, [state]);

  /* ---- sync across devices, and calendar links, through the user's Space ---- */
  const stateRef = useRef(state); stateRef.current = state;
  const [, bump] = useState(0);
  useEffect(() => { const f = () => bump((n) => n + 1); stewardSync.subs.add(f); return () => stewardSync.subs.delete(f); }, []);
  const applySynced = useCallback((d) => {
    if (!d || !d.planner) return;
    setState((s) => ({ ...s, ...d.planner, plan: s.plan, events: [...(d.planner.events || []), ...s.events.filter((e) => e.src)], allday: s.allday }));
    if (d.memory) kinMem.replace(d.memory, d.memoryGone);
  }, []);
  const doSync = useCallback((opts) => syncNow(() => stateRef.current, applySynced, opts), [applySynced]);
  const [calStatus, setCalStatus] = useState({});
  const refreshCalendars = useCallback(async () => {
    const cals = (stateRef.current.settings.calendars || []).filter((c) => c.url);
    if (!cals.length || !kinCloudAvailable()) return;
    for (const cal of cals) {
      try {
        const r = await fetchCalendar(cal);
        setState((s) => ({ ...s, events: [...s.events.filter((e) => e.src !== cal.id), ...r.timed], allday: [...(s.allday || []).filter((e) => e.src !== cal.id), ...r.allday] }));
        setCalStatus((c) => ({ ...c, [cal.id]: { at: Date.now(), count: r.timed.length + r.allday.length, name: r.name } }));
      } catch (e) { setCalStatus((c) => ({ ...c, [cal.id]: { at: Date.now(), error: e.message } })); }
    }
  }, []);
  const calKey = (state.settings.calendars || []).map((c) => c.id + c.url).join('|');
  useEffect(() => {
    // drop events from calendars that were removed
    const ids = new Set((state.settings.calendars || []).map((c) => c.id));
    if (state.events.some((e) => e.src && !ids.has(e.src)) || (state.allday || []).some((e) => !ids.has(e.src))) setState((s) => ({ ...s, events: s.events.filter((e) => !e.src || ids.has(e.src)), allday: (s.allday || []).filter((e) => ids.has(e.src)) }));
    refreshCalendars();
  }, [calKey]);
  useEffect(() => {
    doSync();
    const vis = () => { if (document.visibilityState === 'visible') { doSync(); refreshCalendars(); } else doSync({ pushOnly: true, keepalive: true }); };
    const space = () => { stewardSync.saveMeta({ rev: 0, hash: '' }); doSync(); refreshCalendars(); };
    document.addEventListener('visibilitychange', vis);
    addEventListener('steward-space', space);
    const tick = setInterval(() => { if (document.visibilityState === 'visible') doSync(); }, 90000);
    const calTick = setInterval(refreshCalendars, 30 * 60000);
    window.kinMemChanged = () => { clearTimeout(window.__memPush); window.__memPush = setTimeout(() => doSync({ pushOnly: true }), 4000); };
    return () => { document.removeEventListener('visibilitychange', vis); removeEventListener('steward-space', space); clearInterval(tick); clearInterval(calTick); };
  }, []);
  const syncData = useMemo(() => syncPayload(state).planner, [state]);
  useEffect(() => { const t = setTimeout(() => doSync({ pushOnly: true }), 4000); return () => clearTimeout(t); }, [syncData]);
  useEffect(() => { try { localStorage.setItem('kin.view', view); } catch (e) {} }, [view]);

  const commit = useCallback((fn, label) => {
    setState((prev) => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      if (next === prev) return prev;
      hist.current.push(prev); if (hist.current.length > 40) hist.current.shift();

  }, []);
  const undo = useCallback(() => {
    const prev = hist.current.pop();
    if (prev) { setState((cur) => syncStamp(cur, { ...prev, events: [...prev.events.filter((e) => !e.src), ...cur.events.filter((e) => e.src)], allday: cur.allday })); setToast({ text: 'Undone', id: uid() }); }
  }, []);
  useEffect(() => { const k = (e) => { const tag = (e.target.tagName || '').toLowerCase(); if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !['input', 'textarea'].includes(tag)) { e.preventDefault(); undo(); } if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearch(true); } }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, [undo]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), toast.text.length > 90 ? 15000 : 5000); return () => clearTimeout(t); }, [toast]);

  const computed = useMemo(() => runSchedule(state, now), [state.tasks, state.events, state.settings, now]);
  const auto = state.settings.autoApply;
  const plan = useMemo(() => {
    if (auto || !state.plan) return computed;
    const alive = new Set(state.tasks.filter((t) => t.status !== 'done').map((t) => t.id));
    const locked = computed.blocks.filter((b) => b.locked);
    return { ...computed, blocks: [...state.plan.blocks.filter((b) => alive.has(b.taskId) && !b.locked && b.end > now), ...locked].sort((a, b) => a.start - b.start) };
  }, [auto, computed, state.plan]);
  const pendingMoves = useMemo(() => {
    if (auto || !state.plan) return 0;
    const key = (b) => b.taskId + '@' + b.start;
    const a = new Set(plan.blocks.filter((b) => !b.locked).map(key));
    return computed.blocks.filter((b) => !b.locked && !a.has(key(b))).length;
  }, [auto, plan, computed]);
  useEffect(() => { if (!auto && !state.plan && state.onboarded) setState((s) => ({ ...s, plan: { blocks: computed.blocks } })); }, [auto]);
  const applyPlan = () => commit((s) => ({ ...s, plan: { blocks: computed.blocks } }), 'New plan applied');
  const alerts = useMemo(() => attention(state, computed, now), [state, computed, now]);

  /* ---- actions ---- */
  const A = useMemo(() => ({
    addTask: (o) => { const t = { id: uid(), status: 'todo', priority: 'med', duration: 30, deps: [], locked: [], spent: 0, created: Date.now(), ...o }; commit((s) => ({ ...s, tasks: [...s.tasks, t] })); return t; },
    updTask: (id, patch, label) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => (t.id === id ? { ...t, ...(typeof patch === 'function' ? patch(t) : patch) } : t)) }), label),
    delTask: (id) => commit((s) => ({ ...s, tasks: s.tasks.filter((t) => t.id !== id).map((t) => ({ ...t, deps: (t.deps || []).filter((d) => d !== id) })) }), 'Task deleted'),
    toggleDone: (id) => commit((s) => { const t = s.tasks.find((x) => x.id === id); return t ? withStatus(s, id, t.status === 'done' ? 'todo' : 'done') : s; }, 'Marked complete'),
    applyActions: (list) => commit((s) => list.reduce((st, a) => applyAction(st, a), s), 'Steward made ' + list.length + ' change' + (list.length === 1 ? '' : 's')),
    moveTask: (id, patch, label) => commit((s) => { const { status, ...rest } = patch; const s2 = status ? withStatus(s, id, status) : s; return { ...s2, tasks: s2.tasks.map((t) => (t.id === id ? { ...t, ...rest } : t)) }; }, label),
    addEvent: (o) => { const e = { id: uid(), kind: 'meeting', ...o }; commit((s) => ({ ...s, events: [...s.events, e] })); return e; },
    updEvent: (id, patch, label) => commit((s) => (s.events.some((e) => e.id === id && e.src) ? s : { ...s, events: s.events.map((e) => (e.id === id ? { ...e, ...patch } : e)) }), label),
    delEvent: (id) => commit((s) => ({ ...s, events: s.events.filter((e) => e.id !== id) }), 'Event deleted'),
    startNow: (taskId) => commit((s) => {
      const at = Math.floor(Date.now() / MIN) * MIN;
      return { ...s, tasks: s.tasks.map((t) => {
        if (t.id !== taskId) return t.timer ? stopTimer(t, Date.now()) : t;
        const len = Math.max(15, Math.min(remainingMin(t), 90));
        return { ...t, status: 'doing', timer: t.timer || Date.now(), locked: [...(t.locked || []).filter((b) => b.end <= at), { id: uid(), start: at, end: at + len * MIN }] };
      }) };
    }, 'Timer started. The rest of your day reflowed around it'),
    startTimer: (taskId) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => (t.id === taskId ? { ...t, status: t.status === 'done' ? 'doing' : t.status === 'todo' ? 'doing' : t.status, completed: null, timer: t.timer || Date.now() } : t.timer ? stopTimer(t, Date.now()) : t)) }), 'Timer started'),
    pauseTimer: (taskId) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => (t.id === taskId && t.timer ? stopTimer(t, Date.now()) : t)) }), 'Paused. Time saved to the task'),
    finishTimer: (taskId) => commit((s) => withStatus({ ...s, tasks: s.tasks.map((t) => (t.id === taskId && t.timer ? stopTimer(t, Date.now()) : t)) }, taskId, 'done'), 'Done. Time saved to the task'),
    lockBlock: (taskId, start, end, replaceLockId) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => t.id !== taskId ? t : { ...t, locked: [...(t.locked || []).filter((b) => b.id !== replaceLockId), { id: uid(), start, end }] }) }), 'Block locked at ' + fmtT(start) + ' — the rest reflowed'),
    unlock: (taskId, lockId) => commit((s) => ({ ...s, tasks: s.tasks.map((t) => t.id !== taskId ? t : { ...t, locked: (t.locked || []).filter((b) => b.id !== lockId) }) }), 'Unlocked — Steward will place it'),
    setSettings: (patch) => commit((s) => ({ ...s, settings: { ...s.settings, ...patch } })),
    addProject: (p) => { commit((s) => ({ ...s, projects: [...s.projects, p] })); },
    updProject: (id, patch) => commit((s) => ({ ...s, projects: s.projects.map((p) => (p.id === id ? { ...p, ...patch } : p)) })),
    delProject: (id) => commit((s) => ({ ...s, projects: s.projects.filter((p) => p.id !== id), tasks: s.tasks.map((t) => (t.projectId === id ? { ...t, projectId: null } : t)) }), 'Project deleted (tasks kept)'),
    saveNote: (n) => setState((s) => syncStamp(s, { ...s, notes: s.notes.some((x) => x.id === n.id) ? s.notes.map((x) => (x.id === n.id ? n : x)) : [n, ...s.notes] })),
    delNote: (id) => commit((s) => ({ ...s, notes: s.notes.filter((n) => n.id !== id) }), 'Note deleted'),
  }), [commit]);

  /* ---- assistant ---- */
  const say = (items) => setLog((l) => [...items.map((x) => ({ ...x, id: uid() })), ...l].slice(0, 6));
  const runCommand = (text) => {
    if (!text.trim()) return;
    const p = parseCommand(text, state, Date.now());
    if (p.kind === 'search') { setSearch(p.q || true); return; }
    if (p.kind === 'plan') { say([{ tag: 'sugg', text: 'Drafting a plan for “' + p.goal + '”…' }]); planProject(p.goal, state, setToast).then((d) => { setDraft(d); setView('projects'); say([{ tag: 'prop', text: 'Drafted a plan for “' + p.goal + '”. Review it in Projects before anything is created.' }]); }); return; }
    if (p.kind === 'event') {
      const clash = state.events.find((e) => e.start < p.end && e.end > p.start);
      const e = A.addEvent({ title: p.title, start: p.start, end: p.end });
      say([{ tag: 'done', text: 'Added meeting “' + e.title + '” · ' + relD(e.start, now) + ' ' + fmtT(e.start) + '–' + fmtT(e.end) + '. Flexible work around it was reflowed.' }, ...(clash ? [{ tag: 'sugg', text: 'Overlaps “' + clash.title + '”. Steward didn’t move either — adjust one if needed.' }] : [])]);
      return;
    }
    const t = A.addTask({ title: p.title, duration: p.duration, priority: p.priority, deadline: p.deadline, projectId: p.projectId, hard: !!(p.hard && p.deadline), repeat: p.repeat || null });
    const sched = runSchedule({ ...state, tasks: [...state.tasks, t] }, Date.now());
    const inf = sched.info[t.id] || {};
    const where = auto ? (inf.first ? 'scheduled ' + relD(inf.first, now) + ' ' + fmtT(inf.first) : 'not placed yet') : 'will be placed when you apply the plan';

  if (!state.onboarded) return html`<${Onboarding} onDone=${(s) => setState(s)} now=${now} />`;

  const ctx = { state, plan, computed, now, A, commit, setDrawer, setView, alerts, runCommand, log, draft, setDraft, pendingMoves, applyPlan, setSearch, setToast };
  const openTasks = state.tasks.filter((t) => t.status !== 'done').length;
  const NAV = [['today', 'Today', 'today'], ['calendar', 'Calendar', 'cal'], ['tasks', 'Tasks', 'tasks', openTasks], ['projects', 'Projects', 'proj', state.projects.filter((p) => p.status !== 'done').length], ['notes', 'Notes', 'notes', state.notes.length], ['assistant', 'Assistant', 'spark']];
  return html`<div class="app">

      ${NAV.map(([k, l, ic, ct]) => html`<button key=${k} class=${'nav' + (view === k ? ' on' : '')} onClick=${() => setView(k)} aria-current=${view === k ? 'page' : null}><${Icon} n=${ic} /><span class="lbl">${l}</span><span class="mlbl">${l}</span>${ct ? html`<span class="ct">${ct}</span>` : null}</button>`)}
      <button class="nav nomob" onClick=${() => setSearch(true)}><${Icon} n="search" /><span class="lbl">Search</span><span class="mlbl">Search</span><span class="ct">⌘K</span></button>
      <div class="spacer"></div>
      <button class=${'nav' + (view === 'settings' ? ' on' : '')} onClick=${() => setView('settings')}><${Icon} n="gear" /><span class="lbl">Settings</span><span class="mlbl">Settings</span></button>
    </nav>
    <main class="main"><${FocusBar} ...${ctx} /><div class="wrap">
      ${!saveOk ? html`<div class="banner warn"><b>Not saving.</b><span class="grow">This browser is blocking storage, so changes will be lost when you close the tab. Use Settings → Backup to copy your data out.</span></div>` : null}
      ${pendingMoves ? html`<div class="banner"><b>Proposed update</b><span class="grow">${pendingMoves} work block${pendingMoves > 1 ? 's' : ''} would move to keep the plan realistic.</span><button class="btn sm" onClick=${() => setView('calendar')}>Review</button><button class="btn sm pri" onClick=${applyPlan}>Apply plan</button></div>` : null}
      ${view === 'today' ? html`<${TodayView} ...${ctx} />` : null}
      ${view === 'calendar' ? html`<${CalendarView} ...${ctx} />` : null}
      ${view === 'tasks' ? html`<${TasksView} ...${ctx} />` : null}
      ${view === 'projects' ? html`<${ProjectsView} ...${ctx} />` : null}
      ${view === 'notes' ? html`<${NotesView} ...${ctx} />` : null}
      ${view === 'assistant' ? html`<${AssistantView} ...${ctx} />` : null}
      ${view === 'settings' ? html`<${SettingsView} ...${ctx} setState=${setState} doSync=${doSync} calStatus=${calStatus} refreshCalendars=${refreshCalendars} />` : null}
    </div></main>
    ${drawer && drawer.type === 'task' ? html`<${TaskDrawer} ...${ctx} id=${drawer.id} onClose=${() => setDrawer(null)} />` : null}
    ${drawer && drawer.type === 'event' ? html`<${EventModal} ...${ctx} ev=${drawer.ev} onClose=${() => setDrawer(null)} />` : null}
    ${search ? html`<${SearchModal} ...${ctx} initial=${typeof search === 'string' ? search : ''} onClose=${() => setSearch(false)} />` : null}
    ${toast ? html`<div class="toast" role="status"><span>${toast.text}</span>${toast.undo ? html`<button onClick=${() => { undo(); }}>Undo</button>` : null}</div>` : null}
  </div>`;
}

/* ================= Daily plan, wrap-up and weekly review ================= */
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const weekStart = (t) => { const d = sod(t); return addDays(d, -((new Date(d).getDay() + 6) % 7)); };
/* Streams one Steward answer into `text`. */
function useAIStream() {
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const run = async (system, user, opts = {}) => {
    setBusy(true); setErr(''); setText('');
    try {
      await kinReady();
      let acc = '';
      const out = await kinAI.ask({ messages: [{ role: 'system', content: system }, { role: 'user', content: user }], baseSystem: system, maxTokens: opts.maxTokens || 600, temperature: 0.5, docs: opts.docs !== false, onChunk: (c) => { acc += c; setText(acc); } });
      setText(out || acc);
      return out || acc;
    } catch (e) { setErr(e.message || String(e)); return ''; }
    finally { setBusy(false); }
  };
  return { text, busy, err, run, setText };
}
/* Light formatting for AI text: paragraphs, bullet lines and **bold**. */
function AIBody({ text }) {
  const bold = (l) => l.split(/\*\*(.+?)\*\*/g).map((p, i) => (i % 2 ? html`<b key=${i}>${p}</b>` : p));
  return html`<div class="aibody">${String(text).split('\n').filter((l, i, a) => l.trim() || (a[i - 1] || '').trim()).map((l, i) => {
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    const h = l.match(/^\s*#{1,4}\s+(.*)$/);
    return h ? html`<h4 key=${i}>${bold(h[1])}</h4>` : m ? html`<div key=${i} class="li">${bold(m[1])}</div>` : l.trim() ? html`<p key=${i}>${bold(l)}</p>` : null;
  })}</div>`;
}
const aiReady = () => typeof kinAIAvailable === 'function' && kinAIAvailable();

function dayStats(state, plan, now, day) {
  const next = addDays(day, 1);
  const blocks = plan.blocks.filter((b) => b.start >= day && b.start < next);
  const ids = [...new Set(blocks.map((b) => b.taskId))];
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  const meetings = state.events.filter((e) => e.start >= day && e.start < next).sort((a, b) => a.start - b.start);
  const h = state.settings.hours[new Date(day).getDay()];
  const cap = h ? h[1] - h[0] - state.settings.breaks.reduce((a, b) => a + (b.e - b.s), 0) : 0;
  const focus = blocks.reduce((a, b) => a + (b.end - b.start) / MIN, 0);
  const meet = meetings.reduce((a, e) => a + (e.end - e.start) / MIN, 0);
  const done = state.tasks.filter((t) => t.status === 'done' && t.completed >= day && t.completed < next);
  const tracked = state.tasks.reduce((a, t) => a + (t.sessions || []).filter((x) => x.s >= day && x.s < next).reduce((m, x) => m + (x.e - x.s) / MIN, 0) + (t.timer && t.timer >= day ? (now - t.timer) / MIN : 0), 0);
  return { tasks: ids.map((id) => byId[id]).filter(Boolean), meetings, cap, focus, meet, done, tracked, blocks };
}

function DayRitual(ctx) {
  const { state, plan, now, A, commit, setDrawer } = ctx;
  const d0 = sod(now), key = dayKey(now), hour = new Date(now).getHours();
  const rit = state.rituals || {};
  const h = state.settings.hours[new Date(now).getDay()];
  const endH = h ? h[1] / 60 : 17;
  const [open, setOpen] = useState(null); // 'plan' | 'wrap' | 'week'
  const [note, setNote] = useState('');
  const ai = useAIStream();
  const mark = (k) => commit((s) => ({ ...s, rituals: { ...(s.rituals || {}), [k]: key } }));
  const st = dayStats(state, plan, now, d0);
  const ws = weekStart(now);
  const weekDue = (new Date(now).getDay() === 5 && hour >= 12) || [0, 6].includes(new Date(now).getDay()) || (new Date(now).getDay() === 1 && hour < 12);
  const reviewedWeek = rit.week && rit.week >= (new Date(now).getDay() === 1 ? addDays(ws, -7) : ws);
  const mode = open || (weekDue && !reviewedWeek ? 'weekhint' : null) || (hour >= Math.max(15, endH - 1.5) && rit.wrap !== key && h ? 'wraphint' : null) || (hour < 13 && rit.plan !== key && h ? 'planhint' : null);
  if (!mode) return html`<div class="rit-links"><button class="btn sm ghost" onClick=${() => setOpen('plan')}>Plan my day</button><button class="btn sm ghost" onClick=${() => setOpen('wrap')}>Wrap up</button><button class="btn sm ghost" onClick=${() => setOpen('week')}>Weekly review</button></div>`;
  if (mode === 'week' || mode === 'weekhint') return mode === 'week' ? html`<${WeeklyReview} ...${ctx} onClose=${() => setOpen(null)} onSaved=${() => { commit((s) => ({ ...s, rituals: { ...(s.rituals || {}), week: weekStart(Date.now()) } })); setOpen(null); }} />`
    : html`<div class="rit"><div class="rit-h"><span class="eyebrow">Weekly review</span><b>Look back at your week and set up the next one.</b></div><div class="acts"><button class="btn sm pri" onClick=${() => setOpen('week')}>Start review</button><button class="btn sm ghost" onClick=${() => commit((s) => ({ ...s, rituals: { ...(s.rituals || {}), week: weekStart(Date.now()) } }))}>Skip this week</button></div></div>`;

  if (mode === 'planhint' || mode === 'plan') {
    const over = st.cap && st.focus + st.meet > st.cap;
    const top = st.tasks.slice().sort((a, b) => PRI[a.priority] - PRI[b.priority] || (a.deadline || 9e15) - (b.deadline || 9e15)).slice(0, 3);
    const ask = () => ai.run(kinSystem(state, plan, 'plan my day'), 'It is ' + fmtT(now) + '. Help me plan today. In a few short paragraphs or bullets: what matters most today and why, what to protect time for, what could slip if the day gets away from me, and one question if you need to know something. Keep it under 150 words. Do not list suggested tasks.', { maxTokens: 400 });
    return html`<div class="rit">
      <div class="rit-h"><span class="eyebrow">Plan your day</span><b>${st.meetings.length} meeting${st.meetings.length === 1 ? '' : 's'} · ${fmtDur(Math.round(st.focus))} of focus work${st.cap ? ' · ' + Math.round((st.focus + st.meet) / st.cap * 100) + '% of your hours' : ''}</b>${over ? html`<span class="bad small">Today is over-full. Something will need to move.</span>` : null}</div>
      ${top.length ? html`<div class="rit-list">${top.map((t, i) => html`<button key=${t.id} class="rit-t" onClick=${() => setDrawer({ type: 'task', id: t.id })}><span class="mono muted">${i + 1}</span><span>${t.title}</span><span class="muted mono">${fmtDur(remainingMin(t))}${t.deadline ? ' · due ' + relD(t.deadline, now).toLowerCase() : ''}</span></button>`)}</div>` : html`<div class="muted small">Nothing scheduled for today yet.</div>`}
      ${ai.text || ai.busy ? html`<div class="rit-ai">${ai.text ? html`<${AIBody} text=${ai.text} />` : html`<span class="muted">Thinking…</span>`}</div>` : null}
      ${ai.err ? html`<div class="bad small">${ai.err}</div>` : null}
      <div class="acts">
        <button class="btn sm pri" onClick=${() => { mark('plan'); setOpen(null); }}>Looks good</button>
        ${aiReady() ? html`<button class="btn sm" disabled=${ai.busy} onClick=${ask}><${Icon} n="spark" />${ai.text ? 'Ask again' : 'Talk it through with Steward'}</button>` : null}
        ${over && st.tasks.length ? html`<button class="btn sm ghost" onClick=${() => { const low = st.tasks.slice().sort((a, b) => PRI[b.priority] - PRI[a.priority])[0]; A.updTask(low.id, { startDate: addDays(d0, 1) }, 'Moved “' + low.title + '” to tomorrow'); }}>Move the lowest priority to tomorrow</button>` : null}
      </div>
    </div>`;
  }

  // wrap-up
  const left = st.tasks.filter((t) => t.status !== 'done');
  const finish = async () => {
    const text = note.trim();
    if (text) {
      const line = '**' + fmtD(now) + '**: ' + text;
      const log = state.notes.find((n) => n.log === 'daily');
      A.saveNote(log ? { ...log, body: line + '\n\n' + log.body, updated: Date.now() } : { id: uid(), log: 'daily', title: 'Daily log', body: line, updated: Date.now() });
      if (aiReady()) kinLearnFrom('Reflection on my day: ' + text, '').catch(() => {});
    }
    mark('wrap'); setOpen(null); setNote('');
  };
  return html`<div class="rit">
    <div class="rit-h"><span class="eyebrow">Wrap up your day</span><b>${st.done.length} done today${st.tracked >= 1 ? ' · ' + fmtDur(Math.round(st.tracked)) + ' tracked' : ''}${left.length ? ' · ' + left.length + ' still open' : ''}</b></div>
    ${left.length ? html`<div class="rit-list">${left.map((t) => html`<div key=${t.id} class="rit-t">
      <button class="tt" onClick=${() => setDrawer({ type: 'task', id: t.id })}>${t.title}</button>
      <span class="rit-acts"><button class="btn sm" onClick=${() => A.toggleDone(t.id)}><${Icon} n="check" />Done</button><button class="btn sm ghost" onClick=${() => A.updTask(t.id, { startDate: addDays(d0, 1) }, 'Moved to tomorrow')}>Tomorrow</button><button class="btn sm ghost" onClick=${() => A.updTask(t.id, (x) => ({ duration: (x.duration || 30) + 30 }), 'Added 30m')}>+30m</button></span>
    </div>`)}</div>` : html`<div class="muted small">Everything planned for today is done. Nice work.</div>`}
    <textarea class="in" rows="2" value=${note} onInput=${(e) => setNote(e.target.value)} placeholder="How did today go? What got in the way? (optional, saved to your Daily log and helps Steward learn)" aria-label="How did today go"></textarea>
    <div class="acts"><button class="btn sm pri" onClick=${finish}>Finish the day</button>${open ? html`<button class="btn sm ghost" onClick=${() => setOpen(null)}>Close</button>` : html`<button class="btn sm ghost" onClick=${() => mark('wrap')}>Not now</button>`}</div>
  </div>`;
}

function WeeklyReview({ state, plan, now, A, onClose, onSaved, setDrawer }) {
  const ai = useAIStream();
  const w1 = weekStart(now), last = [0, 6].includes(new Date(now).getDay()) || new Date(now).getDay() === 5 ? w1 : addDays(w1, -7);
  const from = last, to = addDays(last, 7);
  const done = state.tasks.filter((t) => t.status === 'done' && t.completed >= from && t.completed < to);
  const tracked = state.tasks.reduce((a, t) => a + (t.sessions || []).filter((x) => x.s >= from && x.s < to).reduce((m, x) => m + (x.e - x.s) / MIN, 0), 0);
  const est = done.reduce((a, t) => a + (t.duration || 30), 0);
  const slipped = state.tasks.filter((t) => t.deadline && t.deadline >= from && t.deadline < Math.min(to, now) && (t.status !== 'done' || t.completed > t.deadline));
  const byProj = state.projects.filter((p) => p.status !== 'done').map((p) => {
    const ts = state.tasks.filter((t) => t.projectId === p.id);
    const end = Math.max(0, ...ts.filter((t) => t.status !== 'done').map((t) => (plan.info[t.id] || {}).end || 0));
    return { p, doneWeek: done.filter((t) => t.projectId === p.id).length, open: ts.filter((t) => t.status !== 'done').length, risk: !!(p.deadline && end > p.deadline) };
  });
  const nx = Math.max(to, sod(now)), nxEnd = addDays(nx, 7);
  const nextMeet = state.events.filter((e) => e.start >= nx && e.start < nxEnd);
  const nextFocus = plan.blocks.filter((b) => b.start >= nx && b.start < nxEnd).reduce((a, b) => a + (b.end - b.start) / MIN, 0);
  const cap = [...Array(7)].reduce((a, _, i) => { const h = state.settings.hours[new Date(addDays(nx, i)).getDay()]; return a + (h ? h[1] - h[0] - state.settings.breaks.reduce((x, b) => x + (b.e - b.s), 0) : 0); }, 0);
  const nextMeetMin = nextMeet.reduce((a, e) => a + (e.end - e.start) / MIN, 0);
  const range = fmtD(from).slice(4) + ' – ' + fmtD(addDays(to, -1)).slice(4);
  const facts = [
    'Week of ' + range + '.',
    'Finished ' + done.length + ' task' + (done.length === 1 ? '' : 's') + (done.length ? ': ' + done.slice(0, 20).map((t) => t.title).join('; ') : '') + '.',
    tracked >= 1 ? 'Tracked ' + fmtDur(Math.round(tracked)) + ' with the timer; finished tasks were estimated at ' + fmtDur(est) + '.' : '',
    slipped.length ? 'Deadlines that slipped: ' + slipped.map((t) => t.title + (t.status === 'done' ? ' (finished late)' : ' (still open)')).join('; ') + '.' : 'No deadlines slipped.',
    byProj.length ? 'Projects: ' + byProj.map((x) => x.p.name + ' — ' + x.doneWeek + ' done this week, ' + x.open + ' open' + (x.risk ? ', at risk of missing its deadline' : '')).join('; ') + '.' : '',
    'Next 7 days: ' + nextMeet.length + ' meetings (' + fmtDur(Math.round(nextMeetMin)) + '), ' + fmtDur(Math.round(nextFocus)) + ' of scheduled work, out of ' + fmtDur(cap) + ' working time.',
  ].filter(Boolean).join('\n');
  const write = () => ai.run(kinSystem(state, plan, 'weekly review of my work'), 'Write my weekly review from these facts:\n' + facts + '\n\nUse short sections with headings: "Wins", "What slipped and why it might have", "Next week", and end with one or two reflection questions for me. Connect it to what you know about my role and goals, and cite my documents if relevant. Keep it under 250 words.', { maxTokens: 700 });
  const save = () => {
    const body = '## This week\n' + facts.split('\n').map((l) => '- ' + l).join('\n') + (ai.text ? '\n\n## Steward’s review\n' + ai.text : '');
    A.saveNote({ id: uid(), title: 'Weekly review · ' + range, body, updated: Date.now(), log: 'weekly' });
    if (ai.text && aiReady()) kinLearnFrom('My weekly review: ' + facts, '').catch(() => {});
    onSaved();
  };
  const stat = (n, l, cls) => html`<div class=${cls || ''}><b>${n}</b><span>${l}</span></div>`;
  return html`<div class="scrim" style=${{ justifyContent: 'center' }} onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <div class="modal wr" role="dialog" aria-label="Weekly review">
      <div style=${{ display: 'flex', alignItems: 'center' }}><div><div class="eyebrow">Weekly review</div><h2 style=${{ margin: '2px 0 0' }}>${range}</h2></div><span style=${{ flex: 1 }}></span><button class="btn sm ghost" onClick=${onClose} aria-label="Close"><${Icon} n="x" /></button></div>
      <div class="stats wr-stats">${stat(done.length, 'finished')}${stat(tracked >= 1 ? fmtDur(Math.round(tracked)) : '—', 'tracked')}${stat(slipped.length, 'slipped', slipped.length ? 'bad' : '')}${stat(cap ? Math.round((nextFocus + nextMeetMin) / cap * 100) + '%' : '—', 'next week booked', cap && nextFocus + nextMeetMin > cap ? 'bad' : '')}</div>
      ${slipped.length ? html`<div><div class="grp">Slipped</div><div class="panel rows">${slipped.map((t) => html`<${TaskRow} key=${t.id} t=${t} state=${state} plan=${plan} now=${now} A=${A} setDrawer=${setDrawer} />`)}</div></div>` : null}
      ${byProj.length ? html`<div><div class="grp">Projects</div><div class="panel rows">${byProj.map((x) => html`<div key=${x.p.id} class="row"><span class="pdot" style=${{ background: pColor(x.p.color), marginRight: 0 }}></span><div class="t"><b>${x.p.name}</b><small>${x.doneWeek} done this week · ${x.open} open</small></div>${x.risk ? html`<span class="pill bad">At risk</span>` : html`<span class="pill ok">On track</span>`}</div>`)}</div></div>` : null}
      ${ai.text || ai.busy ? html`<div class="rit-ai">${ai.text ? html`<${AIBody} text=${ai.text} />` : html`<span class="muted">Steward is writing your review…</span>`}</div>` : null}
      ${ai.err ? html`<div class="bad small">${ai.err}</div>` : null}
      <div class="acts" style=${{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
        ${aiReady() ? html`<button class="btn sm" disabled=${ai.busy} onClick=${write}><${Icon} n="spark" />${ai.text ? 'Rewrite' : 'Write my review'}</button>` : null}
        <span style=${{ flex: 1 }}></span>
        <button class="btn sm pri" disabled=${ai.busy} onClick=${save}>Save to Notes</button>
      </div>
    </div>
  </div>`;
}

/* ================= Focus timer ================= */
function FocusBar({ state, A, setDrawer }) {
  const t = state.tasks.find((x) => x.timer);
  const [, tick] = useState(0);
  useEffect(() => { if (!t) return; const i = setInterval(() => tick((n) => n + 1), 1000); return () => clearInterval(i); }, [t && t.id]);
  useEffect(() => { document.title = t ? '● ' + t.title + ' · Steward' : 'Steward'; }, [t && t.id]);
  if (!t) return null;
  const now = Date.now();
  const sec = Math.floor((now - t.timer) / 1000);
  const clock = (Math.floor(sec / 3600) ? Math.floor(sec / 3600) + ':' : '') + String(Math.floor(sec / 60) % 60).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  const tot = trackedMin(t, now), est = t.duration || 30;
  return html`<div class="focus" role="timer" aria-label="Focus timer">
    <span class="fdot"></span>
    <button class="ftitle" onClick=${() => setDrawer({ type: 'task', id: t.id })}><b>${t.title}</b><small>${fmtDur(Math.round(tot))} of ${fmtDur(est)}${tot > est ? ' · over estimate' : ''}</small></button>
    <span class="fclock mono">${clock}</span>
    <button class="btn sm" onClick=${() => A.pauseTimer(t.id)}>Pause</button>
    <button class="btn sm pri" onClick=${() => A.finishTimer(t.id)}><${Icon} n="check" />Done</button>
    <i class="fbar" style=${{ width: Math.min(100, tot / est * 100) + '%' }}></i>
  </div>`;
}

/* ================= Command bar ================= */
function CommandBar(ctx) {
  const { runCommand, log, state, plan, now, A, setDrawer } = ctx;
  const [v, setV] = useState('');

  const [dump, setDump] = useState(null);     // { items: [{ id, text, on }] } awaiting review
  const [filter, setFilter] = useState(null); // { q, ids }
  const [err, setErr] = useState('');
  const ref = useRef();
  useEffect(() => { const k = (e) => { if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); ref.current && ref.current.focus(); } }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  useEffect(() => { const el = ref.current; if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }, [v]);
  const aiOn = typeof kinAIAvailable === 'function' && kinAIAvailable();
  const submit = async () => {
    const text = v.trim();
    if (!text || busy) return;
    const kind = aiOn ? kinBarIntent(text) : 'command';
    if (kind === 'command') { runCommand(text); setV(''); return; }
    setBusy(true); setErr('');
    try {
      if (kind === 'filter') {
        const ids = await kinFilterTasks(text, state);
        setFilter({ q: text, ids }); setDump(null);
      } else {
        const lines = await kinBrainDump(text, state);
        if (!lines.length) setErr('Steward didn’t find any tasks in that. Try listing a few things you need to do.');
        else { setDump({ items: lines.map((t) => ({ id: uid(), text: t, on: true })) }); setFilter(null); }
      }
