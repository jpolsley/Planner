<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Steward</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Monochrome: black base, grey and white text; color only on tags (meetings, priorities, alerts). */
:root{
  color-scheme:dark;
  --ground:#000000; --surface:#0c0c0c; --sunk:#161616; --line:#242424; --line-2:#363636;
  --ink:#f2f2f2; --ink-2:#a6a6a6; --ink-3:#6e6e6e;
  --accent:#f2f2f2; --accent-2:#ffffff; --accent-soft:#1f1f1f; --on-accent:#000000;
  --meet:#8e96d8; --meet-soft:#1a1c2c; --meet-ink:#c9cdf2;
  --task:#bdbdbd; --task-soft:#1a1a1a;
  --warn:#e0a24a; --warn-soft:#2e2412; --bad:#ec7b70; --bad-soft:#331a18; --good:#7cc68a;
  --shadow:none;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a.btn{text-decoration:none;color:inherit}
input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
svg{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#root{height:100%}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font:700 19px/1 var(--f-display);letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font:500 13px var(--f-mono);font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:none;text-align:left;color:var(--ink-2);font-weight:500}
@media (hover:hover){.nav:hover{background:var(--sunk);color:var(--ink)}}
.nav.on{background:var(--accent-soft);color:var(--accent-2)}
.nav svg{width:18px;height:18px;flex:none}
.nav .ct{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-3)}
.rail .spacer{flex:1}
.main{overflow:auto;min-width:0}
.wrap{padding-block:22px 60px;padding-inline:28px;max-width:1280px}
.hdr{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hdr h1{font:700 30px/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.hdr .sub{color:var(--ink-3);font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.hdr .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn svg{width:15px;height:15px}
/* command bar */
.cmd{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.cmd:focus-within{border-color:var(--accent)}
.cmd input{flex:1;border:0;background:none;outline:none;padding:8px 0;font-size:15px;min-width:0}
.cmd .k{font:500 11px var(--f-mono);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.log{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.logline{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:var(--ink-2)}
.tag{font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px;flex:none}
.tag.done{background:var(--accent-soft);color:var(--accent-2)}
.tag.prop{background:var(--meet-soft);color:var(--meet-ink)}
.tag.sugg{background:var(--sunk);color:var(--ink-2)}
.tag.err{background:var(--bad-soft);color:var(--bad)}
/* today layout */
.today{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:24px;margin-top:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ph{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.ph .grow{flex:1}
.stack{display:flex;flex-direction:column;gap:18px}
.now{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.now .eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.now h3{font:700 22px/1.15 var(--f-display);margin:6px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.now .meta{color:var(--ink-3);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.now .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.bar{height:4px;background:var(--sunk);border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--ink-3);font-size:12px}
.row .time{font:500 12px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.row.click{cursor:pointer}.row.click:hover{background:var(--sunk)}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);background:none;padding:0;display:grid;place-items:center}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk svg{width:11px;height:11px}
.prio{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.p-asap{color:var(--bad)}.p-high{color:var(--warn)}.p-med{color:var(--ink-3)}.p-low{color:var(--ink-3);opacity:.7}
.alert{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .sev{border-radius:3px}
.alert.bad .sev{background:var(--bad)}.alert.warn .sev{background:var(--warn)}.alert.info .sev{background:var(--meet)}
.alert b{font-weight:600}
.alert p{margin:2px 0 8px;color:var(--ink-2);font-size:13px}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:18px 16px;color:var(--ink-3);font-size:13px}
/* timeline */
.tl{position:relative;display:grid;grid-template-columns:52px 1fr}
.hours{position:relative}
.hours span{position:absolute;right:8px;transform:translateY(-50%);font:500 11px var(--f-mono);color:var(--ink-3)}
.col{position:relative;border-left:1px solid var(--line)}
.col .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.col .gl.half{border-top-style:dashed;opacity:.5}
.col .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 7px)}
.col .brk{position:absolute;left:0;right:0;background:var(--sunk);opacity:.7}
.nowline{position:absolute;left:-5px;right:0;border-top:2px solid var(--bad);z-index:5;pointer-events:none}
.nowline:before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 8px;font-size:12.5px;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;user-select:none;z-index:2}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{font:500 10.5px var(--f-mono);opacity:.8}
.blk.ev{background:var(--meet);color:#0b0d1f;border:1px solid var(--meet)}
.blk.tk{background:var(--task-soft);color:var(--ink);border:1.5px dashed var(--task)}
.blk.tk.lock{border-style:solid}
.blk.tk.late{border-color:var(--bad);background:var(--bad-soft)}
.blk.tk.done{opacity:.45;text-decoration:line-through}
.blk.drag{opacity:.85;box-shadow:var(--shadow);z-index:10;cursor:grabbing}
.blk .lk{position:absolute;right:6px;top:5px;width:11px;height:11px;opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* week */
.week{display:grid;grid-template-columns:52px repeat(7,minmax(90px,1fr));min-width:760px}
.weekwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.wkhead{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}
.wkhead small{display:block;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.wkhead b{font:700 20px var(--f-display)}
.wkhead.tdy b{color:var(--accent)}
.wkhead .load{font:500 10.5px var(--f-mono);color:var(--ink-3)}
/* lists */
.tbl{width:100%;border-collapse:collapse}
.grp{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:18px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pill{font:500 10.5px var(--f-mono);padding:3px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--accent-soft);color:var(--accent-2)}
/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding-block:20px 40px;padding-inline:22px;display:flex;flex-direction:column;gap:14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.modal{margin:auto;width:min(620px,calc(100% - 32px));max-height:88%;overflow:auto;background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.in{border:1px solid var(--line-2);background:var(--ground);border-radius:9px;padding:8px 10px;width:100%;outline:none}
.in:focus{border-color:var(--accent)}
.title-in{font:700 22px/1.2 var(--f-display);border:0;background:none;outline:none;width:100%;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
textarea.in{resize:vertical;min-height:80px;line-height:1.5}
.why{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.why b{color:var(--ink)}
/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--line-2)}
.pcard h3{margin:0;font:700 18px/1.2 var(--f-display)}
.pcard .stat{display:flex;gap:8px;flex-wrap:wrap}
.stage{border-top:1px solid var(--line);padding:12px 0}
.stage h4{margin:0 0 8px;font:600 13px var(--f-body)}
.assume{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:13px}
.assume ul{margin:6px 0 0;padding-left:18px}
/* notes */
.notes{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.nlist .row b{white-space:nowrap}
.editor textarea{border:0;background:none;outline:none;width:100%;min-height:340px;font:14.5px/1.65 var(--f-body);resize:vertical}
.hl{background:var(--warn-soft);border-radius:3px}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:600}
.banner{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--meet-soft);color:var(--meet-ink);margin-bottom:16px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner .grow{flex:1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.srch mark{background:var(--warn-soft);color:inherit}
.onb{max-width:560px;margin:8vh auto;padding:28px}
.onb h1{font:700 34px/1.05 var(--f-display);letter-spacing:-.02em;margin:0 0 8px}
.hrs{display:grid;grid-template-columns:60px 1fr auto 1fr;gap:8px;align-items:center}
.mob{display:none}
/* project page: description · properties · stages */
.pd{display:grid;grid-template-columns:minmax(0,1.15fr) 260px minmax(0,1fr);gap:22px;align-items:start}
.pd-desc{width:100%;min-height:110px;margin-top:10px;background:none;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;line-height:1.55;color:var(--ink);resize:vertical}
.pd-props{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pd-health{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;flex-direction:column;gap:2px;color:var(--good)}
.pd-health.bad{color:var(--bad)}.pd-health small{color:var(--ink-3);font-weight:400}
.props{display:grid;grid-template-columns:86px 1fr;gap:10px 10px;padding:14px;margin:0;align-items:center}
.props dt{color:var(--ink-3);font-size:13px}.props dd{margin:0;min-width:0}.props .in{width:100%}
.swatches{display:flex;gap:6px}.sw{width:20px;height:20px;border-radius:6px;border:2px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
.spill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.stl{position:relative;height:54px;margin:4px 6px 14px}
.stl-line{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line-2);border-radius:2px}
.stl-dot{position:absolute;top:16px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);border:2px solid var(--c)}
.stl-dot.done{background:var(--c)}
.stl-today{position:absolute;top:0;bottom:18px;width:0;border-left:1px dashed var(--bad)}
.stl-today span{position:absolute;top:-2px;left:4px;font:500 9.5px var(--f-mono);color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.stl-dates{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:var(--ink-3)}
.stg{border-top:1px solid var(--line);padding:12px 0 6px}
.stg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px}
.stg-t{display:flex;align-items:center;gap:10px;padding:6px 2px}
.stg-t .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3);background:none;display:grid;place-items:center;padding:0;flex:none}
.stg-t .ck svg{width:12px;height:12px}
.stg-t.dn .ck{background:var(--good);border-color:var(--good);color:#000}
.stg-t .tt{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-t.dn .tt{color:var(--ink-3);text-decoration:line-through}
.stg-t .mono{font-size:11.5px;white-space:nowrap}
.stg-plus{margin:4px 0}
.stg-add{display:flex;gap:8px;margin:6px 0}.stg-add .in{flex:1;min-width:0}
@media (max-width:1100px){.pd{grid-template-columns:minmax(0,1fr) 260px}.pd-tasks{grid-column:1 / -1}}
@media (max-width:860px){.pd{grid-template-columns:1fr;gap:16px}.pd-tasks{order:2}.pd-props{order:3}.pd-desc{min-height:64px}}
.nav .mlbl{display:none}
.cmd textarea{flex:1;border:0;background:none;outline:none;padding:8px 0;font:inherit;font-size:15px;min-width:0;resize:none;line-height:1.4;max-height:40vh;color:inherit}
.dump{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.dump .ph{border-bottom:1px solid var(--line)}
.dump .it{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.dump .it:first-of-type{border-top:0}
.dump .it input[type=text]{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;padding:6px 0}
.dump .acts{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}
  .rail .brand,.rail .spacer,.nav .lbl,.nav .ct,.rail .desk{display:none}
  .nav{flex-direction:column;gap:2px;padding:6px 10px;font-size:11px}
  .nav .mlbl{display:block}
  .wrap{padding-inline:16px}
  .today{grid-template-columns:1fr}
  .notes{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .hdr h1{font-size:25px}
  /* phone: labelled bottom bar, fewer items, content before the timeline */
  .rail{padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
  .nav{flex:1;min-width:0;padding:6px 2px;border-radius:10px;font-size:10px;align-items:center}
  .nav .mlbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav.nomob{display:none}
  .today .stack{order:-1}
  .today{gap:16px;margin-top:16px}
  .legend,.cmd .k{display:none}
  .btn.sm{min-height:34px}
  .wrap{padding-block:14px 28px}
  .now h3{font-size:19px}
}
@media (prefers-reduced-motion:no-preference){.blk,.nav,.btn{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="kin-engine.js"></script>
<script src="assistant.js"></script>
<script>
/* ================= Steward — engine ================= */
const MIN = 60000, SLOT = 15 * MIN, DAY = 86400000;
const uid = () => Math.random().toString(36).slice(2, 10);
const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const atMin = (day, m) => { const d = new Date(day); d.setHours(0, m, 0, 0); return d.getTime(); };
const minOfDay = (t) => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtT = (t) => { const d = new Date(t); let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12; return h + (m ? ':' + String(m).padStart(2, '0') : '') + ap; };
const fmtD = (t) => { const d = new Date(t); return WD[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate(); };
const relD = (t, now) => { const diff = Math.round((sod(t) - sod(now)) / DAY); if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday'; if (diff > 1 && diff < 7) return WD[new Date(t).getDay()]; return fmtD(t); };
const fmtDur = (m) => m >= 60 ? (Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '')) : m + 'm';
const PRI = { asap: 0, high: 1, med: 2, low: 3 };
const PRI_LABEL = { asap: 'ASAP', high: 'High', med: 'Medium', low: 'Low' };
const toLocalInput = (t) => { if (!t) return ''; const d = new Date(t); const p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
const toLocalDT = (t) => { if (!t) return ''; const d = new Date(t); const p = (n) => String(n).padStart(2, '0'); return toLocalInput(t) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const fromDateInput = (s, endOfDay) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d, endOfDay ? 17 : 0, 0, 0, 0); return t.getTime(); };

/* ---------- storage ---------- */
const KEY = 'kin.planner.v1';
function loadState() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); return true; } catch (e) { return false; } }

function defaultSettings() {
  return {
    hours: { 0: null, 1: [540, 1020], 2: [540, 1020], 3: [540, 1020], 4: [540, 1020], 5: [540, 1020], 6: null },
    breaks: [{ s: 720, e: 750, label: 'Lunch' }],
    autoApply: true, minChunk: 30, buffer: 0, horizon: 28,
  };
}

/* ---------- interval math ---------- */
function subtract(free, busy) {
  let out = free.slice();
  for (const [bs, be] of busy) {
    const next = [];
    for (const [fs, fe] of out) {
      if (be <= fs || bs >= fe) { next.push([fs, fe]); continue; }
      if (bs > fs) next.push([fs, bs]);
      if (be < fe) next.push([be, fe]);
    }
    out = next;
  }
  return out.sort((a, b) => a[0] - b[0]);
}

/* ---------- the scheduler ----------
   Real, deterministic placement: builds open time from working hours minus
   breaks, meetings and locked blocks, then places tasks earliest-deadline-first
   (ASAP first, undated tasks get a soft deadline by priority), honoring
   dependencies, start dates and minimum chunk size. */
function freeTime(state, from, to) {
  const { settings } = state;
  let free = [];
  for (let d = sod(from); d < to; d = addDays(d, 1)) {
    const h = settings.hours[new Date(d).getDay()];
    if (!h) continue;
    let segs = [[atMin(d, h[0]), atMin(d, h[1])]];
    segs = subtract(segs, settings.breaks.map((b) => [atMin(d, b.s), atMin(d, b.e)]));
    free.push(...segs);
  }
  const buf = (settings.buffer || 0) * MIN;
  const busy = state.events.map((e) => [e.start - buf, e.end + buf]);
  state.tasks.forEach((t) => (t.locked || []).forEach((b) => busy.push([b.start, b.end])));
  free = subtract(free, busy);
  return free.map(([s, e]) => [Math.max(s, from), e]).filter(([s, e]) => e - s >= SLOT);
}

function softDeadline(t, now) {
  if (t.deadline) return t.deadline;
  return now + ({ asap: 1, high: 3, med: 7, low: 14 }[t.priority] || 7) * DAY + 30 * DAY; // undated sorts after dated
}

function runSchedule(state, now) {
  const start = Math.ceil(now / SLOT) * SLOT;
  const horizonEnd = addDays(sod(now), state.settings.horizon || 28);
  let free = freeTime(state, start, horizonEnd);
  const blocks = [], info = {};
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  const open = state.tasks.filter((t) => t.status !== 'done');
  // locked blocks are part of the plan
  open.forEach((t) => (t.locked || []).forEach((b) => blocks.push({ id: 'L' + b.id, taskId: t.id, start: b.start, end: b.end, locked: true, lockId: b.id })));
  const lastEnd = {};
  const remaining = {};
  open.forEach((t) => {
    const lockedMin = (t.locked || []).filter((b) => b.end > now).reduce((a, b) => a + (b.end - Math.max(b.start, now)) / MIN, 0);
    remaining[t.id] = Math.max(0, (t.duration || 30) - (t.spent || 0) - lockedMin);
    lastEnd[t.id] = Math.max(0, ...(t.locked || []).map((b) => b.end));
  });
  const placed = new Set();
  const pending = new Set(open.map((t) => t.id));
  const depsOf = (t) => (t.deps || []).filter((d) => byId[d] && byId[d].status !== 'done');
  let guard = 0;
  while (pending.size && guard++ < 2000) {
    const ready = [...pending].map((id) => byId[id]).filter((t) => depsOf(t).every((d) => placed.has(d)));
    if (!ready.length) { // cycle
      [...pending].forEach((id) => { info[id] = { unscheduled: true, reason: 'Dependency loop — check this task’s “waits on” list.' }; });
      break;
    }
    ready.sort((a, b) => ((a.priority === 'asap' ? 0 : 1) - (b.priority === 'asap' ? 0 : 1)) || (softDeadline(a, now) - softDeadline(b, now)) || (PRI[a.priority] - PRI[b.priority]) || (a.created - b.created));
    const t = ready[0];
    pending.delete(t.id); placed.add(t.id);
    let need = remaining[t.id];
    const depEnd = Math.max(0, ...depsOf(t).map((d) => lastEnd[d] || 0));
    const earliest = Math.max(start, depEnd, t.startDate || 0);
    const chunk = Math.max(15, t.minChunk || state.settings.minChunk || 30);
    const why = [];
    if (depEnd > start) why.push('after ' + depsOf(t).map((d) => '“' + byId[d].title + '”').join(', ') + ' finishes');
    if ((t.startDate || 0) > start) why.push('not before its start date ' + fmtD(t.startDate));
    let first = null;
    for (let i = 0; i < free.length && need > 0; i++) {
      let [fs, fe] = free[i];
      if (fe <= earliest) continue;
      fs = Math.max(fs, earliest);
      const len = (fe - fs) / MIN;
      if (len < Math.min(chunk, need)) continue;
      const take = Math.min(len, need);
      const bs = fs, be = fs + take * MIN;
      blocks.push({ id: t.id + ':' + bs, taskId: t.id, start: bs, end: be });
      first = first || bs;
      lastEnd[t.id] = Math.max(lastEnd[t.id], be);
      need -= take;
      const rest = [];
      if (fs > free[i][0]) rest.push([free[i][0], fs]);
      if (be < fe) rest.push([be, fe]);
      free.splice(i, 1, ...rest);
      i += rest.length - 1;
    }
    const inf = { first, end: lastEnd[t.id], why };
    if (need > 0) { inf.unscheduled = true; inf.short = need; }
    if (t.deadline && lastEnd[t.id] > t.deadline) inf.late = true;
    info[t.id] = inf;
  }
  blocks.sort((a, b) => a.start - b.start);
  return { blocks, info, computedAt: now };
}

/* conflicts + attention items */
function attention(state, plan, now) {
  const out = [];
  const byId = Object.fromEntries(state.tasks.map((t) => [t.id, t]));
  state.tasks.filter((t) => t.status !== 'done').forEach((t) => {
    const inf = plan.info[t.id] || {};
    if (t.deadline && t.deadline < now) out.push({ sev: 'bad', kind: 'overdue', task: t, title: 'Overdue: ' + t.title, text: 'Deadline was ' + relD(t.deadline, now) + ' ' + fmtT(t.deadline) + '. ' + fmtDur(remainingMin(t)) + ' of work left.' });
    else if (inf.unscheduled && inf.short) out.push({ sev: 'bad', kind: 'nofit', task: t, title: 'Won’t fit: ' + t.title, text: fmtDur(Math.round(inf.short)) + ' can’t be placed in the next ' + state.settings.horizon + ' days of working time.' });
    else if (inf.late) {
      const over = Math.round((inf.end - t.deadline) / MIN);
      const beforeIt = plan.blocks.filter((b) => b.start < t.deadline && !b.locked && byId[b.taskId] && b.taskId !== t.id && (!byId[b.taskId].deadline || byId[b.taskId].deadline > t.deadline));
      const bump = beforeIt.length ? byId[beforeIt[0].taskId] : null;
      out.push({ sev: 'bad', kind: 'late', task: t, projected: inf.end, bump, title: 'At risk: ' + t.title, text: 'Due ' + relD(t.deadline, now) + ' ' + fmtT(t.deadline) + ', but the earliest it can finish is ' + relD(inf.end, now) + ' ' + fmtT(inf.end) + '.' + (over ? '' : '') });
    }
    const blockedBy = (t.deps || []).map((d) => byId[d]).filter((d) => d && d.status === 'blocked');
    if (t.status === 'blocked') out.push({ sev: 'warn', kind: 'blocked', task: t, title: 'Blocked: ' + t.title, text: t.blockedNote || 'Marked blocked. It stays scheduled so the time is held.' });
    else if (blockedBy.length) out.push({ sev: 'warn', kind: 'blocked', task: t, title: 'Waiting: ' + t.title, text: 'Depends on blocked task “' + blockedBy[0].title + '”.' });
  });
  // projects at risk
  state.projects.forEach((p) => {
    if (p.status === 'done' || !p.deadline) return;
    const ts = state.tasks.filter((t) => t.projectId === p.id && t.status !== 'done');
    const end = Math.max(0, ...ts.map((t) => (plan.info[t.id] || {}).end || 0));
    if (end > p.deadline) out.push({ sev: 'warn', kind: 'project', project: p, title: 'Project at risk: ' + p.name, text: 'Current plan finishes ' + relD(end, now) + ', after the ' + fmtD(p.deadline) + ' target.' });
  });
  return out;
}
const remainingMin = (t) => Math.max(0, (t.duration || 30) - (t.spent || 0));

/* ---------- natural-language capture (rule-based; runs on-device) ---------- */
function parseWhen(text, now) {
  let s = ' ' + text + ' ';
  let date = null, time = null, hit = [];
  const take = (re, fn) => { const m = s.match(re); if (m) { const r = fn(m); if (r !== undefined) { hit.push(m[0]); s = s.replace(m[0], ' '); } return r; } };
  take(/\b(today|tonight|this afternoon|this morning)\b/i, () => (date = sod(now)));
  if (date == null) take(/\b(tomorrow|tmrw|tmr)\b/i, () => (date = addDays(sod(now), 1)));
  if (date == null) take(/\bin (\d+) (day|days|week|weeks)\b/i, (m) => (date = addDays(sod(now), +m[1] * (m[2].startsWith('week') ? 7 : 1))));
  if (date == null) take(/\bnext week\b/i, () => { const d = new Date(sod(now)); const k = (8 - d.getDay()) % 7 || 7; return (date = addDays(sod(now), k)); });
  if (date == null) take(/\b(?:next |this |on )?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|sday|urday|rsday)?\b/i, (m) => {
    const idx = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(m[1].slice(0, 3).toLowerCase());
    const cur = new Date(now).getDay(); let k = (idx - cur + 7) % 7; if (k === 0) k = 7; if (/next/i.test(m[0]) && k < 7) k += 0;
    return (date = addDays(sod(now), k));
  });
  if (date == null) take(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.? (\d{1,2})(?:st|nd|rd|th)?\b/i, (m) => {
    const mi = MON.map((x) => x.toLowerCase()).indexOf(m[1].slice(0, 3).toLowerCase()); let d = new Date(new Date(now).getFullYear(), mi, +m[2]).getTime(); if (d < sod(now)) d = new Date(new Date(now).getFullYear() + 1, mi, +m[2]).getTime(); return (date = d);
  });
  if (date == null) take(/\b(\d{1,2})\/(\d{1,2})\b/i, (m) => { let d = new Date(new Date(now).getFullYear(), +m[1] - 1, +m[2]).getTime(); if (d < sod(now)) d = addDays(d, 365); return (date = d); });
  take(/\b(?:at |@ ?)?(\d{1,2})(?::(\d{2}))? ?(am|pm|a|p)\b/i, (m) => { let h = +m[1] % 12; if (m[3][0].toLowerCase() === 'p') h += 12; return (time = h * 60 + (+m[2] || 0)); });
  if (time == null) take(/\bat (\d{1,2}):(\d{2})\b/i, (m) => (time = +m[1] * 60 + +m[2]));
  if (time == null) take(/\b(noon)\b/i, () => (time = 720));
  return { date, time, rest: s, hit };
}

function parseCommand(raw, state, now) {
  const text = raw.trim();
  const low = text.toLowerCase();
  if (/^(find|search|where('s| is)|look up)\b/.test(low)) return { kind: 'search', q: text.replace(/^(find|search( for)?|where('s| is)|look up)\s*/i, '') };
  if (/^(help me )?plan\b|^(help me )?(organi[sz]e|prepare|prep) (a|an|the|my)\b|^new project\b/.test(low)) return { kind: 'plan', goal: text.replace(/^(help me )?(plan|new project:?)\s*/i, '') };
  let s = text;
  // durations
  let duration = null;
  s = s.replace(/\b(?:for )?(\d+(?:\.\d+)?)\s?(h|hr|hrs|hour|hours)\b(?:\s?(\d+)\s?(m|min|mins))?/i, (m, a, _u, b) => { duration = Math.round(+a * 60 + (+b || 0)); return ' '; });
  if (duration == null) s = s.replace(/\b(?:for )?(\d+)\s?(m|min|mins|minutes)\b/i, (m, a) => { duration = +a; return ' '; });
  if (duration == null) s = s.replace(/\b(?:for )?(half an hour|an hour|a half hour)\b/i, (m) => { duration = /half/.test(m) ? 30 : 60; return ' '; });
  let priority = null;
  s = s.replace(/\b(asap|urgent|urgently)\b|!!!/i, () => { priority = 'asap'; return ' '; });
  s = s.replace(/\b(high priority|important|high)\b|!!/i, (m) => { priority = priority || 'high'; return ' '; });
  s = s.replace(/\b(low priority|someday|whenever)\b/i, () => { priority = priority || 'low'; return ' '; });
  let projectId = null;
  s = s.replace(/#([\w-]+)/, (m, tag) => { const p = state.projects.find((p) => p.name.toLowerCase().replace(/\s+/g, '-').startsWith(tag.toLowerCase())); if (p) projectId = p.id; return ' '; });
  const hard = /\bby\b/i.test(s);
  const w = parseWhen(s, now);
  let rest = w.rest.replace(/\b(by|due|on|before|at|for)\s*$/g, ' ');
  rest = rest.replace(/\b(by|due|before)\s+(?=\s|$)/g, ' ');
  let title = rest.replace(/^\s*(please\s+)?(add|create|make|new|put|schedule)?\s*(a\s+|an\s+)?(task|todo|to-do|reminder)?\s*(to\s+|for\s+|:\s*)?/i, '')
    .replace(/^\s*remind me to\s+/i, '').replace(/\s+(by|due|on|at|for|before)\s*$/i, '').replace(/\s{2,}/g, ' ').trim();
  title = title.charAt(0).toUpperCase() + title.slice(1);
  const isMeeting = w.time != null && /\b(meet|meeting|call|sync|1:1|one on one|appointment|appt|lunch with|coffee|interview|dentist|doctor|zoom|standup|check-in|with)\b/i.test(text);
  if (isMeeting) {
    const day = w.date != null ? w.date : (w.time * MIN + sod(now) > now ? sod(now) : addDays(sod(now), 1));
    const start = atMin(day, w.time);
    return { kind: 'event', title: title || 'Meeting', start, end: start + (duration || 30) * MIN };
  }
  let deadline = null;
  if (w.date != null) deadline = w.time != null ? atMin(w.date, w.time) : atMin(w.date, (state.settings.hours[new Date(w.date).getDay()] || [0, 1020])[1]);
  return { kind: 'task', title: title || 'Untitled task', duration: duration || 30, priority: priority || 'med', deadline, projectId, hard };
}

/* ---------- project planner (template engine; editable draft) ---------- */
const BLUEPRINTS = [
  { match: /retreat|offsite|camp|conference|event|council|gathering|party|banquet|workshop|summit/i, kind: 'Event', stages: [
    ['Define', [['Set goals, audience and budget ceiling', 60], ['Pick date range and rough headcount', 30]]],
    ['Secure', [['Shortlist and contact venues', 90, 'Define'], ['Book venue and sign agreement', 60], ['Confirm speakers / facilitators', 60]]],
    ['Build', [['Draft run-of-show and schedule', 120, 'Secure'], ['Plan meals, lodging and transport', 90], ['Create promo and registration page', 90]]],
    ['Promote', [['Send invitations and registration link', 45, 'Build'], ['Follow up with non-responders', 30]]],
    ['Deliver', [['Final headcount to venue and caterer', 30, 'Promote'], ['Prep materials, signage, packing list', 90], ['Brief team and volunteers', 45]]],
    ['Close', [['Send thank-yous and feedback survey', 45, 'Deliver'], ['Debrief and log lessons learned', 45]]],
  ], assume: ['Team is you plus a few helpers — every task is assigned to you until you change it.', 'Venue booking needs roughly 2 weeks lead time.', 'Budget approval isn’t a separate step — add one if it is for you.'], ask: 'Roughly how many people are coming? That changes venue, lodging and food tasks the most.' },
  { match: /launch|release|ship|rollout|campaign|series/i, kind: 'Launch', stages: [
    ['Scope', [['Write one-page brief: goal, audience, success measure', 60], ['List deliverables and owners', 30]]],
    ['Make', [['Draft core content / materials', 180, 'Scope'], ['Review round with 1–2 people', 45], ['Revise and finalize', 90]]],
    ['Prepare', [['Build announcement copy and visuals', 90, 'Make'], ['Schedule channels (email, social, meetings)', 45]]],
    ['Launch', [['Publish and announce', 30, 'Prepare'], ['Monitor responses and answer questions', 60]]],
    ['Review', [['Collect results and write a short recap', 45, 'Launch']]],
  ], assume: ['One review round is enough.', 'Materials are created in-house, not outsourced.'], ask: 'Who has to sign off before it goes out?' },
  { match: /report|paper|sermon|talk|presentation|curriculum|lesson|article|proposal|write|study|research|book/i, kind: 'Writing', stages: [
    ['Research', [['Gather sources and notes', 120], ['Outline the main points', 60]]],
    ['Draft', [['Write first draft', 180, 'Research'], ['Build supporting visuals / handouts', 60]]],
    ['Refine', [['Get feedback from one reader', 30, 'Draft'], ['Revise and tighten', 90], ['Final proofread and format', 45]]],
    ['Deliver', [['Submit / present / publish', 30, 'Refine']]],
  ], assume: ['Draft takes about 3 hours of focused time.', 'One outside reader is available within 2 days.'], ask: 'How long does the finished piece need to be?' },
  { match: /hire|recruit|onboard|volunteer|staff|team/i, kind: 'People', stages: [
    ['Define', [['Write role description and expectations', 60]]],
    ['Find', [['Share opening with network and channels', 45, 'Define'], ['Screen candidates', 90], ['Hold conversations / interviews', 120]]],
    ['Decide', [['Check references', 60, 'Find'], ['Make offer / confirm', 30]]],
    ['Onboard', [['Prepare onboarding checklist', 45, 'Decide'], ['First-week check-in', 30]]],
  ], assume: ['About 5 candidates to screen.'], ask: 'Is there a hard start date for the new person?' },
];
const GENERIC = { kind: 'Project', stages: [
  ['Clarify', [['Define the outcome and what “done” looks like', 45], ['List constraints, people involved and budget', 30]]],
  ['Plan', [['Break work into steps and pick owners', 45, 'Clarify'], ['Gather what you need to start', 60]]],
  ['Do', [['Complete the main work', 180, 'Plan'], ['Check progress with stakeholders', 30]]],
  ['Finish', [['Review, wrap up and share the result', 45, 'Do']]],
], assume: ['Every task is assigned to you.', 'Durations are rough first estimates.'], ask: 'What would make this project clearly successful?' };

function draftProject(goal, state, now) {
  const w = parseWhen(goal, now);
  const bp = BLUEPRINTS.find((b) => b.match.test(goal)) || GENERIC;
  let name = w.rest.replace(/^\s*(help me\s+)?(plan|organi[sz]e|prepare|prep)\s+/i, '').replace(/\b(by|before|for|on|due)\s*$/i, '').replace(/\s{2,}/g, ' ').trim();
  name = name.replace(/^(a|an|the|my|our)\s+/i, '');
  name = name.charAt(0).toUpperCase() + name.slice(1) || 'New project';
  const totalMin = bp.stages.reduce((a, [, ts]) => a + ts.reduce((b, t) => b + t[1], 0), 0);
  const target = w.date != null ? atMin(w.date, 1020) : addDays(sod(now), Math.max(14, Math.ceil(totalMin / 60 / 2) * 2 + 7)) + 1020 * MIN;
  const span = target - now;
  let acc = 0;
  const stages = bp.stages.map(([sname, ts], si) => {
    const tasks = ts.map(([title, dur, dep], ti) => {
      acc += dur;
      return { key: si + '.' + ti, title, duration: dur, include: true, depStage: dep || null, deadline: sod(now + span * (acc / totalMin)) + 1020 * MIN };
    });
    return { name: sname, tasks };
  });
  const assume = bp.assume.slice();
  if (w.date == null) assume.unshift('No target date given — I assumed ' + fmtD(target) + '.');
  assume.push('Deadlines are spread across the timeline by effort; adjust any of them before accepting.');
  return { goal, name, kind: bp.kind, target, stages, assume, ask: bp.ask, dateGiven: w.date != null };
}

/* ---------- notes → actions ---------- */
function extractFromNote(note, state, now) {
  const lines = note.body.split('\n');
  const actions = [], decisions = [], events = [];
  lines.forEach((ln, i) => {
    const l = ln.trim();
    if (!l) return;
    const dm = l.match(/^[-*]?\s*(decision|decided|agreed)\s*[:\-]?\s*(.+)/i);
    if (dm) { decisions.push({ line: i, text: dm[2] }); return; }
    const am = l.match(/^[-*]?\s*(?:\[ \]|todo[:\s]|action( item)?[:\s]|ai[:\s]|next step[:\s]|follow[- ]up[:\s])\s*(.+)/i) || l.match(/^[-*]?\s*(?:@?(me|i|jp)\s+(?:will|to|need to|should)\s+)(.+)/i);
    if (am) {
      const body = am[am.length - 1];
      const p = parseCommand(body, state, now);
      if (p.kind === 'event') events.push({ line: i, include: true, ...p });
      else actions.push({ line: i, include: true, ...p, kind: 'task' });
      return;
    }
    const other = l.match(/^[-*]?\s*@?([A-Z][a-z]+)\s+(?:will|to)\s+(.+)/);
    if (other) actions.push({ line: i, include: false, kind: 'task', title: other[2].charAt(0).toUpperCase() + other[2].slice(1), duration: 30, priority: 'med', deadline: parseCommand(other[2], state, now).deadline, owner: other[1], note: 'Owned by ' + other[1] + ' — track as a follow-up?' });
  });
  const heads = lines.filter((l) => /^#+\s/.test(l)).map((l) => l.replace(/^#+\s*/, ''));
  const summary = [
    heads.length ? 'Covers ' + heads.slice(0, 4).join(', ') + '.' : null,
    decisions.length ? decisions.length + ' decision' + (decisions.length > 1 ? 's' : '') + ' recorded.' : 'No decisions marked.',
    actions.length ? actions.length + ' possible action' + (actions.length > 1 ? 's' : '') + '.' : 'No action items found.',
  ].filter(Boolean).join(' ');
  return { summary, decisions, actions, events };
}

/* ---------- sample data (clearly marked) ---------- */
function sampleState(now) {
  const d0 = sod(now), d = (n, m) => atMin(addDays(d0, n), m);
  const nextWork = (n) => { let k = n; while ([0, 6].includes(new Date(addDays(d0, k)).getDay())) k++; return k; };
  const p1 = { id: uid(), name: 'Fall Youth Retreat', color: 'teal', deadline: d(nextWork(20), 1020), status: 'active', created: now, sample: true };

  const b = t({ title: 'Draft run-of-show', projectId: p1.id, duration: 120, deps: [a.id], deadline: d(nextWork(8), 1020) });
  const c = t({ title: 'Outline session 1 teaching', projectId: p2.id, duration: 90, priority: 'high', deadline: d(nextWork(1), 1020) });
  const e = t({ title: 'Email corps officers about dates', projectId: p2.id, duration: 30, deadline: d(nextWork(2), 1020) });
  const f = t({ title: 'Expense report', duration: 45, priority: 'low' });
  const g = t({ title: 'Reply to regional budget question', duration: 15, priority: 'asap' });
  const ev = (title, day, s, len) => ({ id: uid(), title, start: d(day, s), end: d(day, s + len), kind: 'meeting', sample: true });
  const w0 = nextWork(0);
  return {

    events: [ev('Team check-in', w0, 600, 30), ev('Call with divisional youth leader', w0, 840, 45), ev('Planning sync', nextWork(1), 570, 60)],
    notes: [{ id: uid(), title: 'Retreat planning call', projectId: p1.id, updated: now, sample: true, body: '# Retreat planning call\n\nAttendees: me, Sam, Dana\n\n## Venue\nDecision: keep it under 2 hours from Chicago\n- [ ] Call Camp Lake about Nov dates tomorrow 30m\n- Sam will price out buses\n\n## Program\nAction: draft theme options by friday 1h\nDecided: Friday night is worship + games\n' }],
    plan: null,
  };
}
